<!doctype html>
<html lang="en">
<head>

<title>Acme Brew data loop</title>
<style>
@font-face{font-family:"Inter Tight";font-style:normal;font-weight:800;font-display:block;src:url(data:font/woff2;base64,__FONT:inter-tight-latin-800-normal.woff2__) format("woff2")}

<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * Every number on screen comes from FILM.data. A dataset holds values (one,
 * or one per category, or several series), a format, and the BRIEF.md Facts
 * row it comes from (`source`); FILM.sources says what the on-screen source
 * line reads for each row. Text shows a data value with {id.KEY}: {week.sum},
 * {week.SAT}, {milk.OAT}. Charts and counters take `data` or `ref`.
 *
 * Times are seconds; beat(n) and bar(n) put them on the tempo grid.
 * Positions are canvas pixels; a text layer's x is its anchor, y its
 * baseline; a chart's box is its plot area [x0, y0, x1, y1].
 * Two kinds of motion, never mixed:
 *   enter / keys / exit  move the element (dx, dy, scale, op, rot, blur,
 *                        trim, fill), on any spring
 *   grow                 moves the data (bars grow, a line draws, a donut
 *                        sweeps, a counter counts), on a critically damped
 *                        spring only: an overshoot would show a false value
 * A 'hold' loop ends on a still copy of frame 0: the last scene (wrap) is on
 * screen at rest at t = 0, leaves at wrap.exit, and is rebuilt at the end.
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Acme Brew data loop',
  alt: '48,215 counts up on a crema frame: cups brewed in one week. Seven columns grow, Monday to Sunday; Saturday, the busiest day at 9,120 cups, lights up. A donut sweeps: oat milk leads with 46 percent, dairy 38, none 16. Acme Brew, example.com. Demo data, fictional product.',
  W: 1080, H: 1080, FPS: 60, DUR: bar(6), BPM,
  loop: 'hold',
  palette: { bg: '#140F0C', ink: '#140F0C', well: '#2B221C', paper: '#F7F0E6', muted: '#A8998A', crema: '#FFA62B', foam: '#E6D5C3', roast: '#8A7462' },
  fonts: {
    display: { family: 'Inter Tight', weight: 800 },
    label: { family: 'Inter', weight: 700 },
    mono: { family: 'IBM Plex Mono', weight: 500 },
  },
  grid: { margin: 104, unit: 8 },
  poster: beat(11),                            // the week chart at rest, lit and annotated
  // What the on-screen source line says for each Facts row of BRIEF.md.
  sources: { F2: 'DEMO DATA, FICTIONAL PRODUCT', F3: 'DEMO DATA, FICTIONAL PRODUCT' },
  data: {
    week: { label: 'Cups brewed per day, one week', unit: 'cups', source: 'F2',
      categories: ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'],
      values: [5820, 6140, 6390, 6905, 7660, 9120, 6180] },
    milk: { label: 'Milk in each cup, share of cups', unit: '%', source: 'F3', format: { suffix: '%' }, total: 100,
      categories: ['OAT', 'DAIRY', 'NONE'], values: [46, 38, 16] },
  },
  scenes: [
    // Lockup. At rest on frame 0, shrinks away at t 0 (wrap), rebuilt as the donut leaves, then holds.
    {
      id: 'lockup', t0: beat(19.25), t1: bar(6), in: 'none',
      wrap: { exit: 0, to: { scale: 0 }, spring: 'EXIT', stagger: 32 },
      layers: [
        { id: 'BEAN', kind: 'mark', shape: 'ellipse', rx: 64, ry: 88, rot: 32, x: 540, y: 368, fill: 'crema',
          enter: { at: beat(19.25), from: { scale: 0 }, spring: 'POP' } },
        { id: 'CREASE', kind: 'mark', shape: 'path', d: 'M0 -70 C 30 -30, -30 30, 0 70', size: 140, rot: 32, x: 540, y: 368, stroke: 'ink', width: 15,
          enter: { at: beat(19.75), from: { trim: [0, 0] }, spring: 'TRACE' }, accent: 'land' },
        { id: 'ACME', kind: 'text', text: 'ACME BREW', font: 'display', cap: 96, track: 10, anchor: 'C', x: 540, y: 624, fill: 'paper',
          enter: { at: beat(19.5), from: { dy: 64, op: 0, blur: 10 }, spring: 'LAND', stagger: 32 } },
        { id: 'URL', kind: 'text', text: 'EXAMPLE.COM', font: 'mono', size: 44, track: 40, anchor: 'C', x: 540, y: 720, fill: 'crema',
          enter: { at: beat(20.25), typed: true } },
        { id: 'DEMO', kind: 'text', text: 'DEMO DATA, FICTIONAL PRODUCT', font: 'mono', size: 24, track: 20, anchor: 'L', x: 104, y: 968, fill: 'muted',
          enter: { at: beat(20.75), typed: true } },
      ],
    },
    // Hook. A crema circle opens from the bean; the week's total counts up.
    {
      id: 'hook', t0: 0, t1: beat(6), in: { kind: 'circle', x: 540, y: 368 }, bg: 'crema',
      punch: { at: beat(4.5), z: 1.04 },
      source: { fill: 'ink' },
      layers: [
        { id: 'TOTAL', kind: 'counter', ref: 'week.sum', font: 'display', fit: 872, anchor: 'C', x: 540, y: 520, fill: 'ink',
          enter: { at: beat(0.25), from: { dy: 48, op: 0 }, spring: 'LAND' },
          grow: { at: beat(0.25), spring: 'COUNT' }, accent: 'land' },
        { id: 'BREWED', kind: 'text', text: 'CUPS BREWED.', font: 'display', cap: 72, track: 10, anchor: 'C', x: 540, y: 680, fill: 'ink',
          enter: { at: beat(2), from: { dy: 48, op: 0, blur: 8 }, spring: 'LAND', stagger: 32 } },
        { id: 'WEEKLY', kind: 'text', text: 'IN ONE WEEK', font: 'mono', size: 32, track: 40, anchor: 'C', x: 540, y: 768, fill: 'ink',
          enter: { at: beat(3), typed: true } },
      ],
    },
    // Breakdown. Dark bars sweep up over the crema; seven columns grow, Saturday lights up.
    {
      id: 'week', t0: beat(6), t1: beat(13), in: { kind: 'wipe', n: 7, dir: 'up', color: 'bg', stagger: 32 },
      punch: { at: beat(11.5), z: 1.04 },
      layers: [
        { id: 'PERDAY', kind: 'text', text: 'CUPS PER DAY', font: 'display', cap: 56, track: 10, anchor: 'L', x: 104, y: 168, fill: 'paper',
          enter: { at: beat(6), from: { dy: 48, op: 0, blur: 8 }, spring: 'LAND', stagger: 32 } },
        { id: 'WEEK', kind: 'columns', data: 'week', box: [104, 344, 976, 800], width: 0.6, radius: 10, fill: 'roast',
          values: { font: 'label', size: 30, fill: 'paper' }, cats: { font: 'mono', size: 26, fill: 'muted' },
          grow: { at: beat(6.75), spring: 'GROW', stagger: 16 },
          keys: [{ at: beat(9.5), highlight: 'SAT', fill: 'crema' }] },
        { id: 'PEAK', kind: 'note', chart: 'WEEK', cat: 'SAT', text: 'BUSIEST DAY', font: 'mono', size: 26, track: 20, anchor: 'C', x: 796, y: 232, fill: 'paper', stroke: 'crema',
          enter: { at: beat(10) } },
      ],
    },
    // Composition. A cut on the downbeat onto the whole (the track); the parts sweep in and the leading share counts.
    {
      id: 'milk', t0: beat(13), t1: beat(19.5), in: 'cut',
      punch: { at: beat(17), z: 1.04 },
      layers: [
        { id: 'LEADS', kind: 'text', text: 'OAT MILK LEADS.', font: 'display', cap: 56, track: 10, anchor: 'L', x: 104, y: 168, fill: 'paper',
          enter: { at: beat(13), from: { dy: 48, op: 0, blur: 8 }, spring: 'LAND', stagger: 32 } },
        { id: 'MILK', kind: 'donut', data: 'milk', x: 540, y: 584, r: 264, width: 80, gap: 8, track: 'well',
          colors: { OAT: 'crema', DAIRY: 'foam', NONE: 'roast' },
          centre: { cat: 'OAT', font: 'display', cap: 100, fill: 'paper', caption: 'OAT', captionFont: 'mono', captionSize: 28, captionFill: 'muted' },
          labels: { font: 'label', size: 32, fill: 'paper', catFill: 'muted' },
          grow: { at: beat(13.25), spring: 'SWEEP' }, accent: 'land',
          exit: { at: beat(19), to: 'zero', spring: 'EXIT' } },
      ],
      exit: { at: beat(19), to: { dy: -48, op: 0 }, spring: 'EXIT' },
    },
  ],
};

/* ===== CORE BEGIN: shared/core.js, synced by tools/sync.mjs. Do not edit it here. ===== */
/* ==========================================================================
 * CORE: the deterministic runtime every motion-* engine shares.
 * Source: shared/core.js in the motion-launch-videos repo, copied into each
 * template by tools/sync.mjs. Do not edit it inside a film.
 *
 * seek(t) is a pure function of (t mod DUR): same t, same pixels, whatever was
 * drawn before. No timers, no Date, no Math.random, no state between calls.
 *   - Springs are closed-form step responses, one per target change, snapped
 *     to exactly 1 once settled. A Prop is a base value plus its springs.
 *     Springs still settling when the loop ends carry over the seam.
 *   - Periodic motion runs a whole number of cycles per loop (cyc, wave,
 *     loopNoise), so it is exact at the seam by construction.
 *   - Randomness is seeded (mulberry32, hash).
 *   - Continuous motion reads the exact t; discrete state (typing, drawings
 *     held on twos, sprite frames, line boil) reads the quantised q, so every
 *     subframe of one output frame agrees on it.
 *   - Motion blur averages 1 to 64 subframes on a trailing 270-degree
 *     shutter, one per 5 px of movement, never across a hard cut.
 * The engine below describes its vertical through hooks (build, draw, disp,
 * checks, stills, layout, visible, lastChange) and calls boot(ENGINE) last.
 * The core keeps its internals to itself and exports the helpers listed at
 * its end, so an engine can name its own functions freely.
 * ========================================================================== */
const CORE = (() => {
/* ---------------- formats: one film, several aspect ratios ---------------- */
// ?format=9x16 (the scripts pass --format 9:16) re-sizes the film before anything reads FILM. A key of
// FILM.formats patches any field for that format (objects merge, arrays of items with an id merge by id,
// anything else is replaced). Without W and H in the patch, the standard ratios keep the film's short side:
// 1:1, 4:5, 9:16, 16:9. Positions stay authored in the base format; an engine maps them with fmtX/fmtY/fmtPos,
// which keep an element's offset from the centre (the default) or from the edge its pin names.
const BW = FILM.W, BH = FILM.H;
const FORMAT = (() => { const m = /[?&]format=(\d+)[x:](\d+)/.exec(location.search); return m ? `${m[1]}:${m[2]}` : null; })();
function mergeInto(a, b) {
  for (const [k, v] of Object.entries(b)) {
    const o = a[k];
    if (Array.isArray(v) && Array.isArray(o) && v.every((x) => x && x.id != null)) {
      for (const it of v) { const t = o.find((x) => x && x.id === it.id); if (t) mergeInto(t, it); else o.push(it); }
    } else if (v && typeof v === 'object' && !Array.isArray(v) && o && typeof o === 'object' && !Array.isArray(o)) mergeInto(o, v);
    else a[k] = v;
  }
  return a;
}
if (FORMAT) {
  const patch = (FILM.formats || {})[FORMAT] || {};
  const [ra, rb] = FORMAT.split(':').map(Number), short = Math.min(BW, BH);
  if (!(ra > 0 && rb > 0)) throw new Error(`bad format ${FORMAT}`);
  const size = ra === rb ? [short, short] : ra < rb ? [short, Math.round(short * rb / ra / 2) * 2] : [Math.round(short * ra / rb / 2) * 2, short];
  mergeInto(FILM, { W: size[0], H: size[1], ...patch });
}
const { W, H, FPS, DUR } = FILM;
const NFR = Math.round(DUR * FPS);                 // output frames in the loop
const CX = W / 2, CY = H / 2;
const U = Math.min(W, H) / 1080;                   // scale for built-in pixel constants
const PAL = FILM.palette;
const USED = new Set();                            // palette roles the film draws with
const col = (k) => PAL[k] || k;                    // look a role up (while drawing)
const role = (k) => { USED.add(k); return PAL[k] || k; };   // resolve and register a role (at build time)
const GRID = FILM.grid || {};
const MARGIN = GRID.margin != null ? GRID.margin : Math.round(104 * U);
const UNIT = GRID.unit || 8;
const MEASURE = W - 2 * MARGIN;
const FS = Math.min(W, H) / Math.min(BW, BH);      // base px -> this format's px
const FMT = { key: FORMAT || `${BW}x${BH}`, W, H, BW, BH, s: FS, aspect: W === H ? 'square' : W < H ? 'vertical' : 'horizontal' };
// pin: 'l' or 'r' keeps the distance from that edge, 't' or 'b' likewise; otherwise the offset from the centre
const fmtX = (x, pin = '') => /l/.test(pin) ? x * FS : /r/.test(pin) ? W - (BW - x) * FS : W / 2 + (x - BW / 2) * FS;
const fmtY = (y, pin = '') => /t/.test(pin) ? y * FS : /b/.test(pin) ? H - (BH - y) * FS : H / 2 + (y - BH / 2) * FS;
const fmtPos = (x, y, pin = '') => [fmtX(x, pin), fmtY(y, pin)];
const fmtSz = (v) => v * FS;
const LOOP = FILM.loop || 'hold';                  // 'hold': ends on a still copy of frame 0; 'cycle': periodic, continuous over the seam; 'none'
const BLUR = FILM.blur !== false;                  // false: one sample per frame (cartoon, pixel art)
const SHUTTER = 0.75;                              // 270 degrees, trailing
const MIN_SAMPLES = 4, MAX_SAMPLES = 64, PX_PER_SAMPLE = 5;   // Uint16 sums hold up to 257 x 255
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', FILM.alt || FILM.title || '');
if (FILM.title) document.title = FILM.title;
document.documentElement.style.background = PAL.bg;
document.body.style.background = PAL.bg;
// CPU raster everywhere: Chrome moves a canvas from GPU to CPU after repeated getImageData
// reads, which changes antialiasing mid-render. Pin every 2D context from its first call.
// An alpha channel, though every frame fills it opaque: on an opaque canvas Chromium draws text with
// LCD subpixel antialiasing (red and blue fringes on every glyph), whatever the command line says.
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: true });
const mkCanvas = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const mk2d = (w, h) => { const c = mkCanvas(w, h); return [c, c.getContext('2d', { willReadFrequently: true })]; };
const mctx = mkCanvas().getContext('2d', { willReadFrequently: true });   // measuring only

/* ---------------- springs: closed-form step responses ---------------- */
// [zeta, omega]. Underdamped (zeta < 1) overshoots and lands; zeta = 1 glides in without overshoot.
// Engines add their own (boot merges ENGINE.springs, then FILM.springs).
const SP = {
  SLAM: [0.60, 30.0], LAND: [0.72, 28.0], PUNCH: [0.65, 31.0], FADE: [1, 32.4],
  FOCUS: [1, 19.5], EXIT: [1, 32.4], PAN: [1, 32.4], DRAW: [1, 32.4],
  LINE: [0.80, 15.6], MASK: [1, 19.5], TICK: [1, 32.4],
};
const spring = (sp) => { const s = typeof sp === 'string' ? SP[sp] : sp; if (!s) throw new Error(`unknown spring ${sp}`); return s; };
const settle = (sp) => 16 / (sp[0] * sp[1]);       // after this the response snaps to exactly 1
function S(tau, sp) {
  const z = sp[0], w = sp[1];
  if (tau <= 0) return 0;
  if (tau >= settle(sp)) return 1;                 // residual < 2e-6 of the move: snap, so loops are bit-exact
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
  }
  return 1 - (1 + w * tau) * Math.exp(-w * tau);
}
function dS(tau, sp) {                             // d S / d tau, per second
  const z = sp[0], w = sp[1];
  if (tau <= 0 || tau >= settle(sp)) return 0;
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (w * w / wd) * Math.exp(-z * w * tau) * Math.sin(wd * tau); }
  return w * w * tau * Math.exp(-w * tau);
}
// the visible landing: the first crossing of the target when underdamped, 95 % when critically damped
function landT(sp) {
  sp = spring(sp);
  const z = sp[0], w = sp[1];
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (Math.PI - Math.atan(wd / (z * w))) / wd; }
  let a = 0, b = settle(sp);
  for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (S(m, sp) < 0.95) a = m; else b = m; }
  return b;
}

// A property = base value + one spring per target change (superposed). set() is an instant jump
// that cancels earlier springs; use it only while the element is invisible, at a hard cut, or hidden
// inside fast motion blur. Events are added in time order. In a looping film, springs still settling
// at the end of the loop carry over the seam into its start (only while no set() has happened yet),
// so the film is continuous there; the value a Prop ends on must equal the value it starts from.
const PROPS = [];
class Prop {
  constructor(v0, name) { this.v0 = v0; this.last = v0; this.ev = []; this.tLast = -Infinity; this.name = name || '?'; this.tail = null; this.firstSet = Infinity; PROPS.push(this); }
  order(t) { if (t < this.tLast - 1e-9) throw new Error(`${this.name}: event at ${t} added after one at ${this.tLast}`); this.tLast = t; this.tail = null; }
  to(t, v, sp) { this.order(t); this.ev.push({ t, d: v - this.last, sp: spring(sp), set: false }); this.last = v; return this; }
  set(t, v) { this.order(t); this.ev.push({ t, v, set: true }); this.last = v; return this; }
  seam() {                                         // the springs that carry over the seam
    if (this.tail) return this.tail;
    let k = -1;
    this.firstSet = Infinity;
    for (let i = 0; i < this.ev.length; i++) if (this.ev[i].set) { k = i; if (this.firstSet === Infinity) this.firstSet = this.ev[i].t; }
    this.tail = LOOP === 'none' ? [] : this.ev.slice(k + 1).filter((e) => e.d !== 0 && e.t + settle(e.sp) > DUR);
    return this.tail;
  }
  at(t) {
    let v = this.v0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) { v = ev[i].v; i0 = i + 1; }
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * S(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * (S(t + DUR - e.t, e.sp) - 1);
    return v;
  }
  vel(t) {                                         // per second
    let v = 0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) i0 = i + 1;
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * dS(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * dS(t + DUR - e.t, e.sp);
    return v;
  }
  active(a, b) {                                   // does the value change anywhere in (a, b]?
    for (const e of this.ev) {
      if (e.set) { if (e.t > a && e.t <= b) return true; }
      else if (e.d !== 0 && e.t < b && e.t + settle(e.sp) > a) return true;
    }
    if (a < this.firstSet) for (const e of this.seam()) if (e.t - DUR < b && e.t - DUR + settle(e.sp) > a) return true;
    return false;
  }
  settleEnd() { let m = -Infinity; for (const e of this.ev) m = Math.max(m, e.set ? e.t : e.t + settle(e.sp)); return m; }
  lastSet(a, b) { let m = -Infinity; for (const e of this.ev) if (e.set && e.t > a && e.t <= b && e.t > m) m = e.t; return m; }
}

/* ---------------- periodic motion and seeded randomness ---------------- */
// n whole cycles per loop: exact at the seam by construction. Use these for anything that never stops
// (an idle bob, a spin, a drifting field) and set ENGINE.always, or declare its windows with activeIn.
const cyc = (t, n, phase = 0) => TAU * (n * t / DUR + phase);
const wave = (t, n, phase = 0) => Math.sin(cyc(t, n, phase));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// three integers to [0, 1), well mixed: a pure replacement for Math.random keyed by what it decides
function hash(a, b = 0, c = 0) {
  let h = Math.imul((a | 0) ^ 0x3C6EF372, 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13) ^ (b | 0), 0xC2B2AE35);
  h = Math.imul(h ^ (h >>> 16) ^ (c | 0), 0x27D4EB2F);
  h ^= h >>> 15; h = Math.imul(h, 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
// smooth noise in [-1, 1] that loops exactly: three whole harmonics (n, 2n+1, 4n+3 cycles per loop) with seeded phases
function loopNoise(t, n, seed) {
  return (Math.sin(cyc(t, n, hash(seed, 1))) + 0.5 * Math.sin(cyc(t, 2 * n + 1, hash(seed, 2))) + 0.25 * Math.sin(cyc(t, 4 * n + 3, hash(seed, 3)))) / 1.75;
}
function shuffled(arr, seed) {                     // Fisher-Yates on a copy, seeded
  const r = mulberry32(seed), a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}

/* ---------------- time ---------------- */
const wrapT = (t) => ((t % DUR) + DUR) % DUR;
const frameOf = (t) => Math.ceil(t * FPS - 1e-9);  // all subframes of output frame n map to n
const typed = (q, ts, n) => Math.max(0, Math.min(n, Math.ceil((q - ts) * FPS - 1e-6)));   // one character per frame
const noteSec = (v) => (typeof v === 'number' && v >= 1 ? 4 * 60 / FILM.BPM / v : v);     // 16 -> a 16th note

    for (const L of live) {

        if (tx.mono && tx.size < 24 * U) add(`small print: ${tx.id}`, 'WARN', `${tx.size.toFixed(1)} px is hard to read in a feed (24 px or more at 1080)`);

      if (L.spec.y != null && ['text', 'counter', 'note'].includes(L.kind) && L.spec.y % UNIT) add(`grid: ${L.id}`, 'WARN', `baseline ${L.spec.y} is not on the ${UNIT} px grid`);
      if (L.markBox) checkLiveArea(add, `${L.id} marks`, L.markBox, L.spec.bleed);
      else if (L.kind === 'mark') checkLiveArea(add, L.id, L.box, L.spec.bleed);

      if (L.markBox) for (const x of L.texts) if (x.chart && hitsMarks(L, x.b, 2 * U)) add(`collision: ${x.id}`, 'FAIL', 'a label of the chart overlaps its own bars, line or ring at rest');

    }

    if (Sc.source) {
      let bad = -1;
      const data = live.filter((L) => L !== Sc.source && (DATA_KINDS.includes(L.kind) || L.refs.length));
      for (let n = 0; n < NFR && bad < 0; n++) { const t = n / FPS; if (data.some((L) => dataShown(L, t)) && !sourceOn(Sc, t)) bad = n; }
      add(`source: ${Sc.id}`, bad >= 0 ? 'FAIL' : 'PASS', bad >= 0 ? `frame ${bad} (t ${(bad / FPS).toFixed(3)}) shows numbers without the source line: start it sooner or keep it longer (source: { at })` : `"${Sc.source.text}" is on screen whenever its numbers are`);
    }
    // every value landed in the rest still
    const sd = DPROPS.filter((d) => d.L.scene === Sc && !d.L.dead);
    if (sd.length) {
      const { rest } = sceneTimes(Sc), n = Math.round(rest * FPS), t = n / FPS;
      const off = sd.filter((d) => Math.abs(d.P.at(t) - targetAt(d.P, t)) >= d.tol);
      const srcOk = !Sc.source || (typedCount(Sc.source, t) >= Sc.source.line.glyphs.length || (Sc.wrap && t < Sc.wrapEnd));
      add(`landed: ${Sc.id}`, off.length || !srcOk ? 'FAIL' : 'PASS', off.length ? `rest still frame ${n}: ${off.slice(0, 4).map((d) => `${d.L.id}.${d.what} at ${+d.P.at(t).toFixed(3)} of ${+targetAt(d.P, t).toFixed(3)}`).join('; ')}: give the scene longer before it leaves, or a stiffer critically damped spring`
        : !srcOk ? `rest still frame ${n}: the source line is still typing` : `rest still frame ${n} (t ${t.toFixed(3)}): ${sd.length} data values at their final numbers, the source line complete`);
    }
  }
  for (const L of Object.values(LAYERS)) {
    if (L.dead) continue;
    const bg = L.spec.on || L.scene.bgRole;
    if (L.kind === 'counter') add(`counter: ${L.id}`, 'PASS', `lands on "${fmtNum(L.final, L.fmt)}" in ${L.N.sw.length} fixed slots (digit slot ${L.N.dw.toFixed(1)} px): the count never shifts a digit`);
    if (['columns', 'bars', 'line'].includes(L.kind)) {
      const G = L.G, mn = G.mn, mx = G.mx, vs = G.all;
      const over = vs.filter((v) => v > mx + 1e-9 || v < mn - 1e-9);
      if (over.length) add(`axis: ${L.id}`, 'FAIL', `${over.map((v) => fmtNum(v, L.dsets[0].fmt)).join(', ')} outside the axis ${mn} to ${mx}: a clipped bar or line is a truncated axis`);
      else if (L.kind !== 'line' && (mn > 0 || mx < 0)) add(`axis: ${L.id}`, 'FAIL', `the value axis runs ${mn} to ${mx} and leaves out zero: a bar's length must start at zero`);

      else add(`axis: ${L.id}`, 'PASS', `${fmtNum(mn, L.dsets[0].fmt)} to ${fmtNum(mx, L.dsets[0].fmt)}, from zero, every value inside`);

      if (G.vals.some((v) => v < 0)) add(`whole: ${L.id}`, 'FAIL', 'a negative share: a donut shows parts of a whole');
      else if (w.total == null) add(`whole: ${L.id}`, 'FAIL', 'no total: give the whole as data.total so the parts can be checked against it');
      else if (w.remainder) add(`whole: ${L.id}`, 'PASS', `parts sum to ${+w.sum.toFixed(6)} of ${w.total}; the remainder is shown as ${w.remainder}`);
      else add(`whole: ${L.id}`, Math.abs(w.sum - w.total) <= w.tol ? 'PASS' : 'FAIL', Math.abs(w.sum - w.total) <= w.tol ? `parts sum to ${+w.sum.toFixed(6)} of ${w.total} (within rounding)` : `parts sum to ${+w.sum.toFixed(6)}, not the whole ${w.total}: fix the data, or show the rest with remainder: 'OTHER'`);
    }
    if (L.marks && L.marks.length && L.kind !== 'counter') {
      const cs = L.marks, low = cs.filter((r) => contrast(col(r), col(bg)) < 3);
      const pairs = [];
      if (L.kind === 'donut') for (let k = 0; k < L.G.n; k++) { const a = L.G.fillRole[k], b = L.G.fillRole[(k + 1) % L.G.n]; if (a && b && a !== b && L.G.n > 1) pairs.push([a, b]); }

// does a text box touch the marks of a chart (its bars, lines and points, or ring), at rest or at any retarget?

    return false;

        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], k = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3));

function lastChange(see) {

function stills(push) {

function build() {
  buildData();
  buildScenes();
  for (const L of Object.values(LAYERS)) if (L.typed && L.kind === 'text' && !L.dead) {   // typed small print moves as one piece
    L.tc = { ox: 0, oy: 0, P: {} };
    const Sc = L.scene;
    for (const key of Object.keys(KEYS)) L.tc.P[key] = new Prop(KEYS[key], `${L.id}.${key}`);
    if (Sc.wrap) { const w = Sc.wrap, v = stateVals(w.to || { scale: 0 }); for (const [k, x] of Object.entries(v)) L.tc.P[k].to(w.exit + (w.stagger ? noteSec(w.stagger) * L.li : 0), x, w.spring || 'EXIT'); for (const k of Object.keys(v)) L.tc.P[k].set(Sc.wrapEnd, KEYS[k]); }

    if (ex && typeof ex.to === 'object') for (const [k, x] of Object.entries(stateVals(ex.to))) L.tc.P[k].to(ex.at, x, springFor(k, ex.spring || 'EXIT'));

  for (const Sc of SCENES) if (Sc.source) sourceExit(Sc);
  for (const L of Object.values(LAYERS)) if (!L.dead && L.spec.accent) {
    const lands = L.copies.map((cp) => cp.land).filter((v) => v != null);
    let t = L.spec.accent;

      t = ds.length ? Math.max(...ds.map((d) => lastOff(d, L.scene.t0, sceneTimes(L.scene).end))) : Math.max(...lands, L.scene.t0);

  }
}

boot({
  name: 'charts',
  springs: { COUNT: [1, 9], GROW: [1, 11], SWEEP: [1, 8], TRACE: [1, 10], POP: [0.5, 22] },
  build, draw: (c, t, q) => drawFrame(c, t, q), disp, checks, lastChange, stills, layout, visible,

})();
