<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acme bumper</title>
<style>
@font-face{font-family:"Archivo Black";font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,__FONT:archivo-black-latin-400-normal.woff2__) format("woff2")}

html,body{margin:0;height:100%;background:#0A0A0A}

</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below ENGINE stays as it is.
 *
 * Times are seconds; beat(n) and bar(n) put them on the tempo grid.
 * Positions are canvas pixels of the base format (W x H); FILM.formats, at the
 * end, re-lays them for other aspect ratios. Colours are palette role names.
 * A line, rule or crumb without x starts at the measure's edge (grid.margin).
 * Units: track and pairs in 1/1000 em, stagger as a note value (16 = a 16th).
 * The film must end where it began: frame 0 shows the lockup at rest, and the
 * last scene (wrap) rebuilds it and holds, so the loop is seamless.
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Acme bumper',
  alt: 'Acme. Notes, sorted. Every morning. Ready today. example.com',
  W: 1080, H: 1080, FPS: 60, DUR: bar(4), BPM,
  palette: { bg: '#0A0A0A', fg: '#F5F5F5', accent: '#FF6900', accent2: '#B8FF00' },
  misPair: ['accent', 'accent2'],           // misregistration: left pass, right pass
  misAlpha: 0.4,                             // opacity of the misregistration layer; 0.6 to 0.7 on a light bg
  smearColor: 'accent',                      // ghosts behind fast type
  scrambleColor: 'accent2',                  // noise glyphs before a scramble snaps
  fonts: {                                   // must match the @font-face rules above
    display: { family: 'Archivo Black', weight: 400 },
    label: { family: 'Syne', weight: 800 },
    mono: { family: 'IBM Plex Mono', weight: 500 },

  grid: { margin: 104, unit: 8 },            // live area inset, baseline unit
  mono: { size: 32, track: 20 },             // crumbs (typed small print)
  poster: 0,                                 // poster frame time: 0 is the lockup at rest
  scenes: [
    // Lockup. Visible at rest on frame 0, knocked out at t 0 (wrap), rebuilt from bar 3, then holds.
    {
      id: 'lockup', world: 1, t0: bar(3), t1: bar(4), in: 'pan',
      wrap: { exit: 0, dy: -880 },
      breath: { t0: beat(13.75), t1: beat(15.25), amount: 0.012 },
      lines: [
        { id: 'ACME', text: 'ACME', font: 'display', fit: true, track: -20, baseline: 560, color: 'fg',
          enter: { at: beat(12.25), from: 96, spring: 'LAND', blur: 12 }, mis: 'land' },
        { id: 'URL', text: 'EXAMPLE.COM', font: 'display', fit: true, track: 0, pairs: { XA: 40 }, baseline: 736, color: 'fg',
          enter: { at: beat(12.75), from: -128, spring: 'LAND', blur: 12, stagger: 32 }, clipBelow: 608 },

      ],
    },
    // Hard cut onto a full row of scramble noise (pop: no fade-in, so the cut lands on something);
    // it resolves on the beat, and a crumb types itself in.
    {
      id: 'every', world: 0, t0: bar(1) + beat(1), t1: bar(2) + beat(1), in: 'cut',
      punch: { at: bar(2), z: 1.08 },
      lines: [
        { id: 'EVERY', text: 'EVERY', font: 'display', fit: true, track: -20, baseline: 400, color: 'fg',
          enter: { at: beat(5), from: 0, spring: 'LAND', blur: 8, stagger: 0, pop: true }, scramble: { snap: beat(6.5), dir: 1 }, mis: 'snap' },
        { id: 'MORNING', text: 'MORNING.', font: 'display', fit: true, track: -20, baseline: 600, color: 'fg',
          enter: { at: beat(5.5), from: 96, spring: 'LAND', blur: 12, stagger: 32 } },
      ],
      crumbs: [
        { id: 'DEMO', text: 'DEMO COPY, FICTIONAL PRODUCT', at: beat(7), baseline: 880, color: 'accent2' },

      lines: [

        { id: 'TODAY', text: 'TODAY.', font: 'display', fit: true, track: -20, baseline: 664, color: 'accent',

    },

    '9:16': {
      scenes: [
        { id: 'lockup', wrap: { dy: -1480 } },
        { id: 'hook', lines: [{ id: 'NOTES', baseline: 488, enter: { from: 1100 } }, { id: 'SORTED', baseline: 744, enter: { from: 1100 } }] },

    },
    '16:9': {
      grid: { measure: 1504 },
      scenes: [
        { id: 'lockup', wrap: { dy: -960 }, lines: [{ id: 'ACME', baseline: 560 }, { id: 'URL', baseline: 864, clipBelow: 644 }], rules: [{ id: 'RULE', y: 632, h: 12 }] },
        { id: 'hook', lines: [{ id: 'NOTES', baseline: 480 }, { id: 'SORTED', baseline: 864 }] },
        { id: 'every', lines: [{ id: 'EVERY', baseline: 512 }, { id: 'MORNING', baseline: 856 }], crumbs: [{ id: 'DEMO', baseline: 960 }] },
        { id: 'ready', lines: [{ id: 'READY', baseline: 488, pairs: { EA: 6 } }, { id: 'TODAY', baseline: 872 }] },

/* ==========================================================================

const { W, H, FPS, DUR } = FILM;
const CX = W / 2, CY = H / 2;
const PAL = FILM.palette;
const col = (k) => PAL[k] || k;

const FS = Math.min(W, H) / Math.min(BW, BH);      // base px -> this format's px

const fmtX = (x, pin = '') => /l/.test(pin) ? x * FS : /r/.test(pin) ? W - (BW - x) * FS : W / 2 + (x - BW / 2) * FS;

// W - 2 x margin unless grid.measure narrows it (a horizontal format sets one, so big type stays in the height).
const MARGIN = FILM.grid.margin, UNIT = FILM.grid.unit;
const MEASURE = FILM.grid.measure != null ? fmtSz(FILM.grid.measure) : W - 2 * MARGIN;
const ML = (W - MEASURE) / 2, MR = ML + MEASURE;   // the measure's left and right edges

const MIN_SAMPLES = 4, MAX_SAMPLES = 64, PX_PER_SAMPLE = 5;    // Uint16 sums hold up to 257 x 255

const canvas = document.getElementById('c');

canvas.setAttribute('aria-label', FILM.alt);
canvas.setAttribute('role', 'img');
if (FILM.title) document.title = FILM.title;
document.documentElement.style.background = col('bg');
document.body.style.background = col('bg');

// getImageData reads, which changes antialiasing mid-render. Pin it from the start.
// An alpha channel, though every frame fills it opaque: on an opaque canvas Chromium draws text with
// LCD subpixel antialiasing (red and blue fringes on every glyph), whatever the command line says.
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: true });
const mkCanvas = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const mk2d = () => { const c = mkCanvas(); return [c, c.getContext('2d', { willReadFrequently: true })]; };

const [offM, offMx] = mk2d();                // the mask: the outgoing line's letterforms
const [offT, offTx] = mk2d();                // tinted copies for the channel split
const [offL, offLx] = mk2d();                // misregistration: left pass
const [offR, offRx] = mk2d();                // misregistration: right pass
const [offK, offKx] = mk2d();                // misregistration: the element's own footprint
const mctx = mkCanvas().getContext('2d', { willReadFrequently: true });   // measuring only

/* ---------------- springs: closed-form step responses ---------------- */
// [zeta, omega]. Underdamped (zeta < 1) overshoots and lands; zeta = 1 glides in without overshoot.
const SP = {
  SLAM: [0.60, 30.0], LAND: [0.72, 28.0], PUNCH: [0.65, 31.0], FADE: [1, 32.4],
  FOCUS: [1, 19.5], EXIT: [1, 32.4], PAN: [1, 32.4], DRAW: [1, 32.4],
  LINE: [0.80, 15.6], MASK: [1, 19.5], TICK: [1, 32.4],

    if (unit && Ln.baseline % unit) add(`grid: ${Ln.id}`, 'WARN', `baseline ${Ln.baseline} is not on the ${unit} px grid`);
  }
  for (const Sc of SCENES) for (const C of Sc.crumbs) {
    const bad = C.x < MARGIN - 1 || C.x + C.w > W - MARGIN + 1 || C.baseline - MONO.cap < MARGIN - 1 || C.baseline > H - MARGIN + 1;
    add(`live area: ${C.id}`, bad ? 'FAIL' : 'PASS', `x ${C.x.toFixed(0)}-${(C.x + C.w).toFixed(0)}, baseline ${C.baseline}`);
    if (unit && C.baseline % unit) add(`grid: ${C.id}`, 'WARN', `baseline ${C.baseline} is not on the ${unit} px grid`);
  }
  // collisions at rest, inside one scene
  for (const Sc of SCENES) {
    const boxes = [
      ...Sc.lines.map((l) => ({ id: l.id, b: [l.inkL, l.top, l.inkR, l.bottom], cap: l.capH })),
      ...Sc.crumbs.map((c) => ({ id: c.id, b: [c.x, c.baseline - MONO.cap, c.x + c.w, c.baseline], cap: MONO.cap })),
      ...Sc.rules.map((r) => ({ id: r.id, b: [r.x0, r.y, r.x1, r.y + r.h], cap: r.h })),
    ];
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      const a = boxes[i].b, b = boxes[j].b;
      const dx = Math.max(0, a[0] - b[2], b[0] - a[2]), dy = Math.max(0, a[1] - b[3], b[1] - a[3]);
      const gap = dx === 0 && dy === 0 ? -1 : Math.hypot(dx, dy);
      const tight = 16 * U;
      if (gap < 0) add(`collision: ${boxes[i].id} / ${boxes[j].id}`, 'FAIL', 'ink boxes overlap at rest');
      else if (gap < tight) add(`cramped: ${boxes[i].id} / ${boxes[j].id}`, 'WARN', `${gap.toFixed(1)} px apart (< ${tight} px)`);
    }
  }
  // cramped pairs inside display lines
  for (const lg of inkGaps()) {
    if (lg.role === 'mono') continue;
    const low = lg.pairs.filter((p) => p.fix != null);
    add(`letter gaps: ${lg.id}`, low.length ? 'FAIL' : 'PASS', low.length
      ? `${low.map((p) => `${p.pair} ${p.px}px (${p.em} em)`).join(', ')} < ${GAP_FLOOR} em; try pairs: { ${low.map((p) => `${JSON.stringify(p.pair)}: ${p.fix}`).join(', ')} }`
      : `min ${Math.min(...lg.pairs.map((p) => p.em), Infinity)} em`);
  }
  // orphans: a lone short word stacked against much wider lines
  for (const Sc of SCENES) {
    const disp = Sc.lines.filter((l) => l.role === 'display');
    if (disp.length < 2) continue;
    const wMax = Math.max(...disp.map((l) => l.inkR - l.inkL));
    for (const l of disp) if (l.text.trim().split(/\s+/).length === 1 && l.text.replace(/[^A-Za-z0-9]/g, '').length <= 3 && (l.inkR - l.inkL) * 2.5 < wMax)
      add(`orphan: ${l.id}`, 'WARN', `"${l.text}" sits alone, under 40 % of the widest line`);
  }
  // contrast against the background
  const bg = col('bg');
  for (const Ln of Object.values(LINES)) { const r = contrast(col(Ln.color), bg); add(`contrast: ${Ln.id}`, r < 3 ? 'FAIL' : 'PASS', `${r.toFixed(2)}:1 (display needs 3:1)`); }
  for (const Sc of SCENES) for (const C of Sc.crumbs) { const r = contrast(col(C.color), bg); add(`contrast: ${C.id}`, r < 4.5 ? 'FAIL' : 'PASS', `${r.toFixed(2)}:1 (small text needs 4.5:1)`); }
  // palette: every colour used must be a palette role
  const used = [...Object.values(LINES).map((l) => l.color), ...SCENES.flatMap((s) => [...s.rules.map((r) => r.color), ...s.crumbs.map((c) => c.color)]), ...FILM.misPair, FILM.smearColor, FILM.scrambleColor];
  const stray = [...new Set(used.filter((k) => !(k in PAL)))];
  add('palette roles', stray.length ? 'FAIL' : 'PASS', stray.length ? `not in the palette: ${stray.join(', ')}` : used.length + ' uses, all palette roles');
  // the loop: everything must be at rest before the last frame's earliest subframe, springs and
  // the discrete state that reads q alike (typing, cursors, blinks, scramble snaps, accents)
  const last = lastChange();
  const need = DUR - (1 + SHUTTER) / FPS;
  const hold = Math.floor((DUR - last.t) * FPS + 1e-6);
  add('loop tail', last.t <= need ? 'PASS' : 'FAIL', `last change at ${last.t.toFixed(3)} s (${last.what}); static hold at least ${hold} frames (needs >= 2; loopcheck counts identical pixels, often a few more)`);
  // blank flashes: runs of frames where nothing is on screen at half opacity or more
  const minRun = Math.max(2, Math.round(FPS / 15));        // 1/15 s: a flash, not a landing
  for (const [a, b] of emptyRuns()) if (b - a + 1 >= minRun)
    add('blank frames', 'WARN', `frames ${a}-${b} (t ${(a / FPS).toFixed(3)}-${(b / FPS).toFixed(3)}, ${b - a + 1} frames) show nothing at half opacity: start the next entrance sooner, or pop it in at the cut`);
  for (const w of WARN) add('timeline', 'WARN', w);
  compositionCheck(add);
  return checks;
}

// Composition: where the ink sits in the review stills. Copied from the shared core (inkBox, compositionCheck)
// and adapted to this engine: a still is draw(ctx, t), sharp, and ink is any pixel away from bg and from the
// roles listed in FILM.backdrop (a panel a custom draw hook paints across the frame). The lean on an axis is
// the difference between the empty margins on its two sides, or twice the ink's centre of mass off the middle
// (a small crumb stretches the box but barely moves the mass), whichever is larger. An average lean past a
// fifth of the canvas warns, past 30 % fails: lines authored for a square left in the top of a 9:16 frame,
// or the left of a 16:9 one.
function inkBox(isBg, step) {
  const d = ctx.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1, n = 0, sx = 0, sy = 0;
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
    const i = (y * W + x) * 4;
    if (isBg(d[i], d[i + 1], d[i + 2])) continue;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    n++; sx += x; sy += y;
  }
  return x1 < 0 ? null : { box: [x0, y0, x1 + step, y1 + step], cx: sx / n, cy: sy / n };
}
function compositionCheck(add) {
  const bgs = [PAL.bg, ...(FILM.backdrop || []).map((r) => PAL[r] || r)].map(rgbOf);
  const isBg = (r, g, b) => bgs.some((c) => Math.abs(r - c[0]) + Math.abs(g - c[1]) + Math.abs(b - c[2]) < 36);
  const pick = (a, b) => Math.abs(a) >= Math.abs(b) ? a : b;
  const rows = [];
  for (const { frame } of stillsPlan()) {
    draw(ctx, frame / FPS);
    const ink = inkBox(isBg, Math.max(2, Math.round(3 * U)));
    if (!ink) continue;
    const b = ink.box, top = b[1] / H, bottom = (H - b[3]) / H, left = b[0] / W, right = (W - b[2]) / W;
    if (top + bottom > 0.9 || left + right > 0.9) continue;         // a speck: nothing to balance
    rows.push({ v: pick(bottom - top, 2 * (0.5 - ink.cy / H)), h: pick(right - left, 2 * (0.5 - ink.cx / W)) });
  }
  if (!rows.length) { add('composition', 'PASS', 'no still with measurable ink off the background'); return; }
  const mean = (k) => rows.reduce((a, r) => a + r[k], 0) / rows.length;
  const v = mean('v'), h = mean('h');
  const lean = (x, a, b) => `${x > 0 ? a : b} (a lean of ${Math.round(Math.abs(x) * 100)} %)`;
  const verdict = (x) => Math.abs(x) > 0.3 ? 'FAIL' : Math.abs(x) > 0.2 ? 'WARN' : 'PASS';
  const worst = Math.abs(v) >= Math.abs(h) ? ['v', v] : ['h', h];
  const st = verdict(worst[1]);
  add('composition', st, st === 'PASS'
    ? `${rows.length} stills balanced: a lean of ${Math.round(Math.abs(v) * 100)} % top to bottom, ${Math.round(Math.abs(h) * 100)} % left to right on average`
    : `the stills lean to the ${worst[0] === 'v' ? lean(v, 'top', 'bottom') : lean(h, 'left', 'right')}, over ${rows.length} stills (${FMT.key}): centre the content or pin elements to the edges they belong to`);
}

// the last moment anything on screen can change: spring settles, active windows, and discrete state
function lastChange() {
  let t = -Infinity, what = 'nothing moves';
  const see = (v, w) => { if (v > t) { t = v; what = w; } };
  for (const p of PROPS) see(p.settleEnd(), `${p.name} settles`);
  for (const w of ACTIVE) see(w[1], 'an active window (mask, breath or draw hook) ends');
  for (const Sc of SCENES) {
    for (const C of Sc.crumbs) {
      see(C.at + (C.n + (C.cursor ? 3 : 1)) / FPS, `${C.id} finishes typing`);
      if (C.clear != null) see(C.clear + (C.n + 1) / FPS, `${C.id} finishes clearing`);
      if (C.cursor && C.blink) {                          // the frame after the cursor is last on (2 Hz, on for the first half)
        let lastOn = -Infinity;
        for (let n = Math.ceil(C.blink[0] * FPS - 1e-9); n / FPS < C.blink[1] - 1e-9 && n <= DUR * FPS; n++) if (((n / FPS * 2) % 1) < 0.5 - 1e-9) lastOn = n / FPS;
        see(lastOn + 1 / FPS, `${C.id}'s blinking cursor goes off`);
      }
    }
    for (const Ln of Sc.lines) if (Ln.spec.scramble) see(Ln.spec.scramble.snap, `${Ln.id} snaps`);
  }
  for (const m of MIS_T) see(m.t + 3 / FPS, `the accent on ${m.what} ends`);
  return { t, what };
}

// frames where nothing is on screen at half opacity or more (a blank flash between scenes)
function emptyRuns() {
  const N = Math.round(DUR * FPS), runs = [];
  let start = -1;
  for (let n = 0; n <= N; n++) {
    const empty = n < N && !anyVisible(n / FPS);
    if (empty && start < 0) start = n;
    if (!empty && start >= 0) { runs.push([start, n - 1]); start = -1; }
  }
  return runs;
}
function anyVisible(t) {
  const nq = frameOf(t), q = nq / FPS, cam = camera(t);
  const on = (x0, y0, x1, y1, ox) => {                   // a world-space box, through the camera, meets the canvas
    const sx0 = CX + cam.z * (x0 + ox - CX - cam.x), sx1 = CX + cam.z * (x1 + ox - CX - cam.x);
    const sy0 = CY + cam.z * (y0 - CY), sy1 = CY + cam.z * (y1 - CY);
    return sx1 > 0 && sx0 < W && sy1 > 0 && sy0 < H;
  };
  for (const Sc of SCENES) {
    if (!Sc.win.some(([a, b]) => t >= a && t < b)) continue;
    if (Sc.draw || (Sc.mask && t >= Sc.t0 && t < Sc.t0 + Sc.mask.dur)) return true;
    const ox = Sc.world * W, wrapped = !!Sc.wrap && t < Sc.t0;
    for (const Ln of Sc.lines) for (const g of Ln.glyphs) {
      if (g.space || g.op.at(t) < 0.5) continue;
      const dy = g.y.at(t);
      let top = Ln.top + dy, bottom = Ln.bottom + dy;
      if (Ln.clipY != null) bottom = Math.min(bottom, Ln.clipY);
      if (Ln.clipBelow != null) top = Math.max(top, Ln.clipBelow);
      if (bottom > top && on(g.inkL, top, g.inkR, bottom, ox)) return true;
    }
    for (const R of Sc.rules) {
      if (R.op.at(t) < 0.5) continue;
      const [x, y, w, h] = ruleBox(R, t);
      if (w >= 1 && on(x, y, x + w, y + h, ox)) return true;
    }
    for (const C of Sc.crumbs) {
      if (C.op.at(t) < 0.5 || crumbCount(C, q, wrapped) === 0) continue;
      const dy = C.dy.at(t);
      if (on(C.x, C.baseline + dy - MONO.cap, C.x + C.w, C.baseline + dy, ox)) return true;
    }
  }
  return false;
}

// review stills: the loop start, each scene at rest, each transition mid-move, each accent frame
function stillsPlan() {
  const N = Math.round(DUR * FPS), plan = [], seen = new Set();
  const push = (frame, name, what) => { frame = Math.max(0, Math.min(N - 1, frame)); if (seen.has(frame)) return; seen.add(frame); plan.push({ frame, name, what }); };
  for (const Sc of SCENES) {
    const lands = [...Sc.lines.map((l) => l.lastArr + settle(l.enterSpring || SP.LAND) * 0.5), ...Sc.crumbs.map((c) => c.at + c.n / FPS), ...Sc.rules.map((r) => r.lastArr + 0.3)];
    const landed = Math.max(...lands, Sc.t0) + 0.1, end = Sc.t1 - 2 / FPS;
    let rest = Math.min(landed, end);
    if (Sc.punch && rest > Sc.punch.at - 2 / FPS) {         // not inside the punch-in's zoom blur
      const before = Sc.punch.at - 2 / FPS, after = Sc.punch.at + settle(SP.PUNCH) + 2 / FPS;
      rest = before >= landed - 0.1 - 1e-6 ? before : after <= end ? after : rest;
    }
    if (Sc.in !== 'none' && Sc.t0 > 0) push(Math.round((Sc.t0 + (Sc.in === 'mask' ? 0.1 : 0.05)) * FPS), `${Sc.id}-in`, `${Sc.in} into ${Sc.id}`);
    push(Math.round(rest * FPS), `${Sc.id}-rest`, `${Sc.id} landed`);
  }
  // the loop start: the lockup leaving and the first scene arriving
  const wrap = SCENES.find((s) => s.wrap), first = SCENES.find((s) => !s.wrap);
  if (wrap && first) {
    const starts = first.lines.filter((l) => l.spec.enter).map((l) => Math.min(...l.glyphs.filter((g) => !g.space).map((g) => g.tArr)) + landT(l.enterSpring || SP.LAND));
    const tIn = starts.length ? Math.min(...starts) : first.t0;
    push(Math.max(1, Math.round((wrap.wrap.exit + tIn) / 2 * FPS)), 'loop-out', `${wrap.id} leaving, ${first.id} arriving`);
  }
  for (const m of misFrames()) push(m.frame, `mis-${m.what}`, `misregistration on ${m.what}`);
  return plan.sort((a, b) => a.frame - b.frame);
}

window.DURATION = DUR; window.FPS = FPS; window.WIDTH = W; window.HEIGHT = H;
window.FILM_META = { title: FILM.title, poster: FILM.poster || 0, bg: FILM.palette.bg, palette: FILM.palette,
  format: FMT.key, aspect: FMT.aspect, formats: Object.keys(FILM.formats || {}) };
window.seek = seek;
window.renderFrame = renderFrame;
window.motionAt = motionAt;
window.layoutTable = layoutTable;
window.inkGaps = inkGaps;
window.offPalette = offPalette;
window.misFrames = misFrames;
window.critique = critique;
window.stillsPlan = stillsPlan;
window.textByFace = textByFace;

const sampleText = (role) => {
  const s = new Set('H0');
  for (const sc of FILM.scenes) {
    for (const l of sc.lines || []) if ((l.font || 'display') === role) for (const c of l.text) s.add(c);
    if (role === 'mono') for (const c of sc.crumbs || []) for (const ch of c.text) s.add(ch);
  }
  if (role === 'display' || role === 'label') for (const c of ALNUM) s.add(c);
  return [...s].join('');
};
window.ready = Promise.all(Object.keys(FILM.fonts).map((role) => document.fonts.load(fontStr(role, 100), sampleText(role))))
  .then((sets) => {
    if (sets.some((s) => !s.length)) throw new Error('a font face failed to load');
    if (FILM.fonts.mono) monoMetrics();
    buildScenes();
    buildTimeline();
    isReady = true;
    seek(0);
    return true;
  });

// Preview: requestAnimationFrame is the only time source and it only calls seek().
// Space pauses, arrow keys step one frame, ?t=3.5 opens paused at a time.
if (!/[?&]capture\b/.test(location.search)) {
  window.ready.then(() => {
    const m = /[?&]t=([\d.]+)/.exec(location.search);
    let paused = !!m, pos = m ? Number(m[1]) : 0, last = null;
    const tick = (ts) => {
      if (!paused && last !== null) pos = wrapT(pos + (ts - last) / 1000);
      last = ts; seek(pos); requestAnimationFrame(tick);
    };
    addEventListener('keydown', (e) => {
      if (e.key === ' ') { paused = !paused; e.preventDefault(); }
      if (e.key === 'ArrowRight') { paused = true; pos = wrapT(Math.round(pos * FPS + 1) / FPS); }
      if (e.key === 'ArrowLeft') { paused = true; pos = wrapT(Math.round(pos * FPS - 1) / FPS); }
    });
    requestAnimationFrame(tick);
  });
}
})();
</script>
