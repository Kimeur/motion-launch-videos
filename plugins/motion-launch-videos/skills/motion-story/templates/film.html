<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * A story short told in the second person ("You just robbed a bank..."):
 * a voice-over, its words on screen as they are said, a drawn set per scene
 * with a slow camera, rain and neon, a hero in a beanie, HUD cards (a cash
 * counter, a clock, a countdown, a map route, a phone) and a last card that
 * asks the viewer to choose. The choice goes in the comments.
 *
 * Every scene says one to three lines. Mark words for the captions with
 * *red words*, +green words+ or !amber words!: the marks are not spoken.
 * A line can be { text, speak } when the voice should read it differently
 * ("12:40" spoken as "twelve forty").
 * scripts/voice.mjs reads this block, speaks every line (Kokoro, on this
 * machine), writes assets/voice.wav and assets/timing.json (each scene's
 * window, each word's time) and sets DUR. Run it again after any change to
 * a line, the voice or the gaps. Times inside a scene (acts, HUD cards,
 * messages) are seconds from the scene's start.
 * Positions are px of the 1080 x 1920 frame.
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Ten minutes',
  alt: 'A second-person story. You just robbed a bank and wait for your partner at a motel. He is late, his phone goes to voicemail, the news says a suspect is in custody. Two texts arrive: an unknown number says he talked and the police are ten minutes away; he says it is a lie and he is five minutes away. Do you stay or run? Fiction. Synthetic voice.',
  W: 1080, H: 1920, FPS: 30, DUR: 66.95, BPM,   // DUR: set by voice.mjs from the voice-over
  loop: 'none',
  blur: false,
  drawings: 15,                              // the hero and the sets' living details move on twos
  boil: 1.2,                                 // the hero's line wobble in px
  line: 7,                                   // the hero's outline in px; sets use 0.7 of it
  palette: {

    ink: '#060910', white: '#FFFFFF', glass: '#9CC2E6', screen: '#86D4FF', hud: '#E9F1FF', dim: '#8A97B1',
    sodium: '#F4A640', amber: '#FFC94A', neon: '#FF3E6C', neonDk: '#9E1846', cash: '#4CC27A', cashDk: '#2A7A4A',
    skin: '#F3EEE6', skinDk: '#C6BDAF', beanie: '#D23B2F', beanieDk: '#7F1E19', wood: '#6B4A33', woodDk: '#3F2B1E',
    bed: '#5B6E9A', bedDk: '#3A4870', lamp: '#FFD98A',
  },
  fonts: {
    caption: { family: 'Montserrat', weight: 800 },
    hud: { family: 'JetBrains Mono', weight: 700 },
    title: { family: 'Archivo Black', weight: 400 },
  },
  grid: { margin: 88, unit: 8 },
  poster: 1.2,

  voice: { name: 'am_michael', speed: 1.0, gap: 0.3, sceneGap: 0.5, lead: 0.4, tail: 3.5 },   // Kokoro voice, pauses in s
  timing: '__ASSET:assets/timing.json__',    // written by voice.mjs
  audio: {
    track: 'assets/voice.wav', loudness: -14, sfx: -3,
    bed: { key: 'D minor', brightness: 0.3, movement: 0.4, layers: { pad: 0.7, drone: 1, bass: 0.6, air: 0.6, glints: 0.1 } },
  },
  captions: { y: 1330, size: 78, maxWords: 3, fill: 'white', stroke: 'ink', marks: { '*': 'neon', '+': 'cash', '!': 'amber' } },

  // The hero: a bean in a beanie (an original character). view 'back' draws the beanie from behind.
  hero: {
    body: { w: 250, h: 300, shape: 2.6, taper: 0.08, fill: 'skin', shade: 'skinDk' },
    beanie: { fill: 'beanie', shade: 'beanieDk', cover: 0.36, cuff: 34, pom: 22 },
    legs: { len: 34, gap: 84, width: 15, foot: [42, 20] },
    eyes: { y: 176, gap: 92, rx: 25, ry: 31, pupil: 12 },
    brows: { y: 220, w: 36 },
    mouth: { y: 110, w: 70 },
    arms: { y: 120, len: 120, width: 15, hand: 22 },
  },

  scenes: [
    { id: 'DRIVE', set: 'car', say: ['You just robbed a *bank*.', 'Rain on the glass. Sirens somewhere behind you.'],
      cam: { from: [540, 960, 1.04], to: [540, 930, 1.1] }, rain: 0.6 },
    { id: 'CASH', set: 'backseat', say: ['On the back seat, three bags.', '+4.2 million dollars+.'],
      cam: { from: [540, 1000, 1.0], to: [560, 1060, 1.12] },
      hud: [{ kind: 'money', from: 0, to: 4200000, at: 0.6, dur: 2.6, y: 300 }] },
    { id: 'PLAN', set: 'map', say: ['The plan was simple.', 'You drive. *Marco* kills the cameras.', 'Midnight, you meet at the motel, split it, and vanish.'],

        route: [[300, 620], [300, 980], [640, 980], [640, 1240]], at: 0.4, dur: 4.5 } },
    { id: 'ARRIVE', set: 'street', say: [{ text: 'You pull in at !11:52!.', speak: 'You pull in at eleven fifty two.' }, 'Room fourteen. Lights off.'],
      street: { sign: 'MOTEL', door: '14' }, rain: 1,
      actor: { x: 260, ground: 1790, scale: 1.0, bag: true, acts: [{ at: 0.2, act: 'walk', dx: 330, steps: 6, every: 4 }] },
      cam: { from: [540, 960, 1.0], to: [600, 1000, 1.08] } },
    { id: 'WAIT', set: 'room', say: ['Midnight comes. Then twelve thirty.', '*No Marco*.'],
      room: { neon: 'MOTEL' },
      actor: { x: 330, ground: 1800, scale: 1.0, acts: [{ at: 0.4, act: 'look', x: 0.6, y: -0.2 }, { at: 2.6, act: 'face', mouth: 'flat', brow: -6 }, { at: 3.4, act: 'look', x: -0.2, y: 0.2 }] },
      hud: [{ kind: 'clock', from: '12:00', to: '12:31', at: 0.3, dur: 3.2, y: 300 }] },
    { id: 'CALL', set: 'phone', say: ['You call him.', '*Straight to voicemail*.'],
      phone: { app: 'call', name: 'MARCO', status: [[0, 'CALLING...'], [1.5, 'VOICEMAIL']] } },
    { id: 'COUNT', set: 'desk', say: ['So you count the money.', 'Every bill. Just to keep your hands busy.'],
      hud: [{ kind: 'meter', label: 'COUNTING', at: 0.3, dur: 4.5, from: 0, to: 4200000, y: 300 }] },
    { id: 'NEWS', set: 'tv', say: ['Then, the news.', 'Bank robbery downtown. Police have *a suspect in custody*.'],
      tv: { banner: 'BREAKING NEWS', head: 'BANK ROBBERY DOWNTOWN', ticker: 'POLICE: ONE SUSPECT IN CUSTODY  ·  SECOND SUSPECT AT LARGE  ·  ' },

    { id: 'TEXT1', set: 'phone', say: ['Your phone buzzes. Unknown number.', '*Marco talked. Cops are coming. You have ten minutes.*'],
      phone: { app: 'messages', name: 'UNKNOWN', msgs: [{ at: 1.8, text: 'Marco talked. Cops are coming. You have 10 minutes.' }] },
      shake: [0.1] },
    { id: 'TEXT2', set: 'phone', say: ['Ten seconds later. Marco.', '+Don\'t trust that text. I\'m five minutes away. Wait for me.+'],
      phone: { app: 'messages', name: 'MARCO', msgs: [{ at: 1.6, text: 'Don\'t trust that text. I\'m 5 min away. WAIT for me.', mine: false }] },
      shake: [0.1] },
    { id: 'WINDOW', set: 'room', say: ['Ten minutes to run. Five minutes for Marco.', 'One of those texts is a *lie*.'],
      room: { neon: 'MOTEL', view: 'window' },
      actor: { x: 540, ground: 1960, scale: 1.6, view: 'back', acts: [] },
      hud: [{ kind: 'timer', from: 600, at: 0, y: 300 }],
      cam: { from: [540, 1000, 1.0], to: [540, 960, 1.1] }, rain: 0.5 },
    { id: 'ASK', set: 'question', say: ['So. Do you *stay*... or do you *run*?'],
      question: { text: 'WHAT DO YOU DO?', options: ['STAY', 'RUN'], cta: 'COMMENT YOUR ANSWER' } },
  ],
};

/* ===== CORE BEGIN: shared/core.js, synced by tools/sync.mjs. Do not edit it here. ===== */
/* ==========================================================================
 * CORE: the deterministic runtime every motion-* engine shares.
 * Source: shared/core.js in the motion-launch-videos repo, copied into each
 * template by tools/sync.mjs. Do not edit it inside a film.
 *
 * seek(t) is a pure function of (t mod DUR): same t, same pixels, whatever was
 * drawn before. No timers, no Date, no Math.random, no state between calls.
 *   - Springs are closed-form step responses, one per target change, snapped
 *     to exactly 1 once settled. A Prop is a base value plus its springs.
 *     Springs still settling when the loop ends carry over the seam.
 *   - Periodic motion runs a whole number of cycles per loop (cyc, wave,
 *     loopNoise), so it is exact at the seam by construction.
 *   - Randomness is seeded (mulberry32, hash).
 *   - Continuous motion reads the exact t; discrete state (typing, drawings
 *     held on twos, sprite frames, line boil) reads the quantised q, so every
 *     subframe of one output frame agrees on it.
 *   - Motion blur averages 1 to 64 subframes on a trailing 270-degree
 *     shutter, one per 5 px of movement, never across a hard cut.
 *   - Sound (FILM.audio) is synthesised from cues in an OfflineAudioContext,
 *     outside seek(), from seeded noise; a bed (FILM.audio.bed) adds music in
 *     a key, a reverb runs in plain JS; FILM.transparent clears to alpha.
 * The engine below describes its vertical through hooks (build, draw, disp,
 * checks, stills, layout, visible, lastChange) and calls boot(ENGINE) last.
 * The core keeps its internals to itself and exports the helpers listed at
 * its end, so an engine can name its own functions freely.
 * ========================================================================== */
const CORE = (() => {
/* ---------------- formats: one film, several aspect ratios ---------------- */
// ?format=9x16 (the scripts pass --format 9:16) re-sizes the film before anything reads FILM. A key of
// FILM.formats patches any field for that format (objects merge, arrays of items with an id merge by id,
// anything else is replaced). Without W and H in the patch, the standard ratios keep the film's short side:
// 1:1, 4:5, 9:16, 16:9. Positions stay authored in the base format; an engine maps them with fmtX/fmtY/fmtPos,
// which keep an element's offset from the centre (the default) or from the edge its pin names.
const BW = FILM.W, BH = FILM.H;
const FORMAT = (() => { const m = /[?&]format=(\d+)[x:](\d+)/.exec(location.search); return m ? `${m[1]}:${m[2]}` : null; })();
function mergeInto(a, b) {
  for (const [k, v] of Object.entries(b)) {
    const o = a[k];
    if (Array.isArray(v) && Array.isArray(o) && v.every((x) => x && x.id != null)) {
      for (const it of v) { const t = o.find((x) => x && x.id === it.id); if (t) mergeInto(t, it); else o.push(it); }
    } else if (v && typeof v === 'object' && !Array.isArray(v) && o && typeof o === 'object' && !Array.isArray(o)) mergeInto(o, v);
    else a[k] = v;
  }
  return a;
}
if (FORMAT) {
  const patch = (FILM.formats || {})[FORMAT] || {};
  const [ra, rb] = FORMAT.split(':').map(Number), short = Math.min(BW, BH);
  if (!(ra > 0 && rb > 0)) throw new Error(`bad format ${FORMAT}`);
  const size = ra === rb ? [short, short] : ra < rb ? [short, Math.round(short * rb / ra / 2) * 2] : [Math.round(short * ra / rb / 2) * 2, short];
  mergeInto(FILM, { W: size[0], H: size[1], ...patch });
}
const { W, H, FPS, DUR } = FILM;
const NFR = Math.round(DUR * FPS);                 // output frames in the loop
const CX = W / 2, CY = H / 2;
const U = Math.min(W, H) / 1080;                   // scale for built-in pixel constants
const PAL = FILM.palette;
const USED = new Set();                            // palette roles the film draws with
const col = (k) => PAL[k] || k;                    // look a role up (while drawing)
const role = (k) => { USED.add(k); return PAL[k] || k; };   // resolve and register a role (at build time)
const GRID = FILM.grid || {};
const MARGIN = GRID.margin != null ? GRID.margin : Math.round(104 * U);
const UNIT = GRID.unit || 8;
const MEASURE = W - 2 * MARGIN;
const FS = Math.min(W, H) / Math.min(BW, BH);      // base px -> this format's px
const FMT = { key: FORMAT || `${BW}x${BH}`, W, H, BW, BH, s: FS, aspect: W === H ? 'square' : W < H ? 'vertical' : 'horizontal' };
// pin: 'l' or 'r' keeps the distance from that edge, 't' or 'b' likewise; otherwise the offset from the centre
const fmtX = (x, pin = '') => /l/.test(pin) ? x * FS : /r/.test(pin) ? W - (BW - x) * FS : W / 2 + (x - BW / 2) * FS;
const fmtY = (y, pin = '') => /t/.test(pin) ? y * FS : /b/.test(pin) ? H - (BH - y) * FS : H / 2 + (y - BH / 2) * FS;
const fmtPos = (x, y, pin = '') => [fmtX(x, pin), fmtY(y, pin)];
const fmtSz = (v) => v * FS;
const LOOP = FILM.loop || 'hold';                  // 'hold': ends on a still copy of frame 0; 'cycle': periodic, continuous over the seam; 'none'
const BLUR = FILM.blur !== false;                  // false: one sample per frame (cartoon, pixel art)
const TRANSPARENT = !!FILM.transparent;            // clear to transparent instead of filling bg (bg stays the assumed backdrop)
const SHUTTER = 0.75;                              // 270 degrees, trailing
const MIN_SAMPLES = 4, MAX_SAMPLES = 64, PX_PER_SAMPLE = 5;   // Uint16 sums hold up to 257 x 255
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', FILM.alt || FILM.title || '');
if (FILM.title) document.title = FILM.title;
document.documentElement.style.background = PAL.bg;
document.body.style.background = PAL.bg;
// CPU raster everywhere: Chrome moves a canvas from GPU to CPU after repeated getImageData
// reads, which changes antialiasing mid-render. Pin every 2D context from its first call.
// An alpha channel, though every frame fills it opaque: on an opaque canvas Chromium draws text with
// LCD subpixel antialiasing (red and blue fringes on every glyph), whatever the command line says.
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: true });
const mkCanvas = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const mk2d = (w, h) => { const c = mkCanvas(w, h); return [c, c.getContext('2d', { willReadFrequently: true })]; };
const mctx = mkCanvas().getContext('2d', { willReadFrequently: true });   // measuring only

/* ---------------- springs: closed-form step responses ---------------- */
// [zeta, omega]. Underdamped (zeta < 1) overshoots and lands; zeta = 1 glides in without overshoot.
// Engines add their own (boot merges ENGINE.springs, then FILM.springs).
const SP = {
  SLAM: [0.60, 30.0], LAND: [0.72, 28.0], PUNCH: [0.65, 31.0], FADE: [1, 32.4],
  FOCUS: [1, 19.5], EXIT: [1, 32.4], PAN: [1, 32.4], DRAW: [1, 32.4],
  LINE: [0.80, 15.6], MASK: [1, 19.5], TICK: [1, 32.4],
};
const spring = (sp) => { const s = typeof sp === 'string' ? SP[sp] : sp; if (!s) throw new Error(`unknown spring ${sp}`); return s; };
const settle = (sp) => 16 / (sp[0] * sp[1]);       // after this the response snaps to exactly 1
function S(tau, sp) {
  const z = sp[0], w = sp[1];
  if (tau <= 0) return 0;
  if (tau >= settle(sp)) return 1;                 // residual < 2e-6 of the move: snap, so loops are bit-exact
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
  }
  return 1 - (1 + w * tau) * Math.exp(-w * tau);
}
function dS(tau, sp) {                             // d S / d tau, per second
  const z = sp[0], w = sp[1];
  if (tau <= 0 || tau >= settle(sp)) return 0;
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (w * w / wd) * Math.exp(-z * w * tau) * Math.sin(wd * tau); }
  return w * w * tau * Math.exp(-w * tau);
}
// the visible landing: the first crossing of the target when underdamped, 95 % when critically damped
function landT(sp) {
  sp = spring(sp);
  const z = sp[0], w = sp[1];
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (Math.PI - Math.atan(wd / (z * w))) / wd; }
  let a = 0, b = settle(sp);
  for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (S(m, sp) < 0.95) a = m; else b = m; }
  return b;
}

// A property = base value + one spring per target change (superposed). set() is an instant jump
// that cancels earlier springs; use it only while the element is invisible, at a hard cut, or hidden
// inside fast motion blur. Events are added in time order. In a looping film, springs still settling
// at the end of the loop carry over the seam into its start (only while no set() has happened yet),
// so the film is continuous there; the value a Prop ends on must equal the value it starts from.
const PROPS = [];
class Prop {
  constructor(v0, name) { this.v0 = v0; this.last = v0; this.ev = []; this.tLast = -Infinity; this.name = name || '?'; this.tail = null; this.firstSet = Infinity; PROPS.push(this); }
  order(t) { if (t < this.tLast - 1e-9) throw new Error(`${this.name}: event at ${t} added after one at ${this.tLast}`); this.tLast = t; this.tail = null; }
  to(t, v, sp) { this.order(t); this.ev.push({ t, d: v - this.last, sp: spring(sp), set: false }); this.last = v; return this; }
  set(t, v) { this.order(t); this.ev.push({ t, v, set: true }); this.last = v; return this; }
  seam() {                                         // the springs that carry over the seam
    if (this.tail) return this.tail;
    let k = -1;
    this.firstSet = Infinity;
    for (let i = 0; i < this.ev.length; i++) if (this.ev[i].set) { k = i; if (this.firstSet === Infinity) this.firstSet = this.ev[i].t; }
    this.tail = LOOP === 'none' ? [] : this.ev.slice(k + 1).filter((e) => e.d !== 0 && e.t + settle(e.sp) > DUR);
    return this.tail;
  }
  at(t) {
    let v = this.v0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) { v = ev[i].v; i0 = i + 1; }
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * S(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * (S(t + DUR - e.t, e.sp) - 1);
    return v;
  }
  vel(t) {                                         // per second
    let v = 0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) i0 = i + 1;
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * dS(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * dS(t + DUR - e.t, e.sp);
    return v;
  }
  active(a, b) {                                   // does the value change anywhere in (a, b]?
    for (const e of this.ev) {
      if (e.set) { if (e.t > a && e.t <= b) return true; }
      else if (e.d !== 0 && e.t < b && e.t + settle(e.sp) > a) return true;
    }
    if (a < this.firstSet) for (const e of this.seam()) if (e.t - DUR < b && e.t - DUR + settle(e.sp) > a) return true;
    return false;
  }
  settleEnd() { let m = -Infinity; for (const e of this.ev) m = Math.max(m, e.set ? e.t : e.t + settle(e.sp)); return m; }
  lastSet(a, b) { let m = -Infinity; for (const e of this.ev) if (e.set && e.t > a && e.t <= b && e.t > m) m = e.t; return m; }
}

/* ---------------- periodic motion and seeded randomness ---------------- */
// n whole cycles per loop: exact at the seam by construction. Use these for anything that never stops
// (an idle bob, a spin, a drifting field) and set ENGINE.always, or declare its windows with activeIn.
const cyc = (t, n, phase = 0) => TAU * (n * t / DUR + phase);
const wave = (t, n, phase = 0) => Math.sin(cyc(t, n, phase));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// three integers to [0, 1), well mixed: a pure replacement for Math.random keyed by what it decides
function hash(a, b = 0, c = 0) {
  let h = Math.imul((a | 0) ^ 0x3C6EF372, 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13) ^ (b | 0), 0xC2B2AE35);
  h = Math.imul(h ^ (h >>> 16) ^ (c | 0), 0x27D4EB2F);
  h ^= h >>> 15; h = Math.imul(h, 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
// smooth noise in [-1, 1] that loops exactly: three whole harmonics (n, 2n+1, 4n+3 cycles per loop) with seeded phases
function loopNoise(t, n, seed) {
  return (Math.sin(cyc(t, n, hash(seed, 1))) + 0.5 * Math.sin(cyc(t, 2 * n + 1, hash(seed, 2))) + 0.25 * Math.sin(cyc(t, 4 * n + 3, hash(seed, 3)))) / 1.75;
}
function shuffled(arr, seed) {                     // Fisher-Yates on a copy, seeded
  const r = mulberry32(seed), a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}

    } else if (h.kind === 'timer') {
      const left = Math.max(0, (h.from || 600) - (lt - at)), red = Math.floor(lt * 2) % 2;
      hudCard(c, CX, y, 440 * U, 170 * U, k);
      say(c, h.label || 'POLICE IN', 0, -36 * U, 'hud', 28 * U, 'dim');
      say(c, `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(Math.floor(left % 60)).padStart(2, '0')}`, 0, 44 * U, 'hud', 84 * U, red ? 'neon' : 'white');
      c.restore();
    } else if (h.kind === 'tag') {
      setFont(c, fontStr('hud', 34 * U)); const w = c.measureText(h.text || '').width + 60 * U;
      hudCard(c, CX, y, w, 80 * U, k); say(c, h.text || '', 0, 12 * U, 'hud', 34 * U, 'hud'); c.restore();
    }
  }
}

/* ---------------- captions: the voice's words, popping in as they are said ---------------- */
function buildCaptions() {
  const size0 = (CAPS.size || 78) * U, maxW = W - 2 * MARGIN, maxWords = CAPS.maxWords || 3;
  const all = [];
  for (const l of TIMING.lines) {
    let cur = [];
    const flush = () => { if (cur.length) all.push(cur); cur = []; };
    l.words.forEach((w, i) => {
      const next = l.words[i + 1];
      cur.push(w);
      if (cur.length >= maxWords || /[.,?!;:…]["'”’)]*$/.test(w.text) || (next && next.start - w.end > 0.3)) flush();
    });
    flush();
  }
  all.forEach((ws, i) => {
    const next = all[i + 1], show = Math.max(0, ws[0].start - 0.05), hide = Math.min(next ? next[0].start - 0.02 : DUR, ws[ws.length - 1].end + 0.7);
    let size = size0;
    const measure = () => { setFont(mctx, fontStr('caption', size)); const sp = mctx.measureText(' ').width; const xs = []; let x = 0; for (const w of ws) { const wd = mctx.measureText(w.text).width; xs.push([x, wd]); x += wd + sp; } return { xs, w: x - sp }; };
    let m = measure();
    while (m.w > maxW && size > 48 * U) { size -= 2 * U; m = measure(); }
    for (const w of ws) useText('caption', w.text);
    GROUPS.push({ ws, show, hide, size, xs: m.xs, x0: CX - m.w / 2, y: fmtY(CAPS.y || 1330) });
  });
  needContrast('captions', CAPS.fill || 'white', CAPS.stroke || 'ink', 4.5);
  for (const r of Object.values(CAPS.marks || {})) { role(r); needContrast(`captions ${r}`, r, CAPS.stroke || 'ink', 3); }
}
function drawCaptions(c, t) {
  const G = GROUPS.find((g) => t >= g.show && t < g.hide);
  if (!G) return;
  const fade = clamp((G.hide - t) / 0.12, 0, 1);
  setFont(c, fontStr('caption', G.size)); c.textAlign = 'left'; c.lineJoin = 'round';
  G.ws.forEach((w, i) => {
    const d = t - w.start + 0.03; if (d < 0) return;
    const k = S(d, spring('POP')), sc = 0.6 + 0.4 * k, x = G.x0 + G.xs[i][0], wd = G.xs[i][1];
    c.save(); c.globalAlpha = fade * clamp(k * 2, 0, 1); c.translate(x + wd / 2, G.y); c.scale(sc, sc); c.translate(-wd / 2, 0);
    c.lineWidth = G.size * 0.2; c.strokeStyle = col(CAPS.stroke || 'ink'); c.strokeText(w.text, 0, 0);
    c.fillStyle = col(w.mark ? (CAPS.marks || {})[w.mark] || 'neon' : CAPS.fill || 'white'); c.fillText(w.text, 0, 0);
    c.restore();
  });
}

/* ---------------- the camera and the frame ---------------- */
function sceneAt(t) { for (let i = SCENES.length - 1; i >= 0; i--) if (t >= SCENES[i].t0) return SCENES[i]; return SCENES[0]; }
function cameraOf(Sc, lt, td) {
  const C = Sc.cam || {}, a = C.from || [540, 960, 1], b = C.to || [a[0], a[1], a[2] * 1.06], k = easeIO(lt / Math.max(0.1, Sc.t1 - Sc.t0));
  let z = lerp(a[2], b[2], k), x = fmtX(lerp(a[0], b[0], k)), y = fmtY(lerp(a[1], b[1], k));
  const hw = W / (2 * z), hh = H / (2 * z);
  x = clamp(x, hw, W - hw); y = clamp(y, hh, H - hh);
  let dx = 0, dy = 0;
  for (const s of Sc.shake || []) {
    const tau = lt - s; if (tau < 0 || tau > 0.5) continue;
    const e = Math.exp(-tau / 0.12), n = Math.floor(td * DRAW_FPS);
    dx += 16 * U * e * (hash(0x5AC, n, 1) - 0.5) * 2; dy += 16 * U * e * (hash(0x5AC, n, 2) - 0.5) * 2;
  }
  return { x, y, z, dx, dy };
}
function drawFrame(c, t, q) {
  const dn = drawing(q, DRAW_FPS), td = dn / DRAW_FPS, Sc = sceneAt(t), lt = t - Sc.t0, ltd = td - Sc.t0;
  const cam = cameraOf(Sc, lt, td);
  c.save();
  c.translate(CX + cam.dx, CY + cam.dy); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y);
  SETS[Sc.set].draw(c, Sc, lt, td, dn, t, ltd);
  if (Sc.hero) drawCharacter(c, Sc.hero, td, dn);
  c.restore();
  if (Sc.rain) drawRain(c, t, Sc.rain);
  vignette(c);
  drawHud(c, Sc, lt, t);
  drawCaptions(c, t);
  const fadeIn = clamp(t / 0.25, 0, 1);              // the first frame opens on the picture, not black: a short lift only
  if (fadeIn < 1) { c.fillStyle = rgba('ink', 0.5 * (1 - fadeIn)); c.fillRect(0, 0, W, H); }
}

/* ---------------- analysis ---------------- */
function checks(add) {
  const tall = Math.abs(H / W - 16 / 9) < 0.01;
  add('format', tall ? 'PASS' : 'WARN', tall ? `${W} x ${H} (9:16)` : `${W} x ${H}: the sets are drawn for 9:16; check every still`);
  const dd = Math.abs(TIMING.dur - DUR);
  add('voice timing', dd < 0.05 ? 'PASS' : 'FAIL', dd < 0.05 ? `DUR ${DUR} s matches assets/timing.json` : `DUR ${DUR} s but the voice-over is ${TIMING.dur} s: run scripts/voice.mjs again`);
  const ids = FILM.scenes.map((s) => s.id).join(','), tids = TIMING.scenes.map((s) => s.id).join(',');
  add('voice scenes', ids === tids ? 'PASS' : 'FAIL', ids === tids ? `${SCENES.length} scenes` : 'the scenes changed since the voice-over was made: run scripts/voice.mjs again');
  for (const Sc of SCENES) {
    const d = Sc.t1 - Sc.t0;
    add(`scene: ${Sc.id}`, d < 1.2 ? 'WARN' : d > 9 ? 'WARN' : 'PASS', `${Sc.set}, ${Sc.t0.toFixed(2)} to ${Sc.t1.toFixed(2)} s (${d.toFixed(1)} s)${d > 9 ? ': over 9 s on one picture; split it' : d < 1.2 ? ': too short to read' : ''}`);
  }
  const last = SCENES[SCENES.length - 1];
  add('the ask', last.set === 'question' ? 'PASS' : 'WARN', last.set === 'question' ? 'the film ends on the question card' : 'the film should end on a question the viewer answers in the comments');
  const nW = GROUPS.reduce((n, g) => n + g.ws.length, 0), wps = nW / Math.max(1, TIMING.lines[TIMING.lines.length - 1].end - TIMING.lines[0].start);
  add('captions', nW ? 'PASS' : 'FAIL', `${GROUPS.length} groups, ${nW} words, ${wps.toFixed(1)} words a second`);
  const g0 = GROUPS[0]; if (g0) checkLiveArea(add, 'captions', [MARGIN, g0.y - g0.size, W - MARGIN, g0.y + g0.size * 0.3], false);
  const hook = TIMING.lines[0];
  add('hook', hook && hook.end <= 3 ? 'PASS' : 'WARN', hook ? `the first line ends at ${hook.end.toFixed(2)} s${hook.end <= 3 ? '' : ': the hook should land inside 3 s'}` : 'no lines');
  for (const l of TIMING.lines) if (l.known < l.of * 0.6) add(`timing: ${l.scene}`, 'WARN', `only ${l.known} of ${l.of} words were heard in "${l.text}"; check the captions against the voice`);
}
function stills(push) {
  for (const Sc of SCENES) {
    push((Sc.t0 + 0.6) * FPS, `${Sc.id}-in`, `${Sc.set}, just after the cut`);
    push(((Sc.t0 + Sc.t1) / 2) * FPS, `${Sc.id}-mid`, `${Sc.set}, mid-scene`);
  }
}
function layout() {
  return { scenes: SCENES.map((Sc) => ({ id: Sc.id, set: Sc.set, from: +Sc.t0.toFixed(3), to: +Sc.t1.toFixed(3), hero: !!Sc.hero, hud: (Sc.hud || []).map((h) => h.kind) })),
    captions: GROUPS.map((g) => ({ text: g.ws.map((w) => w.text).join(' '), from: +g.show.toFixed(2), to: +g.hide.toFixed(2), size: Math.round(g.size) })) };
}

function build() {
  TIMING = JSON.parse(dataText(FILM.timing));
  role('ink'); role('white'); role('bg');
  const ids = new Map(TIMING.scenes.map((s) => [s.id, s]));
  FILM.scenes.forEach((spec, i) => {
    if (!SETS[spec.set]) throw new Error(`scene ${spec.id}: unknown set "${spec.set}" (${Object.keys(SETS).join(', ')})`);
    const tm = ids.get(spec.id) || { start: i ? DUR : 0, end: DUR };
    const Sc = { ...spec, t0: tm.start, t1: Math.min(DUR, tm.end) };
    for (const r of SETS[spec.set].roles || []) role(r);
    if (SETS[spec.set].build) SETS[spec.set].build(Sc);
    if (spec.actor) Sc.hero = buildCharacter({ ...FILM.hero, ...spec.actor, id: `${spec.id}-HERO` }, i, Sc.t0);
    for (const h of spec.hud || []) {
      if (h.kind === 'money' || h.kind === 'meter') { cue(Sc.t0 + (h.at || 0), 'data', { dur: h.dur || 2, gain: -12 }); cue(Sc.t0 + (h.at || 0) + (h.dur || 2), 'lock', { gain: -8 }); }
      if (h.kind === 'clock') cue(Sc.t0 + (h.at || 0), 'data', { dur: h.dur || 2, gain: -14 });
      if (h.kind === 'timer') for (let s = 1; s < Sc.t1 - Sc.t0 - (h.at || 0); s++) cue(Sc.t0 + (h.at || 0) + s, 'tick', { gain: -10 });
      useText('hud', `${h.label || ''}${h.text || ''}$0123456789,:INTHEBAGSCOUNTINGPOLICETIME `);
    }
    for (const s of spec.shake || []) cue(Sc.t0 + s, 'hit', { gain: -6 });
    if (i) { cutAt(Sc.t0); cue(Sc.t0, 'whoosh', { gain: -12 }); }
    sectionAt(Sc.t0, spec.id);
    SCENES.push(Sc);
  });
  buildCaptions();
}

boot({
  name: 'story',
  springs: { SNAP: [0.7, 38], POP: [0.5, 22], BOUNCY: [0.32, 16], SWING: [0.5, 14], GLIDE: [1, 12] },
  always: true,
  backdrop: ['night', 'dusk', 'steel', 'ink', 'woodDk', 'bg'],
  gif: { fps: 10, width: 270 },
  build: () => { useText('title', '!?OR'); build(); }, draw: (c, t, q) => drawFrame(c, t, q), checks, stills, layout, visible: () => true,
});
})();
</script>
