<!doctype html>
<html lang="en">

<title>Acme 3D loop</title>
<style>
@font-face{font-family:"Unbounded";font-style:normal;font-weight:900;font-display:block;src:url(data:font/woff2;base64,__FONT:unbounded-latin-900-normal.woff2__) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:block;src:url(data:font/woff2;base64,__FONT:ibm-plex-mono-latin-500-normal.woff2__) format("woff2")}

<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * A 3D film is a world (background, floor, light), a camera, and objects:
 * extruded type and SVG logos, and primitives (box, sphere, torus, cylinder,
 * cone, capsule). World units are arbitrary; y is up, the floor is y = 0.
 * Every object is at rest at pos / rot / scale and moves on springs:
 *   enter: { at, from: {state}, spring, stagger }  from `from` to rest
 *   keys:  [{ at, to: {state}, spring, stagger }]
 *   exit:  { at, to: {state}, spring }
 * A state holds dx dy dz (units from rest), rx ry rz (degrees added), scale.
 * loop behaviours (spin, bob, orbit, wobble) run whole cycles per loop.
 * A 'cycle' loop keeps moving through the seam; every value ends where it
 * starts (a full turn counts: 360 degrees is where it started).
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Acme 3D loop',
  alt: 'The word ACME in chunky extruded letters, cream faces with coral sides, stands on a violet floor inside a yellow ring that wobbles round it, while teal spheres bob past. The letters flip over one by one, then hop in a wave. Example.com. Demo copy, fictional product.',
  W: 1080, H: 1080, FPS: 60, DUR: bar(5), BPM,
  loop: 'cycle',
  palette: { bg: '#221A3D', cream: '#FFF1DE', coral: '#FF6F61', sun: '#FFC53D', teal: '#35D0BA', lilac: '#9D8CFF', ink: '#221A3D' },
  fonts: {
    display: { family: 'Unbounded', weight: 900 },
    mono: { family: 'IBM Plex Mono', weight: 500 },
  },
  grid: { margin: 104, unit: 8 },
  poster: beat(12),
  world: {
    light: { dir: [-0.38, -0.8, -0.9], key: 0.74, ambient: 0.34, soft: 1.3 },   // dir: where the light travels (here: from above, front, right)
    floor: { y: 0, shadow: 0.42 },          // a shadow catcher: the floor is the background, darkened where shadowed
    rim: 0.18,                              // a white rim on edges turned from the camera
  },
  camera: {
    fov: 30, target: [0, 0.35, 0], dist: 16.5, yaw: -16, pitch: 14,
    sway: [1, 10],                          // [cycles per loop, degrees of yaw]
    keys: [{ at: beat(2), dist: 15, spring: 'DOLLY' }, { at: beat(14), dist: 16.5, spring: 'DOLLY' }],
  },
  objects: [
    { id: 'ACME', kind: 'text', text: 'ACME', font: 'display', cap: 1.08, depth: 0.5, bevel: 0.05, track: 40,
      color: 'cream', side: 'coral', gloss: 0.35, pos: [0, 0.02, 0],
      keys: [
        { at: beat(3), to: { rx: -360 }, spring: 'FLIP', stagger: 16 },
        { at: beat(10), to: { dy: 1.1 }, spring: 'HOP', stagger: 16 },
        { at: beat(10.75), to: { dy: 0 }, spring: 'LAND', stagger: 16 },
      ] },
    { id: 'RING', kind: 'torus', r: 3.6, tube: 0.13, color: 'sun', gloss: 0.6, pos: [0, 0.24, 0], rot: [4, 0, 3],
      loop: { orbit: [1, 0] } },
    { id: 'ORB', kind: 'sphere', r: 0.34, color: 'teal', gloss: 0.7, pos: [0, 0.7, 0],
      repeat: { radial: 3, r: 4.3, start: 30 }, loop: { orbit: [-1, 0], bob: [4, 0.3], phase: 'index' } },
    { id: 'CUBE', kind: 'box', size: [0.8, 0.8, 0.8], radius: 0.15, color: 'lilac', gloss: 0.4, pos: [3.2, 0.4, -3.4], rot: [0, 30, 0],
      loop: { spin: ['y', 1] } },
  ],
  labels: [
    { id: 'URL', text: 'EXAMPLE.COM', font: 'mono', size: 40, track: 60, anchor: 'C', x: 540, y: 880, color: 'sun' },
    { id: 'DEMO', text: 'DEMO COPY, FICTIONAL PRODUCT', font: 'mono', size: 26, track: 20, anchor: 'C', x: 540, y: 944, color: 'cream' },
  ],
  formats: {
    // 9:16: the camera pulls back to keep ACME's width (automatic), and further so the ring and the orbs' orbit
    // stay whole (contain); a steeper view opens the ring into a tall ellipse, the orbs bob higher through the
    // extra height, and the labels sit under the ring
    '9:16': {
      camera: { pitch: 30, target: [0, -0.3, 0], contain: ['RING', 'ORB'] },   // the ring and the orbs' orbit stay whole
      objects: [{ id: 'ORB', pos: [0, 1.2, 0], loop: { bob: [4, 0.8] } }],
      labels: [{ id: 'URL', y: 848 }, { id: 'DEMO', y: 912 }],
    },
    // 16:9: the height frames it as at 1:1; the camera comes closer, so the ring spans two thirds of the width
    '16:9': {
      camera: { dist: 14, target: [0, 0.15, 0], keys: [{ at: beat(2), dist: 13, spring: 'DOLLY' }, { at: beat(14), dist: 14, spring: 'DOLLY' }] },
    },
  },
};

/* ===== CORE BEGIN: shared/core.js, synced by tools/sync.mjs. Do not edit it here. ===== */
/* ==========================================================================
 * CORE: the deterministic runtime every motion-* engine shares.
 * Source: shared/core.js in the motion-launch-videos repo, copied into each
 * template by tools/sync.mjs. Do not edit it inside a film.
 *
 * seek(t) is a pure function of (t mod DUR): same t, same pixels, whatever was
 * drawn before. No timers, no Date, no Math.random, no state between calls.
 *   - Springs are closed-form step responses, one per target change, snapped
 *     to exactly 1 once settled. A Prop is a base value plus its springs.
 *     Springs still settling when the loop ends carry over the seam.
 *   - Periodic motion runs a whole number of cycles per loop (cyc, wave,
 *     loopNoise), so it is exact at the seam by construction.
 *   - Randomness is seeded (mulberry32, hash).
 *   - Continuous motion reads the exact t; discrete state (typing, drawings
 *     held on twos, sprite frames, line boil) reads the quantised q, so every
 *     subframe of one output frame agrees on it.
 *   - Motion blur averages 1 to 64 subframes on a trailing 270-degree
 *     shutter, one per 5 px of movement, never across a hard cut.
 *   - Sound (FILM.audio) is synthesised from cues in an OfflineAudioContext,
 *     outside seek(), from seeded noise; a bed (FILM.audio.bed) adds music in
 *     a key, a reverb runs in plain JS; FILM.transparent clears to alpha.
 * The engine below describes its vertical through hooks (build, draw, disp,
 * checks, stills, layout, visible, lastChange) and calls boot(ENGINE) last.
 * The core keeps its internals to itself and exports the helpers listed at
 * its end, so an engine can name its own functions freely.
 * ========================================================================== */
const CORE = (() => {
/* ---------------- formats: one film, several aspect ratios ---------------- */
// ?format=9x16 (the scripts pass --format 9:16) re-sizes the film before anything reads FILM. A key of
// FILM.formats patches any field for that format (objects merge, arrays of items with an id merge by id,
// anything else is replaced). Without W and H in the patch, the standard ratios keep the film's short side:
// 1:1, 4:5, 9:16, 16:9. Positions stay authored in the base format; an engine maps them with fmtX/fmtY/fmtPos,
// which keep an element's offset from the centre (the default) or from the edge its pin names.
const BW = FILM.W, BH = FILM.H;
const FORMAT = (() => { const m = /[?&]format=(\d+)[x:](\d+)/.exec(location.search); return m ? `${m[1]}:${m[2]}` : null; })();
function mergeInto(a, b) {
  for (const [k, v] of Object.entries(b)) {
    const o = a[k];
    if (Array.isArray(v) && Array.isArray(o) && v.every((x) => x && x.id != null)) {
      for (const it of v) { const t = o.find((x) => x && x.id === it.id); if (t) mergeInto(t, it); else o.push(it); }
    } else if (v && typeof v === 'object' && !Array.isArray(v) && o && typeof o === 'object' && !Array.isArray(o)) mergeInto(o, v);
    else a[k] = v;
  }
  return a;
}
if (FORMAT) {
  const patch = (FILM.formats || {})[FORMAT] || {};
  const [ra, rb] = FORMAT.split(':').map(Number), short = Math.min(BW, BH);
  if (!(ra > 0 && rb > 0)) throw new Error(`bad format ${FORMAT}`);
  const size = ra === rb ? [short, short] : ra < rb ? [short, Math.round(short * rb / ra / 2) * 2] : [Math.round(short * ra / rb / 2) * 2, short];
  mergeInto(FILM, { W: size[0], H: size[1], ...patch });
}
const { W, H, FPS, DUR } = FILM;
const NFR = Math.round(DUR * FPS);                 // output frames in the loop
const CX = W / 2, CY = H / 2;
const U = Math.min(W, H) / 1080;                   // scale for built-in pixel constants
const PAL = FILM.palette;
const USED = new Set();                            // palette roles the film draws with
const col = (k) => PAL[k] || k;                    // look a role up (while drawing)
const role = (k) => { USED.add(k); return PAL[k] || k; };   // resolve and register a role (at build time)
const GRID = FILM.grid || {};
const MARGIN = GRID.margin != null ? GRID.margin : Math.round(104 * U);
const UNIT = GRID.unit || 8;
const MEASURE = W - 2 * MARGIN;
const FS = Math.min(W, H) / Math.min(BW, BH);      // base px -> this format's px
const FMT = { key: FORMAT || `${BW}x${BH}`, W, H, BW, BH, s: FS, aspect: W === H ? 'square' : W < H ? 'vertical' : 'horizontal' };
// pin: 'l' or 'r' keeps the distance from that edge, 't' or 'b' likewise; otherwise the offset from the centre
const fmtX = (x, pin = '') => /l/.test(pin) ? x * FS : /r/.test(pin) ? W - (BW - x) * FS : W / 2 + (x - BW / 2) * FS;
const fmtY = (y, pin = '') => /t/.test(pin) ? y * FS : /b/.test(pin) ? H - (BH - y) * FS : H / 2 + (y - BH / 2) * FS;
const fmtPos = (x, y, pin = '') => [fmtX(x, pin), fmtY(y, pin)];
const fmtSz = (v) => v * FS;
const LOOP = FILM.loop || 'hold';                  // 'hold': ends on a still copy of frame 0; 'cycle': periodic, continuous over the seam; 'none'
const BLUR = FILM.blur !== false;                  // false: one sample per frame (cartoon, pixel art)
const TRANSPARENT = !!FILM.transparent;            // clear to transparent instead of filling bg (bg stays the assumed backdrop)
const SHUTTER = 0.75;                              // 270 degrees, trailing
const MIN_SAMPLES = 4, MAX_SAMPLES = 64, PX_PER_SAMPLE = 5;   // Uint16 sums hold up to 257 x 255
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', FILM.alt || FILM.title || '');
if (FILM.title) document.title = FILM.title;
document.documentElement.style.background = PAL.bg;
document.body.style.background = PAL.bg;
// CPU raster everywhere: Chrome moves a canvas from GPU to CPU after repeated getImageData
// reads, which changes antialiasing mid-render. Pin every 2D context from its first call.
// An alpha channel, though every frame fills it opaque: on an opaque canvas Chromium draws text with
// LCD subpixel antialiasing (red and blue fringes on every glyph), whatever the command line says.
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: true });
const mkCanvas = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const mk2d = (w, h) => { const c = mkCanvas(w, h); return [c, c.getContext('2d', { willReadFrequently: true })]; };
const mctx = mkCanvas().getContext('2d', { willReadFrequently: true });   // measuring only

/* ---------------- springs: closed-form step responses ---------------- */
// [zeta, omega]. Underdamped (zeta < 1) overshoots and lands; zeta = 1 glides in without overshoot.
// Engines add their own (boot merges ENGINE.springs, then FILM.springs).
const SP = {
  SLAM: [0.60, 30.0], LAND: [0.72, 28.0], PUNCH: [0.65, 31.0], FADE: [1, 32.4],
  FOCUS: [1, 19.5], EXIT: [1, 32.4], PAN: [1, 32.4], DRAW: [1, 32.4],
  LINE: [0.80, 15.6], MASK: [1, 19.5], TICK: [1, 32.4],
};
const spring = (sp) => { const s = typeof sp === 'string' ? SP[sp] : sp; if (!s) throw new Error(`unknown spring ${sp}`); return s; };
const settle = (sp) => 16 / (sp[0] * sp[1]);       // after this the response snaps to exactly 1
function S(tau, sp) {
  const z = sp[0], w = sp[1];
  if (tau <= 0) return 0;
  if (tau >= settle(sp)) return 1;                 // residual < 2e-6 of the move: snap, so loops are bit-exact
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
  }
  return 1 - (1 + w * tau) * Math.exp(-w * tau);
}
function dS(tau, sp) {                             // d S / d tau, per second
  const z = sp[0], w = sp[1];
  if (tau <= 0 || tau >= settle(sp)) return 0;
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (w * w / wd) * Math.exp(-z * w * tau) * Math.sin(wd * tau); }
  return w * w * tau * Math.exp(-w * tau);
}
// the visible landing: the first crossing of the target when underdamped, 95 % when critically damped
function landT(sp) {
  sp = spring(sp);
  const z = sp[0], w = sp[1];
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (Math.PI - Math.atan(wd / (z * w))) / wd; }
  let a = 0, b = settle(sp);
  for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (S(m, sp) < 0.95) a = m; else b = m; }
  return b;
}

// A property = base value + one spring per target change (superposed). set() is an instant jump
// that cancels earlier springs; use it only while the element is invisible, at a hard cut, or hidden
// inside fast motion blur. Events are added in time order. In a looping film, springs still settling
// at the end of the loop carry over the seam into its start (only while no set() has happened yet),
// so the film is continuous there; the value a Prop ends on must equal the value it starts from.
const PROPS = [];
class Prop {
  constructor(v0, name) { this.v0 = v0; this.last = v0; this.ev = []; this.tLast = -Infinity; this.name = name || '?'; this.tail = null; this.firstSet = Infinity; PROPS.push(this); }
  order(t) { if (t < this.tLast - 1e-9) throw new Error(`${this.name}: event at ${t} added after one at ${this.tLast}`); this.tLast = t; this.tail = null; }
  to(t, v, sp) { this.order(t); this.ev.push({ t, d: v - this.last, sp: spring(sp), set: false }); this.last = v; return this; }
  set(t, v) { this.order(t); this.ev.push({ t, v, set: true }); this.last = v; return this; }
  seam() {                                         // the springs that carry over the seam
    if (this.tail) return this.tail;
    let k = -1;
    this.firstSet = Infinity;
    for (let i = 0; i < this.ev.length; i++) if (this.ev[i].set) { k = i; if (this.firstSet === Infinity) this.firstSet = this.ev[i].t; }
    this.tail = LOOP === 'none' ? [] : this.ev.slice(k + 1).filter((e) => e.d !== 0 && e.t + settle(e.sp) > DUR);
    return this.tail;
  }
  at(t) {
    let v = this.v0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) { v = ev[i].v; i0 = i + 1; }
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * S(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * (S(t + DUR - e.t, e.sp) - 1);
    return v;
  }
  vel(t) {                                         // per second
    let v = 0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) i0 = i + 1;
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * dS(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * dS(t + DUR - e.t, e.sp);
    return v;
  }
  active(a, b) {                                   // does the value change anywhere in (a, b]?
    for (const e of this.ev) {
      if (e.set) { if (e.t > a && e.t <= b) return true; }
      else if (e.d !== 0 && e.t < b && e.t + settle(e.sp) > a) return true;
    }
    if (a < this.firstSet) for (const e of this.seam()) if (e.t - DUR < b && e.t - DUR + settle(e.sp) > a) return true;
    return false;
  }
  settleEnd() { let m = -Infinity; for (const e of this.ev) m = Math.max(m, e.set ? e.t : e.t + settle(e.sp)); return m; }

}

/* ---------------- periodic motion and seeded randomness ---------------- */
// n whole cycles per loop: exact at the seam by construction. Use these for anything that never stops
// (an idle bob, a spin, a drifting field) and set ENGINE.always, or declare its windows with activeIn.
const cyc = (t, n, phase = 0) => TAU * (n * t / DUR + phase);
const wave = (t, n, phase = 0) => Math.sin(cyc(t, n, phase));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

// three integers to [0, 1), well mixed: a pure replacement for Math.random keyed by what it decides
function hash(a, b = 0, c = 0) {
  let h = Math.imul((a | 0) ^ 0x3C6EF372, 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13) ^ (b | 0), 0xC2B2AE35);
  h = Math.imul(h ^ (h >>> 16) ^ (c | 0), 0x27D4EB2F);
  h ^= h >>> 15; h = Math.imul(h, 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;

function loopNoise(t, n, seed) {
  return (Math.sin(cyc(t, n, hash(seed, 1))) + 0.5 * Math.sin(cyc(t, 2 * n + 1, hash(seed, 2))) + 0.25 * Math.sin(cyc(t, 4 * n + 3, hash(seed, 3)))) / 1.75;
}
function shuffled(arr, seed) {                     // Fisher-Yates on a copy, seeded
  const r = mulberry32(seed), a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}

/* ---------------- time ---------------- */
const wrapT = (t) => ((t % DUR) + DUR) % DUR;
const frameOf = (t) => Math.ceil(t * FPS - 1e-9);  // all subframes of output frame n map to n
const typed = (q, ts, n) => Math.max(0, Math.min(n, Math.ceil((q - ts) * FPS - 1e-6)));   // one character per frame
const noteSec = (v) => (typeof v === 'number' && v >= 1 ? 4 * 60 / FILM.BPM / v : v);     // 16 -> a 16th note
const drawing = (q, fps) => Math.floor(q * fps + 1e-6);    // index of the held drawing (12 fps = on twos at 24, fives at 60)

/* ---------------- colour ---------------- */
function rgbOf(hex) { const h = String(hex).replace('#', ''); const n = parseInt(h.length === 3 ? h.replace(/./g, '$&$&') : h.slice(0, 6), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

  if (mx === r) h = 60 * (((g - b) / C) % 6); else if (mx === g) h = 60 * ((b - r) / C + 2); else h = 60 * ((r - g) / C + 4);
  return [h < 0 ? h + 360 : h, C];
}
const hueDist = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
function lum(hex) { const c = rgbOf(hex).map((v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }

  return ca >= 40 && cb >= 40 && hueDist(ha, hb) > 13;

/* ---------------- fonts and type ---------------- */
const face = (r) => { const f = FILM.fonts && FILM.fonts[r]; if (!f) throw new Error(`no font role "${r}"`); return f; };
const fontStr = (r, size) => { const f = face(r); return `${f.style === 'italic' ? 'italic ' : ''}${f.weight} ${size}px "${f.family}"`; };
function setFont(c, f) { c.font = f; c.fontKerning = 'normal'; c.letterSpacing = '0px'; c.textBaseline = 'alphabetic'; c.textAlign = 'left'; }

  const out = {};
  for (const [r, s] of Object.entries(TEXT)) { const f = face(r), k = `${f.family}|${f.weight}`; out[k] = (out[k] || '') + s; }
  return out;

  const lvp = m4.mul(m4.ortho(-R, R, -R, R, 1, 60), lview);
  const draws = [];
  for (const Ob of OBJECTS) for (const cp of Ob.copies) { const M = modelOf(Ob, cp, t); if (Math.abs(M[0]) + Math.abs(M[5]) + Math.abs(M[10]) < 1e-6) continue; draws.push({ Ob, cp, M }); }
  // shadow pass: depth from the light
  gl.bindFramebuffer(gl.FRAMEBUFFER, G.shFb); gl.viewport(0, 0, G.shN, G.shN);
  gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(G.depth.p); gl.uniformMatrix4fv(G.depth.u.uLVP, false, lvp);
  for (const d of draws) if (d.Ob.spec.shadow !== false) { gl.uniformMatrix4fv(G.depth.u.uM, false, d.M); for (const m of d.cp.gl) { gl.bindVertexArray(m.vao); gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_INT, 0); } }
  // main pass into the multisampled buffer
  gl.bindFramebuffer(gl.FRAMEBUFFER, G.fb); gl.viewport(0, 0, W, H);
  const bg = rgbOf(PAL.bg).map((v) => v / 255);
  gl.clearColor(bg[0], bg[1], bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const u = G.main.u; gl.useProgram(G.main.p);
  gl.uniformMatrix4fv(u.uVP, false, cam.vp); gl.uniformMatrix4fv(u.uLVP, false, lvp);
  gl.uniform3fv(u.uLd, L); gl.uniform3fv(u.uCam, cam.eye); gl.uniform3fv(u.uBg, linOf(PAL.bg));
  gl.uniform1f(u.uAmb, Lt.ambient != null ? Lt.ambient : 0.3); gl.uniform1f(u.uKey, Lt.key != null ? Lt.key : 0.75); gl.uniform1f(u.uRim, WORLD.rim != null ? WORLD.rim : 0.15);
  gl.uniform1f(u.uTexel, 1 / G.shN); gl.uniform1f(u.uSoft, Lt.soft != null ? Lt.soft : 1.5);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, G.shTex); gl.uniform1i(u.uSh, 0);
  if (WORLD.floor !== false) {
    const F = WORLD.floor || {};
    gl.uniform1f(u.uFloor, 1); gl.uniform1f(u.uShadowK, F.shadow != null ? F.shadow : 0.4);
    const M = m4.trs([0, F.y || 0, 0], [0, 0, 0], [1, 1, 1]);
    gl.uniformMatrix4fv(u.uM, false, M); gl.uniformMatrix3fv(u.uNM, false, m4.normal(M));
    gl.bindVertexArray(G.floor.vao); gl.drawElements(gl.TRIANGLES, G.floor.n, gl.UNSIGNED_INT, 0);
  }
  gl.uniform1f(u.uFloor, 0);
  for (const d of draws) {
    const o = d.Ob.spec;
    gl.uniformMatrix4fv(u.uM, false, d.M); gl.uniformMatrix3fv(u.uNM, false, m4.normal(d.M));
    gl.uniform1f(u.uGloss, o.gloss != null ? o.gloss : 0.35); gl.uniform1f(u.uToon, o.toon ? 1 : 0);
    d.cp.gl.forEach((m, i) => { gl.uniform3fv(u.uC, i === 1 ? d.Ob.side : d.Ob.color); gl.bindVertexArray(m.vao); gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_INT, 0); });
  }
  gl.bindVertexArray(null);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, G.fb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function drawFrame(c, t, q) {
  renderGL(t);
  c.drawImage(glc, 0, 0);
  for (const Lb of LABELS) {                        // flat labels over the picture: sharp type for small print
    const a = Lb.op ? Lb.op.at(t) : 1;
    if (!(a > 0.002)) continue;
    setFont(c, Lb.line.font);
    for (const g of Lb.line.glyphs) if (!g.space) fillGlyph(c, g.ch, g.x, Lb.line.baseline, Lb.color, a, 0);
  }
  c.globalAlpha = 1;
}

/* ---------------- motion and analysis ---------------- */
function disp(ta, tb) {                            // how far any corner of any object moves on screen
  const va = cameraAt(ta).vp, vb = cameraAt(tb).vp;
  let d = 0;
  for (const Ob of OBJECTS) for (const cp of Ob.copies) {
    const Ma = modelOf(Ob, cp, ta), Mb = modelOf(Ob, cp, tb);
    for (const m of cp.gl) for (const p of boxCorners(m.box)) {
      const a = toScreen(va, m4.apply(Ma, p)), b = toScreen(vb, m4.apply(Mb, p));
      if (a[2] > 1 || b[2] > 1) continue;
      d = Math.max(d, Math.hypot(b[0] - a[0], b[1] - a[1]));
    }
  }
  for (const Lb of LABELS) if (Lb.op && Lb.op.active(ta, tb)) d = Math.max(d, 4);
  return d;
}
function screenBox(Ob, t) {
  const vp = cameraAt(t).vp;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const cp of Ob.copies) { const M = modelOf(Ob, cp, t); for (const m of cp.gl) for (const p of boxCorners(m.box)) { const s = toScreen(vp, m4.apply(M, p)); x0 = Math.min(x0, s[0]); x1 = Math.max(x1, s[0]); y0 = Math.min(y0, s[1]); y1 = Math.max(y1, s[1]); } }
  return [x0, y0, x1, y1];
}
function visible(t) {
  for (const Ob of OBJECTS) { const b = screenBox(Ob, t); if (b[2] > 0 && b[0] < W && b[3] > 0 && b[1] < H && Ob.copies.some((cp) => Math.abs(cp.P.sc.at(t)) > 0.05)) return true; }
  return LABELS.some((Lb) => !Lb.op || Lb.op.at(t) > 0.5);
}
function checks(add) {
  const samples = [0, DUR * 0.25, DUR * 0.5, DUR * 0.75];
  for (const Ob of OBJECTS) {
    if (Ob.spec.kind === 'text') {
      for (const t of samples) { const b = screenBox(Ob, t); if (b[0] < MARGIN - 1 || b[2] > W - MARGIN + 1 || b[1] < MARGIN - 1 || b[3] > H - MARGIN + 1) { add(`live area: ${Ob.id}`, 'FAIL', `leaves the margins at ${t.toFixed(2)} s: ${b.map((v) => v.toFixed(0)).join(', ')}`); break; } }
      const vp = cameraAt(0).vp, a = toScreen(vp, [0, 0, 0]), b = toScreen(vp, [0, Ob.capU, 0]), cap = Math.abs(a[1] - b[1]);
      add(`type size: ${Ob.id}`, cap < 60 ? 'WARN' : 'PASS', `cap height about ${cap.toFixed(0)} px on screen at 0 s${cap < 60 ? ' (small for a title at feed size)' : ''}`);
      const words = Ob.spec.text.split(/\s+/).filter(Boolean).length;
      add(`words: ${Ob.id}`, words > 4 ? 'FAIL' : 'PASS', `${words} words`);
      const tris = Ob.copies.reduce((s, cp) => s + cp.gl.reduce((q, m) => q + m.n / 3, 0), 0);
      add(`mesh: ${Ob.id}`, tris > 0 ? 'PASS' : 'FAIL', `${Ob.copies.length} glyph solids, ${tris} triangles`);
    }
    if (Ob.spec.kind === 'path') { const tris = Ob.copies.reduce((s, cp) => s + cp.gl.reduce((q, m) => q + m.n / 3, 0), 0); add(`mesh: ${Ob.id}`, tris > 0 ? 'PASS' : 'FAIL', `${tris} triangles`); }
  }
  for (const Lb of LABELS) {
    checkLiveArea(add, Lb.id, [Lb.line.inkL, Lb.line.top, Lb.line.inkR, Lb.line.bottom], Lb.bleed);
    if (Lb.line.baseline % UNIT) add(`grid: ${Lb.id}`, 'WARN', `baseline ${Lb.line.baseline} is not on the ${UNIT} px grid`);
  }
  checkSpacing(add, LABELS.map((Lb) => ({ id: Lb.id, b: [Lb.line.inkL, Lb.line.top, Lb.line.inkR, Lb.line.bottom] })));
  add('renderer', 'PASS', `WebGL2, ${G.samples}x MSAA, ${G.shN} px shadow map`);
}
function cycles() {
  const out = [], C = FILM.camera || {};
  if (C.sway) out.push({ what: 'camera sway', period: DUR / C.sway[0] });
  if (C.orbit) out.push({ what: 'camera orbit', period: DUR / C.orbit });
  for (const Ob of OBJECTS) { const B = Ob.spec.loop || {}; for (const k of ['spin', 'bob', 'orbit', 'wobble']) if (B[k]) { const n = k === 'spin' ? B[k][1] : B[k][0]; if (n) out.push({ what: `${Ob.id} ${k}`, period: DUR / Math.abs(n) }); } }
  return out;
}
function stills(push) {
  const keys = new Set();
  for (const Ob of OBJECTS) {
    const o = Ob.spec;
    if (o.enter) keys.add(o.enter.at + 0.8);
    for (const k of o.keys || []) keys.add(k.at + (k.stagger ? noteSec(k.stagger) * Math.max(0, Ob.copies.length - 1) / 2 : 0) + 0.15);
  }
  for (const k of (FILM.camera || {}).keys || []) keys.add(k.at + 0.6);
  [...keys].sort((a, b) => a - b).forEach((t, i) => push(wrapT(t) * FPS, `key-${i + 1}`, `at ${wrapT(t).toFixed(2)} s`));
  push(NFR / 2, 'midpoint', 'halfway through the loop');
}
function layout() {
  return { objects: OBJECTS.map((Ob) => ({ id: Ob.id, kind: Ob.spec.kind, copies: Ob.copies.length, triangles: Ob.copies.reduce((s, cp) => s + cp.gl.reduce((q, m) => q + m.n / 3, 0), 0), screenBoxAt0: screenBox(Ob, 0).map((v) => Math.round(v)) })),
    labels: LABELS.map((Lb) => ({ id: Lb.id, size: Lb.line.size, box: [Lb.line.inkL, Lb.line.top, Lb.line.inkR, Lb.line.bottom].map((v) => Math.round(v)) })) };
}

function build() {
  initGL();
  const C = FILM.camera || {};
  camP = { yaw: new Prop(C.yaw || 0, 'camera.yaw'), pitch: new Prop(C.pitch != null ? C.pitch : 12, 'camera.pitch'), dist: new Prop(C.dist || 14, 'camera.dist'), fov: new Prop(C.fov || 30, 'camera.fov'),
    tx: new Prop((C.target || [0, 1, 0])[0], 'camera.tx'), ty: new Prop((C.target || [0, 1, 0])[1], 'camera.ty'), tz: new Prop((C.target || [0, 1, 0])[2], 'camera.tz') };
  for (const k of (C.keys || []).slice().sort((a, b) => a.at - b.at)) {
    for (const f of ['yaw', 'pitch', 'dist', 'fov']) if (k[f] != null) camP[f].to(k.at, k[f], k.spring || 'DOLLY');
    if (k.target) ['tx', 'ty', 'tz'].forEach((f, i) => camP[f].to(k.at, k.target[i], k.spring || 'DOLLY'));
  }
  (FILM.objects || []).forEach((o, i) => OBJECTS.push(buildObject(o, i)));
  fitFormat();
  initFloor();
  for (const L0 of FILM.labels || []) {
    // authored in the base format; pin 't', 'b', 'l', 'r' keeps the distance from that edge, and a baseline
    // moved by the format moves by whole grid units, so it stays on the grid
    const pin = L0.pin || '', same = W === FMT.BW && H === FMT.BH;
    const bx = same || L0.x == null ? L0.x : fmtX(L0.x, pin), by = same || L0.y == null ? L0.y : L0.y + Math.round((fmtY(L0.y, pin) - L0.y) / UNIT) * UNIT;
    const line = layoutText({ id: L0.id, text: L0.text, font: L0.font || 'mono', size: L0.size, cap: L0.cap, fit: L0.fit, track: L0.track, anchor: L0.anchor || 'C', x: bx, baseline: by });
    const Lb = { ...L0, line, color: role(L0.color || 'fg') };
    if (L0.enter) { Lb.op = new Prop(0, `${L0.id}.op`); Lb.op.to(L0.enter.at, 1, 'FADE'); if (L0.exit) Lb.op.to(L0.exit.at, 0, 'FADE'); }
    LABELS.push(Lb);
    needContrast(L0.id, L0.color || 'fg', L0.on || 'bg', (L0.size || 99) < 40 ? 4.5 : 3);
  }
}

// the shadow catcher is background: the floor in full shadow, for the composition check (soft edges lie between)
const FLOOR_SHADOW = (() => {
  const F = WORLD.floor; if (F === false) return [];
  const k = 1 - (F && F.shadow != null ? F.shadow : 0.4), enc = (v) => 255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
  return [hexOf(...linOf(PAL.bg).map((v) => enc(v * k)))];
})();

boot({
  name: '3d',
  backdrop: FLOOR_SHADOW,
  springs: { FLIP: [0.55, 12], HOP: [0.8, 22], DOLLY: [1, 3.2], SETTLE: [0.62, 9] },
  always: true,
  minSamples: 2,                                    // every subframe is a full render: slow drifts take 2, still one per 5 px
  build, draw: (c, t, q) => drawFrame(c, t, q), disp, checks, cycles, stills, layout, visible,
});
})();
