'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * One overlay per film: it comes in, holds, and goes out, over a transparent
 * background, for an editor to lay over their own footage.
 *   timing: { in, hold, out }  seconds; DUR follows them (change hold, not DUR)
 *   overlay: { kind, ... }     lower-third, title, social, endscreen, bug,
 *                              callout, progress or badge (engine.md)
 * Positions are base-format pixels (1920 x 1080) mapped with a pin: 'bl'
 * keeps the distance to the bottom and left edges in every format; no pin
 * keeps the offset from the centre. Colours are palette role names; bg is
 * the footage the overlay is judged and previewed against, never drawn.
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Acme Studio lower third',
  alt: 'A lower third wipes in at the bottom left: Rowan Tessaly, host, Acme Studio. It holds, then wipes out. Demo copy, fictional product.',
  W: 1920, H: 1080, FPS: 60, BPM,
  palette: { bg: '#56606B', dark: '#111318', light: '#FFFFFF', accent: '#FFB224' },
  transparent: true,                         // ProRes 4444 .mov and VP9 .webm with alpha; the MP4 and GIF over bg
  loop: 'none',                              // in, hold, out ('hold' only for a bug or a badge that stays on)
  timing: { in: 0.75, hold: 4, out: 0.5 },   // the overlay lands within `in`, rests `hold`, is gone within `out`
  get DUR() { return this.timing.in + this.timing.hold + this.timing.out; },
  fonts: {
    name: { family: 'Barlow', weight: 700 },
    label: { family: 'Barlow', weight: 600 },
  },
  poster: 2,
  overlay: {
    kind: 'lower-third',
    x: 144, y: 918, pin: 'bl',               // the stack's bottom-left corner
    bar: { fill: 'accent', w: 12 },
    lines: [
      { id: 'name', text: 'Rowan Tessaly', font: 'name', cap: 48, fill: 'light', plate: 'dark', pad: [32, 24] },
      { id: 'role', text: 'HOST, ACME STUDIO', font: 'label', cap: 26, track: 90, fill: 'dark', plate: 'accent', pad: [32, 15] },
    ],
  },
  // Small print that rides with the overlay. Delete it for a real film.
  tag: { text: 'DEMO COPY, FICTIONAL PRODUCT', font: 'label', cap: 26, track: 60, fill: 'light', plate: 'dark', x: 1776, y: 918, pin: 'br' },
  composition: { lean: 'bottom', why: 'a lower third sits low in the frame, clear of faces' },
  audio: { loudness: -20 },                  // a whoosh in and a swish out, for the editor's timeline (.wav)
  formats: {
    // Vertical: bigger type, raised just above the bottom quarter (the feed's caption) and clear of the buttons
    // on the right.
    // Composition: the frame is narrow, so the stack reads as leaning left rather than low.
    '9:16': {
      overlay: { x: 72, y: 592, lines: [{ id: 'name', cap: 56, pad: [36, 28] }, { id: 'role', cap: 30, pad: [36, 17] }] },
      tag: { x: 72, y: 324, pin: 'tl' },
      composition: { lean: 'left', why: 'a lower third starts at the left edge of a narrow frame' },
    },
    // Square: the tag moves to the top right, out of the stack's way.
    '1:1': { tag: { y: 96, pin: 'tr' } },
  },
};

/* ===== CORE BEGIN: shared/core.js, synced by tools/sync.mjs. Do not edit it here. ===== */
/* ==========================================================================
 * CORE: the deterministic runtime every motion-* engine shares.
 * Source: shared/core.js in the motion-launch-videos repo, copied into each
 * template by tools/sync.mjs. Do not edit it inside a film.
 *
 * seek(t) is a pure function of (t mod DUR): same t, same pixels, whatever was
 * drawn before. No timers, no Date, no Math.random, no state between calls.
 *   - Springs are closed-form step responses, one per target change, snapped
 *     to exactly 1 once settled. A Prop is a base value plus its springs.
 *     Springs still settling when the loop ends carry over the seam.
 *   - Periodic motion runs a whole number of cycles per loop (cyc, wave,
 *     loopNoise), so it is exact at the seam by construction.
 *   - Randomness is seeded (mulberry32, hash).
 *   - Continuous motion reads the exact t; discrete state (typing, drawings
 *     held on twos, sprite frames, line boil) reads the quantised q, so every
 *     subframe of one output frame agrees on it.
 *   - Motion blur averages 1 to 64 subframes on a trailing 270-degree
 *     shutter, one per 5 px of movement, never across a hard cut.
 *   - Sound (FILM.audio) is synthesised from cues in an OfflineAudioContext,
 *     outside seek(), from seeded noise; a bed (FILM.audio.bed) adds music in
 *     a key, a reverb runs in plain JS; FILM.transparent clears to alpha.
 * The engine below describes its vertical through hooks (build, draw, disp,
 * checks, stills, layout, visible, lastChange) and calls boot(ENGINE) last.
 * The core keeps its internals to itself and exports the helpers listed at
 * its end, so an engine can name its own functions freely.
 * ========================================================================== */
const CORE = (() => {
/* ---------------- formats: one film, several aspect ratios ---------------- */
// ?format=9x16 (the scripts pass --format 9:16) re-sizes the film before anything reads FILM. A key of
// FILM.formats patches any field for that format (objects merge, arrays of items with an id merge by id,
// anything else is replaced). Without W and H in the patch, the standard ratios keep the film's short side:
// 1:1, 4:5, 9:16, 16:9. Positions stay authored in the base format; an engine maps them with fmtX/fmtY/fmtPos,
// which keep an element's offset from the centre (the default) or from the edge its pin names.
const BW = FILM.W, BH = FILM.H;
const FORMAT = (() => { const m = /[?&]format=(\d+)[x:](\d+)/.exec(location.search); return m ? `${m[1]}:${m[2]}` : null; })();
function mergeInto(a, b) {
  for (const [k, v] of Object.entries(b)) {
    const o = a[k];
    if (Array.isArray(v) && Array.isArray(o) && v.every((x) => x && x.id != null)) {
      for (const it of v) { const t = o.find((x) => x && x.id === it.id); if (t) mergeInto(t, it); else o.push(it); }
    } else if (v && typeof v === 'object' && !Array.isArray(v) && o && typeof o === 'object' && !Array.isArray(o)) mergeInto(o, v);
    else a[k] = v;
  }
  return a;
}
if (FORMAT) {
  const patch = (FILM.formats || {})[FORMAT] || {};
  const [ra, rb] = FORMAT.split(':').map(Number), short = Math.min(BW, BH);
  if (!(ra > 0 && rb > 0)) throw new Error(`bad format ${FORMAT}`);
  const size = ra === rb ? [short, short] : ra < rb ? [short, Math.round(short * rb / ra / 2) * 2] : [Math.round(short * ra / rb / 2) * 2, short];
  mergeInto(FILM, { W: size[0], H: size[1], ...patch });
}
const { W, H, FPS, DUR } = FILM;
const NFR = Math.round(DUR * FPS);                 // output frames in the loop
const CX = W / 2, CY = H / 2;
const U = Math.min(W, H) / 1080;                   // scale for built-in pixel constants
const PAL = FILM.palette;
const USED = new Set();                            // palette roles the film draws with
const col = (k) => PAL[k] || k;                    // look a role up (while drawing)
const role = (k) => { USED.add(k); return PAL[k] || k; };   // resolve and register a role (at build time)
const GRID = FILM.grid || {};
const MARGIN = GRID.margin != null ? GRID.margin : Math.round(104 * U);
const UNIT = GRID.unit || 8;
const MEASURE = W - 2 * MARGIN;
const FS = Math.min(W, H) / Math.min(BW, BH);      // base px -> this format's px
const FMT = { key: FORMAT || `${BW}x${BH}`, W, H, BW, BH, s: FS, aspect: W === H ? 'square' : W < H ? 'vertical' : 'horizontal' };
// pin: 'l' or 'r' keeps the distance from that edge, 't' or 'b' likewise; otherwise the offset from the centre
const fmtX = (x, pin = '') => /l/.test(pin) ? x * FS : /r/.test(pin) ? W - (BW - x) * FS : W / 2 + (x - BW / 2) * FS;
const fmtY = (y, pin = '') => /t/.test(pin) ? y * FS : /b/.test(pin) ? H - (BH - y) * FS : H / 2 + (y - BH / 2) * FS;
const fmtPos = (x, y, pin = '') => [fmtX(x, pin), fmtY(y, pin)];
const fmtSz = (v) => v * FS;
const LOOP = FILM.loop || 'hold';                  // 'hold': ends on a still copy of frame 0; 'cycle': periodic, continuous over the seam; 'none'
const BLUR = FILM.blur !== false;                  // false: one sample per frame (cartoon, pixel art)
const TRANSPARENT = !!FILM.transparent;            // clear to transparent instead of filling bg (bg stays the assumed backdrop)
const SHUTTER = 0.75;                              // 270 degrees, trailing
const MIN_SAMPLES = 4, MAX_SAMPLES = 64, PX_PER_SAMPLE = 5;   // Uint16 sums hold up to 257 x 255
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', FILM.alt || FILM.title || '');
if (FILM.title) document.title = FILM.title;
document.documentElement.style.background = PAL.bg;
document.body.style.background = PAL.bg;
// CPU raster everywhere: Chrome moves a canvas from GPU to CPU after repeated getImageData
// reads, which changes antialiasing mid-render. Pin every 2D context from its first call.
// An alpha channel, though every frame fills it opaque: on an opaque canvas Chromium draws text with
// LCD subpixel antialiasing (red and blue fringes on every glyph), whatever the command line says.

// Title or chapter card: a kicker ("CHAPTER 2"), a rule and one or two title lines, centred on (x, y) by

    if (LOOP === 'none') {
      const h0 = alphaScan(0, 0).any, h1 = alphaScan(0, NFR - 1).any;
      add('clean head and tail', h0 || h1 ? 'FAIL' : 'PASS', h0 || h1 ? `frame 0 has ${h0} px, the last frame ${h1} px with alpha: the clip should start and end empty` : 'frame 0 and the last frame are fully transparent');
    }
    const cover = r.mid, exempt = ['title', 'endscreen'].includes(KIND), long = LOOP !== 'none' || HOLD > LIM.moment;
    add('middle of the frame', cover <= LIM.middle || exempt || !long ? 'PASS' : 'FAIL', `${(cover * 100).toFixed(1)} % of the middle ninth covered at rest${exempt ? ` (a ${KIND} card may hold the middle)` : cover > LIM.middle ? ` for ${HOLD.toFixed(1)} s: over ${LIM.middle * 100} %, it hides the footage's subject; move it off centre` : ` (at most ${LIM.middle * 100} %)`}`);
  }
  if (KIND === 'bug') {
    const b = union(BUG.parts.map(partBox)), area = (b[2] - b[0]) * (b[3] - b[1]) / (W * H), ht = (b[3] - b[1]) / Math.min(W, H);
    const op = Math.max(...BUG.parts.map((p) => p.P.op.at(tr) * (p.alpha != null ? p.alpha : 1)));
    add('bug opacity', op <= LIM.bugOpacity + 1e-6 ? 'PASS' : 'FAIL', `${Math.round(op * 100)} % at rest (at most ${Math.round(LIM.bugOpacity * 100)} %)`);
    add('bug size', area <= LIM.bugArea && ht <= LIM.bugHeight + 1e-6 ? 'PASS' : 'FAIL', `${(area * 100).toFixed(2)} % of the frame, ${(ht * 100).toFixed(1)} % of its short side tall (at most ${LIM.bugArea * 100} % and ${LIM.bugHeight * 100} %)`);
  }
  if (KIND === 'endscreen') {
    for (const z of ENDZONES) {
      const hit = live.filter((p) => (p.frame ? !(p.frame === z) && overlaps(p.box, z.box) : overlaps(partBox(p), z.box)));
      const out = !inside(z.box, [0, 0, W, H]);
      add(`end screen zone: ${z.id}`, hit.length || out ? 'FAIL' : 'PASS', out ? `[${fmtBox(z.box)}] leaves the frame` : hit.length ? `${hit.map((p) => p.id).join(', ')} inside [${fmtBox(z.box)}]: the platform's element will cover it` : `[${fmtBox(z.box)}] clear`);
    }
    if (PARTS.some((p) => p.type === 'guide')) add('guides', 'WARN', 'the zones are drawn as dashed guides: set guides: false before the render');
  }
}
function stills(push) {
  if (LOOP === 'none') {
    push(Math.round(0.12 * FPS), 'in', 'coming in');
    push(Math.round(TIM.in * FPS), 'landed', 'landed (the end of timing.in)');
    push(Math.round((TIM.in + EXIT_AT) / 2 * FPS), 'hold', 'at rest, mid-hold');
    push(Math.round((EXIT_AT + EXIT_LEN * 0.3) * FPS), 'out', 'going out');
  } else {
    push(Math.round(DUR / 2 * FPS), 'hold', 'at rest');
    const g = PARTS.find((p) => p.type === 'glint');
    if (g) { const e = g.ev.find((x) => x.k === 'tr'); if (e) push(Math.round((e.t + 0.18) * FPS), 'glint', 'the glint crossing'); }
    if (PULSE.win) push(Math.round((PULSE.win[0] + PULSE.per * 0.35) * FPS), 'pulse', 'a pulse');
  }
}
function layout() {
  const r = (v) => Math.round(v * 10) / 10, ms = (v) => Math.round(v * 1000) / 1000;
  return { kind: KIND, timing: { in: TIM.in, hold: ms(HOLD), exitAt: ms(EXIT_AT), exitLen: ms(EXIT_LEN), out: TIM.out, dur: DUR },
    safe: { title: TITLE_SAFE.map(r), action: ACTION_SAFE.map(r) }, zones: UI_ZONES.concat(ENDZONES).map((z) => ({ id: z.id, box: z.box.map(r) })),
    parts: PARTS.map((p) => ({ id: p.id, type: p.type, box: partBox(p).map(r), ...(p.text ? { text: p.L.text, size: r(p.L.size), capH: r(p.L.capH), baseline: r(p.L.baseline) } : {}) })) };
}

function build() {
  const make = KINDS[KIND];
  if (!make) throw new Error(`unknown overlay kind "${KIND}" (${Object.keys(KINDS).join(', ')})`);
  make(OV);
  if (FILM.tag) tag(FILM.tag);
  schedule();
  if (PROG.part) activeIn(TIM.in, EXIT_AT);
  // the accent: the main part landing, or the click; cues for the editor's timeline
  const tIn = MAIN && MAIN.tIn != null ? MAIN.tIn : TIM.in;
  if (LOOP === 'none') {
    accentAt(ACCENT_T != null ? ACCENT_T : tIn, MAIN ? MAIN.id : KIND);
    if (CUEK.in) cue(Math.max(0.35, Math.min(TIM.in, tIn) * 0.8), CUEK.in, { gain: -3 });
    if (CUEK.land) cue(tIn, CUEK.land, { gain: -6 });
    if (CUEK.out) cue(EXIT_AT + 0.05, CUEK.out, { gain: -4 });
  }
  // a declared lean: an overlay sits where the edit needs it (the core's composition check reads this)
  if (!FILM.composition) {
    // the lean the core will measure, from the parts' boxes: the empty margins and the area-weighted centre
    const bs = PARTS.filter((p) => p.type !== 'guide' && p.type !== 'glint').map(partBox), b = union(bs);
    const A = bs.reduce((s, q) => s + (q[2] - q[0]) * (q[3] - q[1]), 0);
    const cx = bs.reduce((s, q) => s + (q[2] - q[0]) * (q[3] - q[1]) * (q[0] + q[2]) / 2, 0) / A, cy = bs.reduce((s, q) => s + (q[2] - q[0]) * (q[3] - q[1]) * (q[1] + q[3]) / 2, 0) / A;
    const pick = (a, c) => (Math.abs(a) >= Math.abs(c) ? a : c);
    const v = pick((H - b[3]) / H - b[1] / H, 2 * (0.5 - cy / H)), h = pick((W - b[2]) / W - b[0] / W, 2 * (0.5 - cx / W));
    FILM.composition = { lean: Math.abs(v) >= Math.abs(h) ? (v > 0 ? 'top' : 'bottom') : (h > 0 ? 'left' : 'right'), why: `a ${KIND} sits where the edit needs it, off the footage's subject` };
  }
}

boot({
  name: 'overlays',
  springs: { SLIDE: [0.78, 24], WIPE: [1, 24], GROW: [0.8, 26], POP: [0.5, 24], SNAP: [0.8, 40], SWING: [0.4, 30], TRACE: [1, 14], GLIDE: [1, 9], SETTLE: [1, 8] },
  build, draw: (c, t) => drawFrame(c, t), disp, checks, stills, layout, visible,
  backdrop: [],
});
})();
</script>
</body>
</html>
