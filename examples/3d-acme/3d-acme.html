<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * A 3D film is a world (background, floor, light), a camera, and objects:
 * extruded type and SVG logos, and primitives (box, sphere, torus, cylinder,
 * cone, capsule). World units are arbitrary; y is up, the floor is y = 0.
 * Every object is at rest at pos / rot / scale and moves on springs:
 *   enter: { at, from: {state}, spring, stagger }  from `from` to rest
 *   keys:  [{ at, to: {state}, spring, stagger }]
 *   exit:  { at, to: {state}, spring }
 * A state holds dx dy dz (units from rest), rx ry rz (degrees added), scale.
 * loop behaviours (spin, bob, orbit, wobble) run whole cycles per loop.
 * A 'cycle' loop keeps moving through the seam; every value ends where it
 * starts (a full turn counts: 360 degrees is where it started).
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Acme 3D loop',
  alt: 'The word ACME in chunky extruded letters, cream faces with coral sides, stands on a violet floor inside a yellow ring that wobbles round it, while teal spheres bob past. The letters flip over one by one, then hop in a wave. Example.com. Demo copy, fictional product.',
  W: 1080, H: 1080, FPS: 60, DUR: bar(5), BPM,
  loop: 'cycle',
  palette: { bg: '#221A3D', cream: '#FFF1DE', coral: '#FF6F61', sun: '#FFC53D', teal: '#35D0BA', lilac: '#9D8CFF', ink: '#221A3D' },
  fonts: {

  grid: { margin: 104, unit: 8 },

  gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(G.depth.p); gl.uniformMatrix4fv(G.depth.u.uLVP, false, lvp);
  for (const d of draws) if (d.Ob.spec.shadow !== false) { gl.uniformMatrix4fv(G.depth.u.uM, false, d.M); for (const m of d.cp.gl) { gl.bindVertexArray(m.vao); gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_INT, 0); } }
  // main pass into the multisampled buffer
  gl.bindFramebuffer(gl.FRAMEBUFFER, G.fb); gl.viewport(0, 0, W, H);
  const bg = rgbOf(PAL.bg).map((v) => v / 255);
  gl.clearColor(bg[0], bg[1], bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const u = G.main.u; gl.useProgram(G.main.p);
  gl.uniformMatrix4fv(u.uVP, false, cam.vp); gl.uniformMatrix4fv(u.uLVP, false, lvp);
  gl.uniform3fv(u.uLd, L); gl.uniform3fv(u.uCam, cam.eye); gl.uniform3fv(u.uBg, linOf(PAL.bg));
  gl.uniform1f(u.uAmb, Lt.ambient != null ? Lt.ambient : 0.3); gl.uniform1f(u.uKey, Lt.key != null ? Lt.key : 0.75); gl.uniform1f(u.uRim, WORLD.rim != null ? WORLD.rim : 0.15);
  gl.uniform1f(u.uTexel, 1 / G.shN); gl.uniform1f(u.uSoft, Lt.soft != null ? Lt.soft : 1.5);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, G.shTex); gl.uniform1i(u.uSh, 0);
  if (WORLD.floor !== false) {
    const F = WORLD.floor || {};
    gl.uniform1f(u.uFloor, 1); gl.uniform1f(u.uShadowK, F.shadow != null ? F.shadow : 0.4);
    const M = m4.trs([0, F.y || 0, 0], [0, 0, 0], [1, 1, 1]);
    gl.uniformMatrix4fv(u.uM, false, M); gl.uniformMatrix3fv(u.uNM, false, m4.normal(M));
    gl.bindVertexArray(G.floor.vao); gl.drawElements(gl.TRIANGLES, G.floor.n, gl.UNSIGNED_INT, 0);
  }
  gl.uniform1f(u.uFloor, 0);
  for (const d of draws) {
    const o = d.Ob.spec;
    gl.uniformMatrix4fv(u.uM, false, d.M); gl.uniformMatrix3fv(u.uNM, false, m4.normal(d.M));
    gl.uniform1f(u.uGloss, o.gloss != null ? o.gloss : 0.35); gl.uniform1f(u.uToon, o.toon ? 1 : 0);
    d.cp.gl.forEach((m, i) => { gl.uniform3fv(u.uC, i === 1 ? d.Ob.side : d.Ob.color); gl.bindVertexArray(m.vao); gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_INT, 0); });
  }
  gl.bindVertexArray(null);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, G.fb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function drawFrame(c, t, q) {
  renderGL(t);
  c.drawImage(glc, 0, 0);
  for (const Lb of LABELS) {                        // flat labels over the picture: sharp type for small print
    const a = Lb.op ? Lb.op.at(t) : 1;
    if (!(a > 0.002)) continue;
    setFont(c, Lb.line.font);
    for (const g of Lb.line.glyphs) if (!g.space) fillGlyph(c, g.ch, g.x, Lb.line.baseline, Lb.color, a, 0);
  }
  c.globalAlpha = 1;
}

/* ---------------- motion and analysis ---------------- */
function disp(ta, tb) {                            // how far any corner of any object moves on screen
  const va = cameraAt(ta).vp, vb = cameraAt(tb).vp;
  let d = 0;
  for (const Ob of OBJECTS) for (const cp of Ob.copies) {
    const Ma = modelOf(Ob, cp, ta), Mb = modelOf(Ob, cp, tb);
    for (const m of cp.gl) for (const p of boxCorners(m.box)) {
      const a = toScreen(va, m4.apply(Ma, p)), b = toScreen(vb, m4.apply(Mb, p));
      if (a[2] > 1 || b[2] > 1) continue;
      d = Math.max(d, Math.hypot(b[0] - a[0], b[1] - a[1]));
    }
  }
  for (const Lb of LABELS) if (Lb.op && Lb.op.active(ta, tb)) d = Math.max(d, 4);
  return d;
}
function screenBox(Ob, t) {
  const vp = cameraAt(t).vp;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const cp of Ob.copies) { const M = modelOf(Ob, cp, t); for (const m of cp.gl) for (const p of boxCorners(m.box)) { const s = toScreen(vp, m4.apply(M, p)); x0 = Math.min(x0, s[0]); x1 = Math.max(x1, s[0]); y0 = Math.min(y0, s[1]); y1 = Math.max(y1, s[1]); } }
  return [x0, y0, x1, y1];
}
function visible(t) {
  for (const Ob of OBJECTS) { const b = screenBox(Ob, t); if (b[2] > 0 && b[0] < W && b[3] > 0 && b[1] < H && Ob.copies.some((cp) => Math.abs(cp.P.sc.at(t)) > 0.05)) return true; }
  return LABELS.some((Lb) => !Lb.op || Lb.op.at(t) > 0.5);
}
function checks(add) {
  const samples = [0, DUR * 0.25, DUR * 0.5, DUR * 0.75];
  for (const Ob of OBJECTS) {
    if (Ob.spec.kind === 'text') {
      for (const t of samples) { const b = screenBox(Ob, t); if (b[0] < MARGIN - 1 || b[2] > W - MARGIN + 1 || b[1] < MARGIN - 1 || b[3] > H - MARGIN + 1) { add(`live area: ${Ob.id}`, 'FAIL', `leaves the margins at ${t.toFixed(2)} s: ${b.map((v) => v.toFixed(0)).join(', ')}`); break; } }
      const vp = cameraAt(0).vp, a = toScreen(vp, [0, 0, 0]), b = toScreen(vp, [0, Ob.capU, 0]), cap = Math.abs(a[1] - b[1]);
      add(`type size: ${Ob.id}`, cap < 60 ? 'WARN' : 'PASS', `cap height about ${cap.toFixed(0)} px on screen at 0 s${cap < 60 ? ' (small for a title at feed size)' : ''}`);
      const words = Ob.spec.text.split(/\s+/).filter(Boolean).length;
      add(`words: ${Ob.id}`, words > 4 ? 'FAIL' : 'PASS', `${words} words`);
      const tris = Ob.copies.reduce((s, cp) => s + cp.gl.reduce((q, m) => q + m.n / 3, 0), 0);
      add(`mesh: ${Ob.id}`, tris > 0 ? 'PASS' : 'FAIL', `${Ob.copies.length} glyph solids, ${tris} triangles`);
    }
    if (Ob.spec.kind === 'path') { const tris = Ob.copies.reduce((s, cp) => s + cp.gl.reduce((q, m) => q + m.n / 3, 0), 0); add(`mesh: ${Ob.id}`, tris > 0 ? 'PASS' : 'FAIL', `${tris} triangles`); }
  }
  for (const Lb of LABELS) {
    checkLiveArea(add, Lb.id, [Lb.line.inkL, Lb.line.top, Lb.line.inkR, Lb.line.bottom], Lb.bleed);
    if (Lb.line.baseline % UNIT) add(`grid: ${Lb.id}`, 'WARN', `baseline ${Lb.line.baseline} is not on the ${UNIT} px grid`);
  }
  checkSpacing(add, LABELS.map((Lb) => ({ id: Lb.id, b: [Lb.line.inkL, Lb.line.top, Lb.line.inkR, Lb.line.bottom] })));
  add('renderer', 'PASS', `WebGL2, ${G.samples}x MSAA, ${G.shN} px shadow map`);
}
function cycles() {
  const out = [], C = FILM.camera || {};
  if (C.sway) out.push({ what: 'camera sway', period: DUR / C.sway[0] });
  if (C.orbit) out.push({ what: 'camera orbit', period: DUR / C.orbit });
  for (const Ob of OBJECTS) { const B = Ob.spec.loop || {}; for (const k of ['spin', 'bob', 'orbit', 'wobble']) if (B[k]) { const n = k === 'spin' ? B[k][1] : B[k][0]; if (n) out.push({ what: `${Ob.id} ${k}`, period: DUR / Math.abs(n) }); } }
  return out;
}
function stills(push) {
  const keys = new Set();
  for (const Ob of OBJECTS) {
    const o = Ob.spec;
    if (o.enter) keys.add(o.enter.at + 0.8);
    for (const k of o.keys || []) keys.add(k.at + (k.stagger ? noteSec(k.stagger) * Math.max(0, Ob.copies.length - 1) / 2 : 0) + 0.15);
  }
  for (const k of (FILM.camera || {}).keys || []) keys.add(k.at + 0.6);
  [...keys].sort((a, b) => a - b).forEach((t, i) => push(wrapT(t) * FPS, `key-${i + 1}`, `at ${wrapT(t).toFixed(2)} s`));
  push(NFR / 2, 'midpoint', 'halfway through the loop');
}
function layout() {
  return { objects: OBJECTS.map((Ob) => ({ id: Ob.id, kind: Ob.spec.kind, copies: Ob.copies.length, triangles: Ob.copies.reduce((s, cp) => s + cp.gl.reduce((q, m) => q + m.n / 3, 0), 0), screenBoxAt0: screenBox(Ob, 0).map((v) => Math.round(v)) })),
    labels: LABELS.map((Lb) => ({ id: Lb.id, size: Lb.line.size, box: [Lb.line.inkL, Lb.line.top, Lb.line.inkR, Lb.line.bottom].map((v) => Math.round(v)) })) };
}

function build() {
  initGL();
  const C = FILM.camera || {};
  camP = { yaw: new Prop(C.yaw || 0, 'camera.yaw'), pitch: new Prop(C.pitch != null ? C.pitch : 12, 'camera.pitch'), dist: new Prop(C.dist || 14, 'camera.dist'), fov: new Prop(C.fov || 30, 'camera.fov'),
    tx: new Prop((C.target || [0, 1, 0])[0], 'camera.tx'), ty: new Prop((C.target || [0, 1, 0])[1], 'camera.ty'), tz: new Prop((C.target || [0, 1, 0])[2], 'camera.tz') };
  for (const k of (C.keys || []).slice().sort((a, b) => a.at - b.at)) {
    for (const f of ['yaw', 'pitch', 'dist', 'fov']) if (k[f] != null) camP[f].to(k.at, k[f], k.spring || 'DOLLY');
    if (k.target) ['tx', 'ty', 'tz'].forEach((f, i) => camP[f].to(k.at, k.target[i], k.spring || 'DOLLY'));
  }
  (FILM.objects || []).forEach((o, i) => OBJECTS.push(buildObject(o, i)));
  fitFormat();
  initFloor();
  for (const L0 of FILM.labels || []) {
    // authored in the base format; pin 't', 'b', 'l', 'r' keeps the distance from that edge, and a baseline
    // moved by the format moves by whole grid units, so it stays on the grid
    const pin = L0.pin || '', same = W === FMT.BW && H === FMT.BH;
    const bx = same || L0.x == null ? L0.x : fmtX(L0.x, pin), by = same || L0.y == null ? L0.y : L0.y + Math.round((fmtY(L0.y, pin) - L0.y) / UNIT) * UNIT;
    const line = layoutText({ id: L0.id, text: L0.text, font: L0.font || 'mono', size: L0.size, cap: L0.cap, fit: L0.fit, track: L0.track, anchor: L0.anchor || 'C', x: bx, baseline: by });
    const Lb = { ...L0, line, color: role(L0.color || 'fg') };
    if (L0.enter) { Lb.op = new Prop(0, `${L0.id}.op`); Lb.op.to(L0.enter.at, 1, 'FADE'); if (L0.exit) Lb.op.to(L0.exit.at, 0, 'FADE'); }
    LABELS.push(Lb);
    needContrast(L0.id, L0.color || 'fg', L0.on || 'bg', (L0.size || 99) < 40 ? 4.5 : 3);
  }
}

// the shadow catcher is background: the floor in full shadow, for the composition check (soft edges lie between)
const FLOOR_SHADOW = (() => {
  const F = WORLD.floor; if (F === false) return [];
  const k = 1 - (F && F.shadow != null ? F.shadow : 0.4), enc = (v) => 255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
  return [hexOf(...linOf(PAL.bg).map((v) => enc(v * k)))];
})();

boot({
  name: '3d',
  backdrop: FLOOR_SHADOW,
  springs: { FLIP: [0.55, 12], HOP: [0.8, 22], DOLLY: [1, 3.2], SETTLE: [0.62, 9] },
  always: true,
  minSamples: 2,                                    // every subframe is a full render: slow drifts take 2, still one per 5 px
  build, draw: (c, t, q) => drawFrame(c, t, q), disp, checks, cycles, stills, layout, visible,
});
})();
</script>
