<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * Times are seconds; beat(n) and bar(n) put them on the tempo grid.
 * The device sits on the canvas at (x, y), its centre, in canvas pixels.
 * Screen content is in the screen's own units (the screenshot's points):
 * a box's x, y is its top-left inside its parent, a text's x is its anchor
 * and y its baseline. The device's scale maps screen units to pixels.
 * Colours are palette role names.
 * The script is the demo, in time order: the pointer moves and taps, the
 * screens scroll, push and expand, buttons change state, toasts and sheets
 * open, the camera focuses. Callouts sit beside the device, in canvas
 * pixels, with a leader line to the element they name.
 * A 'hold' loop ends on a still copy of frame 0: the lockup is on screen at
 * rest at t = 0, leaves at wrap.exit, and is rebuilt at the end.
 * Helpers you add here must not reuse a core or engine name.
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

// One picture per trip, drawn in the 360 x 288 units of the top of a trip screen. The list card
// shows the same picture at 8/9 (320 x 256), so the Lisbon card can expand into its screen with no jump.
const tripArt = (name, sky, sunX, hills) => [
  { type: 'rect', x: 0, y: 0, w: 360, h: 288, fill: sky },
  { type: 'rect', x: sunX, y: 44, w: 72, h: 72, radius: 'pill', fill: 'sun' },
  ...hills,
  { type: 'rect', x: 0, y: 208, w: 360, h: 80, fill: 'deep' },
  { type: 'text', text: name, font: 'display', size: 36, x: 24, y: 262, color: 'paper' },
];
const roofs = (xs, base) => xs.flatMap(([x, w, h]) => [
  { type: 'rect', x, y: base - h, w, h, fill: 'paper' },
  { type: 'path', d: `M${x - 4} ${base - h}L${x + w / 2} ${base - h - w * 0.55}L${x + w + 4} ${base - h}Z`, fill: 'roof' },
]);
const LISBON_ART = tripArt('Lisbon', 'sky', 246, [
  { type: 'path', d: 'M0 176C70 132 150 124 220 150C270 168 316 150 360 134V208H0Z', fill: 'haze' },
  ...roofs([[30, 34, 30], [76, 28, 44], [116, 38, 26], [170, 30, 40], [214, 36, 30], [262, 28, 22], [302, 34, 34]], 208),
]);
const KYOTO_ART = tripArt('Kyoto', 'sand', 54, [
  { type: 'path', d: 'M-10 208L96 106L180 176L244 124L370 208Z', fill: 'roof' },
  { type: 'path', d: 'M120 208L210 150L300 208Z', fill: 'deep' },
]);
const OSLO_ART = tripArt('Oslo', 'sky', 226, [
  { type: 'path', d: 'M0 150L64 112L128 160L196 118L262 156L360 104V208H0Z', fill: 'deep' },
  { type: 'rect', x: 0, y: 176, w: 360, h: 32, fill: 'haze' },
  { type: 'path', d: 'M150 172L150 128L178 168Z', fill: 'paper' },
]);
const tripCard = (id, y, art) => ({ id, type: 'card', x: 20, y, w: 320, h: 256, radius: 24,
  children: [{ type: 'group', w: 360, h: 288, scale: 8 / 9, origin: [0, 0], children: art }] });

const FILM = {
  title: 'Acme Trips app preview',
  alt: 'A phone rises in, showing the Acme Trips list of trips. A finger scrolls it: Plan it. It taps the Lisbon card, which grows into the Lisbon trip: See it. It taps Save; the button turns to Saved and a toast drops in: Save it. Acme Trips, example.com. Demo copy, fictional product.',
  W: 1080, H: 1080, FPS: 60, DUR: bar(6), BPM,
  loop: 'hold',
  palette: {
    bg: '#EEF1F6', ink: '#0E1116', paper: '#FFFFFF', line: '#DCE1E8', muted: '#5A6272',
    brand: '#2356F0', tint: '#E2EAFE', sky: '#BCD7FF', haze: '#8DB3EE', deep: '#15326B',
    sun: '#FFC247', roof: '#E1623A', sand: '#F6E4C4', shade: '#C3CCD8', edge: '#39404C',
  },
  fonts: {
    ui: { family: 'Inter', weight: 600 },
    display: { family: 'Inter Tight', weight: 800 },
    mono: { family: 'IBM Plex Mono', weight: 500 },
  },
  grid: { margin: 104, unit: 8 },
  poster: 4.25,

  // The phone. Its screen is 360 x 760 units at scale 1, so a unit is a pixel at rest.
  device: {
    kind: 'phone', x: 392, y: 540, screen: [360, 760], scale: 1, radius: 46, bezel: 12,
    body: 'ink', edge: 'edge', shadow: { color: 'shade', blur: 40, dy: 30, op: 1 },
    enter: { at: beat(0.25), from: { dy: 1160 }, spring: 'LIFT' },
    exit: { at: beat(17.5), to: { dy: 1160 }, spring: 'DROP' },
  },

  screens: [
    { id: 'trips', bg: 'paper', status: 'ink',
      layers: [
        { id: 'TRIPS', type: 'text', text: 'Trips', font: 'display', size: 40, x: 24, y: 112, color: 'ink' },
        { id: 'ME', type: 'avatar', initials: 'AK', size: 56, x: 280, y: 68, fill: 'tint', color: 'brand' },
        tripCard('KYOTO', 140, KYOTO_ART),
        tripCard('LISBON', 416, LISBON_ART),
        tripCard('OSLO', 692, OSLO_ART),
        { type: 'rect', fixed: true, x: 0, y: 0, w: 360, h: 50, fill: 'paper' },
      ] },
    { id: 'lisbon', bg: 'paper', status: 'ink',
      layers: [
        { id: 'HERO', type: 'image', x: 0, y: 0, w: 360, h: 288, children: LISBON_ART },
        { id: 'BACK', type: 'button', x: 16, y: 54, w: 48, h: 48, fill: 'paper', icon: 'back', iconSize: 26, color: 'ink' },
        { type: 'icon', name: 'calendar', size: 26, x: 24, y: 314, color: 'brand' },
        { type: 'bars', x: 60, y: 322, w: 96, h: 10, color: 'line' },

    if (a.T.N.hud || b.T.N.hud || a.T.N.screen !== b.T.N.screen || a.T.N.swap === b.T.N || b.T.N.swap === a.T.N) continue;
    if (overlaps(a.box, b.box)) add(`collision: ${a.T.N.id} / ${b.T.N.id}`, 'FAIL', 'two texts overlap at rest');
  }
  // words: 4 a beat for callouts and the lockup; UI text is the product's, but a screen full of it will not read
  for (const C of CALLOUTS) {
    add(`words: ${C.id}`, C.words > 4 ? 'FAIL' : 'PASS', `${C.words} words (at most 4 a callout)`);
    const both = CALLOUTS.filter((D) => D !== C && D.tin < C.tout && C.tin < D.tout);
    for (const D of both) if (C.words + D.words > 4 && C.id < D.id) add(`words: ${C.id} + ${D.id}`, 'FAIL', `${C.words + D.words} words on screen together (at most 4 a beat)`);
    if (C.spec.y % UNIT) add(`grid: ${C.id}`, 'WARN', `baseline ${C.spec.y} is not on the ${UNIT} px grid`);
    checkLiveArea(add, C.id, C.box);
  }
  if (LOCK) {
    const words = LOCK.nodes.filter((N) => N.kind === 'text' && !N.hudTyped && N.font !== 'mono').reduce((s, N) => s + N.spec.text.split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w)).length, 0);
    add('words: lockup', words > 4 ? 'FAIL' : 'PASS', `${words} words of display type (at most 4)`);
  }
  for (const N of HUD) { hudLive(add, N); }
  for (const Sc of SCREENS) {
    const words = placed.filter((p) => p.T.N.screen === Sc && !p.T.alt && !p.T.N.alt && !p.T.chrome).reduce((s, p) => s + p.T.line.text.split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w)).length, 0);
    if (words > 16) add(`words: ${Sc.id}`, 'WARN', `${words} words of UI text; a viewer reads about 4 a beat: turn what does not matter into bars`);
    for (const N of [...Sc.flow, ...Sc.fixed]) {
      if (N.spec.bleed) continue;
      const b = mbox(restLocal(N), N.box);
      if (b[0] < -0.5 || b[2] > DEV.sw + 0.5) add(`screen: ${N.id}`, 'WARN', `${b[0].toFixed(0)} to ${b[2].toFixed(0)} leaves the ${DEV.sw}-unit screen (bleed: true if meant)`);
    }
  }
  // the device: inside the live area at rest, clear of the callouts, also while the camera moves
  if (DEV) {
    const db = mbox(devM(0, true), DEV.outer);
    if (LOOP === 'hold') {
      const t1 = DUR - 1e-6, a = stageM(0), b = stageM(t1), oa = V(DEV, 'op', 0), ob = V(DEV, 'op', t1);
      const pad = DEV.shadow ? DEV.shadow.blur * 2.5 + Math.abs(DEV.shadow.dy) : 2, onCanvas = (m, o) => { const bb = mbox(m, DEV.outer); return o > 0.002 && bb[2] > -pad && bb[0] < W + pad && bb[3] > -pad && bb[1] < H + pad; };
      const same = mdisp(a, b, DEV.outer) < 0.01 && Math.abs(oa - ob) < 1e-6;
      add('device seam', !same && (onCanvas(a, oa) || onCanvas(b, ob)) ? 'FAIL' : 'PASS', same ? 'the device ends where frame 0 has it' : onCanvas(a, oa) || onCanvas(b, ob)
        ? 'the device, or its shadow, shows at frame 0 or at the end, in two different places: enter from where it exits to, far enough off the canvas' : 'off the canvas, shadow included, at frame 0 and at the end');
    }
    checkLiveArea(add, 'device', db, DEV.spec.bleed);
    for (const C of CALLOUTS) {
      const g = gapOf(db, C.box);
      add(`clearance: ${C.id}`, overlaps(db, C.box) ? 'FAIL' : g < 24 * U ? 'WARN' : 'PASS', overlaps(db, C.box) ? 'the callout sits on the device' : `${g.toFixed(0)} px from the device`);
      for (let t = C.tin; t < Math.min(DUR, C.tout + 0.4); t += 2 / FPS) {
        if (C.copies.every((G) => V(G, 'op', t) < 0.05)) continue;
        const b = mbox(stageM(t), DEV.outer);
        if (overlaps(b, C.box) && V(DEV, 'op', t) > 0.05) { add(`clearance: ${C.id} (moving)`, 'FAIL', `at ${t.toFixed(2)} s the device (camera z ${V(CAM, 'z', t).toFixed(2)}) runs under the callout`); break; }
      }
      // the leader must end on something on screen
      const to = C.spec.to;
      if (!Array.isArray(to) && !NODES[to]) { add(`leader: ${C.id}`, 'FAIL', `no element "${to}"`); continue; }
      let bad = null;
      for (let t = C.tin + 0.3; t < Math.min(DUR, C.tout); t += 0.1) {
        const E = calloutEnd(C, t);
        if (!E) { bad = `${to} is not on screen at ${t.toFixed(2)} s`; break; }
        const sb = mbox(stageM(t), [0, 0, DEV.sw, DEV.sh]);
        if (!inside(sb, E[0], E[1])) { bad = `the leader ends off the screen at ${t.toFixed(2)} s`; break; }
        if (inside(C.box, E[0], E[1], 8)) { bad = 'the leader ends on its own words'; break; }
      }
      add(`leader: ${C.id}`, bad ? 'FAIL' : 'PASS', bad || `ends on ${Array.isArray(to) ? 'a point' : to} while it shows`);
    }
  }
  // taps land on what they press
  for (const T of TAPS) {
    const N = T.N, id = N.id;
    if (!N.hud && T.top !== N.screen) { add(`tap: ${id}`, 'FAIL', `${id} is on ${N.screen.id}, but ${T.top.id} is on top at ${T.t.toFixed(2)} s`); continue; }
    const p = ptrPos(T.t), b = mbox(screenOf(N, T.t), N.box), vb = [0, 0, DEV.sw, DEV.sh];
    if (!inside(b, p[0], p[1], 2)) add(`tap: ${id}`, 'FAIL', `the ${PTR.kind} is at (${p[0].toFixed(0)}, ${p[1].toFixed(0)}), outside ${id} (${b.map((v) => v.toFixed(0)).join(', ')}) at ${T.t.toFixed(2)} s`);
    else if (!inside(vb, p[0], p[1])) add(`tap: ${id}`, 'FAIL', 'the tap is off the screen');
    else add(`tap: ${id}`, T.landed > T.t + 1e-6 ? 'WARN' : 'PASS', T.landed > T.t + 1e-6 ? `the ${PTR.kind} lands ${(T.landed - T.t).toFixed(2)} s after the press: move sooner` : `presses at (${p[0].toFixed(0)}, ${p[1].toFixed(0)})`);
  }
  // fills that crossfade must not blend two hues into a third
  for (const [id, a, b] of CROSS) add(`crossfade: ${id}`, inksClash(col(a), col(b)) ? 'FAIL' : 'PASS', inksClash(col(a), col(b)) ? `${a} and ${b} blend into a third hue mid-fade: fade through a neutral, or use two tints of one hue` : `${a} to ${b}`);
  for (const f of FOCUS) if (f.b === Infinity && LOOP === 'hold') add(`caret: ${f.N.id}`, 'FAIL', 'still blinking at the end of a hold loop: blur it, or leave its screen');
  if (LOOP === 'hold' && PTR && V(PTR, 'op', DUR - 1e-6) > 0.001) add('pointer', 'FAIL', 'still on screen at the end of a hold loop: pointer out before the lockup');
}
function hudLive(add, N) {
  if (N.kind === 'group') { for (const K of N.kids) hudLive(add, K); return; }
  checkLiveArea(add, N.id, mbox(restChain(N), N.box), N.spec.bleed);
  if (N.kind === 'text' && !N.parent && N.y % UNIT) add(`grid: ${N.id}`, 'WARN', `baseline ${N.y} is not on the ${UNIT} px grid`);
}
function lastChange(see) {
  for (const T of TYPING) see(T.end + 1 / FPS, `${T.N.id} typing`);
  for (const f of FOCUS) see(f.b, `${f.N.id} caret`);
  for (const N of HUD) if (N.hudTyped) { const en = N.spec.enter; see(en.at + (N.line.glyphs.length + (en.cursor !== false ? 3 : 1)) / FPS, `${N.id} finishes typing`); }
}
function stills(push) {
  const d = DEV && DEV.spec.enter;
  if (d) push((d.at + landT(d.spring || 'LIFT') + 0.3) * FPS, 'device-in', 'the device has landed');
  for (const s of SHOTS) push(s.t * FPS, s.name, s.what);
  for (const C of CALLOUTS) push((C.tin + 0.7) * FPS, `callout-${C.id}`, `${C.id} and its leader landed`);
  if (LOCK) {
    push(Math.round(LOCK.wrap.exit * FPS + 8), 'loop-out', 'the lockup leaving, the device arriving');
    const back = Math.max(...LOCK.nodes.map((N) => (N.spec.enter ? N.spec.enter.at : 0)));
    push((back + 0.6) * FPS, 'lockup-in', 'the lockup coming back');
  }
}
function layout() {
  const r = (v) => Math.round(v * 10) / 10, rb = (b) => b.map(r);
  const nodes = (list) => list.map((N) => ({ id: N.id, type: N.type, box: rb(mbox(restChain(N), N.box)),
    ...(N.kind === 'text' ? { text: N.line.text, size: r(N.line.size), capH: r(N.line.capH), baseline: N.y } : {}), ...(N.kids.length ? { kids: nodes(N.kids) } : {}) }));
  return {
    device: DEV && { kind: DEV.kind, screen: [DEV.sw, DEV.sh], scale: DEV.scale, box: rb(mbox(devM(0, true), DEV.outer)), screenBox: rb(mbox(devM(0, true), [0, 0, DEV.sw, DEV.sh])) },
    screens: SCREENS.map((Sc) => ({ id: Sc.id, content: r(Sc.content), layers: nodes([...Sc.flow, ...Sc.fixed, ...Sc.overlays]) })),
    texts: TEXTS.map((T) => { const p = textPlace(T); return { id: T.line.id || T.N.id, text: T.line.text, px: r(T.line.size * p.s * (T.N.hud ? 1 : DEV.scale) / U), on: p.bg, color: T.color }; }),
    callouts: CALLOUTS.map((C) => ({ id: C.id, text: C.spec.text, box: rb(C.box), start: C.start && rb(C.start), capH: r(C.line.capH), size: r(C.line.size) })),
    hud: nodes(HUD),
  };
}

function build() {
  if (FILM.device) buildDevice(FILM.device);
  else if (FILM.screens && FILM.screens.length) throw new Error('screens need a device');
  (FILM.screens || []).forEach(buildScreen);
  CAM = { id: 'camera', P: {}, rest: { cx: CX, cy: CY, z: 1 } };
  if (FILM.pointer && DEV) buildPointer(FILM.pointer);
  buildHud();
  (FILM.callouts || []).forEach(buildCallout);
  for (const N of ALL) if (N.spec.enter || N.spec.keys || N.spec.exit || N.wrap) motionOf(N);
  if (DEV) { deviceMotion(); if (SCREENS.length) runScript(); }
  flushEvents();
  cameraMotion();
  flushEvents();
  for (const N of ALL) N.moves = Object.keys(N.P).length > 0 || (N.parent && N.parent.moves) || !!N.ripples;
  for (const C of CALLOUTS) {                      // the leader leaves the side of the words that faces its element
    const t = Math.min(DUR - 1e-6, C.tin + 0.6), E = calloutEnd(C, t) || [CX, CY], L = C.line, y = L.baseline - L.capH / 2;
    C.start = E[0] < (C.box[0] + C.box[2]) / 2 ? [C.box[0] - C.gap, y] : [C.box[2] + C.gap, y];
  }
  if (DEV && DEV.spec.enter) SHOTS.sort((a, b) => a.t - b.t);
}

boot({
  name: 'ui',
  springs: {
    LIFT: [0.78, 12], DROP: [1, 14], MOVE: [0.85, 16], CURSOR: [0.9, 18], DRAG: [1, 16], PRESS: [1, 50], RELEASE: [0.5, 26],
    PUSH: [1, 20], EXPAND: [0.86, 14], SHEET: [0.85, 16], TOAST: [0.7, 20], CLOSE: [1, 22], SCROLL: [0.8, 9], KNOB: [0.7, 28],
    TICKS: [1, 26], ZOOM: [1, 8], RIPPLE: [1, 12], RIPPLEFADE: [1, 14], LEAD: [1, 18], POP: [0.5, 20],
  },
  build, draw: drawFrame, disp, checks, lastChange, stills, layout, visible,
});
})();
</script>
</body>
