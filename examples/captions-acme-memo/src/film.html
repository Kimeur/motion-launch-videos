<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * A captioned clip: the user's own voice-over, podcast cut or interview, with
 * its words on screen in time with the speech. The transcript is the brief's
 * Facts: captions show its words unchanged, in order, apart from the
 * punctuation and filler removal chosen below.
 *
 * Times are seconds of the film (a transcript's times are in the track's own
 * time; audio.offset is where the film starts in it). Positions are pixels of
 * the base format, 1080 x 1920 (9:16); `pin` keeps an element's distance to
 * the edges it names in another format ('t', 'b', 'l', 'r'), and none keeps
 * its offset from the centre. Colours are palette role names.
 *
 * style: 'pop'        1 to 3 words at a time, big and centred, each word popping
 *                     on the frame its start time falls in, the current word lit
 *        'karaoke'    a line of 3 to 7 words, a highlight moving word by word
 *        'subtitles'  1 or 2 lines of at most 42 characters, at the bottom
 *        'audiogram'  a speaker card, bars driven by the voice, and captions
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Acme Memo captioned clip',
  alt: 'A captioned voice-over, word by word: "Most people scroll with the sound off. So, if your video talks, it should also read. Acme Memo turns what you say into captions, word by word, in time with your voice. Try it at example.com." Acme Memo. Demo copy, fictional product. Synthetic voice.',
  W: 1080, H: 1920, FPS: 60, DUR: 18, BPM,
  loop: 'none',
  palette: { bg: '#16122E', deep: '#251C52', halo: '#2E2466', paper: '#FFFFFF', ink: '#0C0A1C', sun: '#FFD23F', pink: '#FF6B9A', dim: '#A9A2D6' },
  fonts: {
    caption: { family: 'Montserrat', weight: 800 },
    text: { family: 'Montserrat', weight: 600 },
    mono: { family: 'IBM Plex Mono', weight: 500 },
  },
  grid: { margin: 104, unit: 8 },
  poster: 10.6,

  // The voice: rendered from its file (audio.track), and embedded (voice) so the page can decode it for the
  // waveform and the checks. Both name the same file in assets/.
  audio: { track: 'assets/voice.mp3', offset: 0, loudness: -16, sfx: 0 },
  voice: '__ASSET:assets/voice.mp3__',
  transcript: {
    words: '__ASSET:assets/words.json__',    // [{ word, start, end }]; or srt: or vtt: an .srt or .vtt file (word timings approximate)
    fillers: ['um'],                        // dropped from the captions (and listed in BRIEF.md's Facts)
    punct: 'trim',                          // 'keep', 'trim' (drop , . ; : at a word's end) or 'strip' (also ? !)
    case: 'as-is',                          // 'as-is', 'upper' or 'lower'
  },

  style: 'pop',
  captions: {
    x: 540, y: 1008, maxW: 720, size: 88,   // the block's centre, its widest line, the font size in px
    maxWords: 3, lines: 2,
    fill: 'paper', current: 'sun', emph: 'pink', stroke: 'ink', strokeW: 0.1,
    minDur: 0.7, linger: 0.5,
  },
  emphasis: ['off', 'read', 'captions'],    // words drawn in `emph`, a size larger (strings: every occurrence; numbers: word index)
  emphasisCue: { kind: 'tap', gain: -10 },  // a soft sound on each emphasised word, or null
  emoji: { on: false, words: { sound: 'mute', voice: 'mic' } },   // icons from the engine's whitelist, off by default

  backdrop: { from: 'bg', to: 'deep', shapes: [
    { id: 'H1', shape: 'circle', x: 1010, y: 360, r: 300, fill: 'halo' },
    { id: 'H2', shape: 'circle', x: 60, y: 1640, r: 380, fill: 'halo' },
  ] },
  brand: { text: 'ACME MEMO', size: 40, track: 180, fill: 'paper', small: 'DEMO COPY, FICTIONAL PRODUCT', smallFill: 'dim', y: 296, pin: 't' },
  speaker: { name: 'SYNTHETIC VOICE', fill: 'dim', y: 1424, pin: 'b' },
  progress: { y: 1472, pin: 'b', w: 720, h: 8, fill: 'sun', track: 'halo' },

  // Each format restacks the same film (engine.md, Formats). Positions are still base-format pixels.
  formats: {
    '1:1': {
      captions: { y: 1000, maxW: 840, size: 84 },
      brand: { y: 176 },
      speaker: { y: 1728 },
      progress: { y: 1776, w: 840 },
      backdrop: { shapes: [{ id: 'H1', x: 1000, y: 520 }, { id: 'H2', x: 80, y: 1420 }] },
    },
    '16:9': {
      captions: { y: 1000, maxW: 1200, size: 96, lines: 1 },
      brand: { y: 176 },
      speaker: { y: 1728 },
      progress: { y: 1776, w: 1000 },
      backdrop: { shapes: [{ id: 'H1', x: 1180, y: 560, r: 340 }, { id: 'H2', x: -120, y: 1400, r: 400 }] },
    },
  },
};

/* ===== CORE BEGIN: shared/core.js, synced by tools/sync.mjs. Do not edit it here. ===== */
/* ==========================================================================
 * CORE: the deterministic runtime every motion-* engine shares.
 * Source: shared/core.js in the motion-launch-videos repo, copied into each
 * template by tools/sync.mjs. Do not edit it inside a film.
 *
 * seek(t) is a pure function of (t mod DUR): same t, same pixels, whatever was
 * drawn before. No timers, no Date, no Math.random, no state between calls.
 *   - Springs are closed-form step responses, one per target change, snapped
 *     to exactly 1 once settled. A Prop is a base value plus its springs.
 *     Springs still settling when the loop ends carry over the seam.
 *   - Periodic motion runs a whole number of cycles per loop (cyc, wave,
 *     loopNoise), so it is exact at the seam by construction.
 *   - Randomness is seeded (mulberry32, hash).
 *   - Continuous motion reads the exact t; discrete state (typing, drawings
 *     held on twos, sprite frames, line boil) reads the quantised q, so every
 *     subframe of one output frame agrees on it.
 *   - Motion blur averages 1 to 64 subframes on a trailing 270-degree
 *     shutter, one per 5 px of movement, never across a hard cut.
 *   - Sound (FILM.audio) is synthesised from cues in an OfflineAudioContext,
 *     outside seek(), from seeded noise; a bed (FILM.audio.bed) adds music in
 *     a key, a reverb runs in plain JS; FILM.transparent clears to alpha.
 * The engine below describes its vertical through hooks (build, draw, disp,
 * checks, stills, layout, visible, lastChange) and calls boot(ENGINE) last.
 * The core keeps its internals to itself and exports the helpers listed at
 * its end, so an engine can name its own functions freely.
 * ========================================================================== */
const CORE = (() => {
/* ---------------- formats: one film, several aspect ratios ---------------- */
// ?format=9x16 (the scripts pass --format 9:16) re-sizes the film before anything reads FILM. A key of
// FILM.formats patches any field for that format (objects merge, arrays of items with an id merge by id,
// anything else is replaced). Without W and H in the patch, the standard ratios keep the film's short side:
// 1:1, 4:5, 9:16, 16:9. Positions stay authored in the base format; an engine maps them with fmtX/fmtY/fmtPos,
// which keep an element's offset from the centre (the default) or from the edge its pin names.
const BW = FILM.W, BH = FILM.H;
const FORMAT = (() => { const m = /[?&]format=(\d+)[x:](\d+)/.exec(location.search); return m ? `${m[1]}:${m[2]}` : null; })();
function mergeInto(a, b) {
  for (const [k, v] of Object.entries(b)) {
    const o = a[k];
    if (Array.isArray(v) && Array.isArray(o) && v.every((x) => x && x.id != null)) {
      for (const it of v) { const t = o.find((x) => x && x.id === it.id); if (t) mergeInto(t, it); else o.push(it); }
    } else if (v && typeof v === 'object' && !Array.isArray(v) && o && typeof o === 'object' && !Array.isArray(o)) mergeInto(o, v);
    else a[k] = v;
  }
  return a;
}
if (FORMAT) {
  const patch = (FILM.formats || {})[FORMAT] || {};
  const [ra, rb] = FORMAT.split(':').map(Number), short = Math.min(BW, BH);
  if (!(ra > 0 && rb > 0)) throw new Error(`bad format ${FORMAT}`);
  const size = ra === rb ? [short, short] : ra < rb ? [short, Math.round(short * rb / ra / 2) * 2] : [Math.round(short * ra / rb / 2) * 2, short];
  mergeInto(FILM, { W: size[0], H: size[1], ...patch });
}
const { W, H, FPS, DUR } = FILM;
const NFR = Math.round(DUR * FPS);                 // output frames in the loop
const CX = W / 2, CY = H / 2;
const U = Math.min(W, H) / 1080;                   // scale for built-in pixel constants
const PAL = FILM.palette;
const USED = new Set();                            // palette roles the film draws with
const col = (k) => PAL[k] || k;                    // look a role up (while drawing)
const role = (k) => { USED.add(k); return PAL[k] || k; };   // resolve and register a role (at build time)
const GRID = FILM.grid || {};
const MARGIN = GRID.margin != null ? GRID.margin : Math.round(104 * U);
const UNIT = GRID.unit || 8;
const MEASURE = W - 2 * MARGIN;
const FS = Math.min(W, H) / Math.min(BW, BH);      // base px -> this format's px
const FMT = { key: FORMAT || `${BW}x${BH}`, W, H, BW, BH, s: FS, aspect: W === H ? 'square' : W < H ? 'vertical' : 'horizontal' };
// pin: 'l' or 'r' keeps the distance from that edge, 't' or 'b' likewise; otherwise the offset from the centre
const fmtX = (x, pin = '') => /l/.test(pin) ? x * FS : /r/.test(pin) ? W - (BW - x) * FS : W / 2 + (x - BW / 2) * FS;
const fmtY = (y, pin = '') => /t/.test(pin) ? y * FS : /b/.test(pin) ? H - (BH - y) * FS : H / 2 + (y - BH / 2) * FS;
const fmtPos = (x, y, pin = '') => [fmtX(x, pin), fmtY(y, pin)];
const fmtSz = (v) => v * FS;
const LOOP = FILM.loop || 'hold';                  // 'hold': ends on a still copy of frame 0; 'cycle': periodic, continuous over the seam; 'none'
const BLUR = FILM.blur !== false;                  // false: one sample per frame (cartoon, pixel art)
const TRANSPARENT = !!FILM.transparent;            // clear to transparent instead of filling bg (bg stays the assumed backdrop)
const SHUTTER = 0.75;                              // 270 degrees, trailing
const MIN_SAMPLES = 4, MAX_SAMPLES = 64, PX_PER_SAMPLE = 5;   // Uint16 sums hold up to 257 x 255
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', FILM.alt || FILM.title || '');
if (FILM.title) document.title = FILM.title;
document.documentElement.style.background = PAL.bg;
document.body.style.background = PAL.bg;
// CPU raster everywhere: Chrome moves a canvas from GPU to CPU after repeated getImageData
// reads, which changes antialiasing mid-render. Pin every 2D context from its first call.
// An alpha channel, though every frame fills it opaque: on an opaque canvas Chromium draws text with
// LCD subpixel antialiasing (red and blue fringes on every glyph), whatever the command line says.
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: true });
const mkCanvas = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const mk2d = (w, h) => { const c = mkCanvas(w, h); return [c, c.getContext('2d', { willReadFrequently: true })]; };
const mctx = mkCanvas().getContext('2d', { willReadFrequently: true });   // measuring only

/* ---------------- springs: closed-form step responses ---------------- */
// [zeta, omega]. Underdamped (zeta < 1) overshoots and lands; zeta = 1 glides in without overshoot.
// Engines add their own (boot merges ENGINE.springs, then FILM.springs).
const SP = {
  SLAM: [0.60, 30.0], LAND: [0.72, 28.0], PUNCH: [0.65, 31.0], FADE: [1, 32.4],
  FOCUS: [1, 19.5], EXIT: [1, 32.4], PAN: [1, 32.4], DRAW: [1, 32.4],
  LINE: [0.80, 15.6], MASK: [1, 19.5], TICK: [1, 32.4],
};
const spring = (sp) => { const s = typeof sp === 'string' ? SP[sp] : sp; if (!s) throw new Error(`unknown spring ${sp}`); return s; };
const settle = (sp) => 16 / (sp[0] * sp[1]);       // after this the response snaps to exactly 1
function S(tau, sp) {
  const z = sp[0], w = sp[1];
  if (tau <= 0) return 0;
  if (tau >= settle(sp)) return 1;                 // residual < 2e-6 of the move: snap, so loops are bit-exact
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
  }
  return 1 - (1 + w * tau) * Math.exp(-w * tau);
}
function dS(tau, sp) {                             // d S / d tau, per second
  const z = sp[0], w = sp[1];
  if (tau <= 0 || tau >= settle(sp)) return 0;
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (w * w / wd) * Math.exp(-z * w * tau) * Math.sin(wd * tau); }
  return w * w * tau * Math.exp(-w * tau);
}
// the visible landing: the first crossing of the target when underdamped, 95 % when critically damped
function landT(sp) {
  sp = spring(sp);
  const z = sp[0], w = sp[1];
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (Math.PI - Math.atan(wd / (z * w))) / wd; }
  let a = 0, b = settle(sp);
  for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (S(m, sp) < 0.95) a = m; else b = m; }
  return b;
}

// A property = base value + one spring per target change (superposed). set() is an instant jump
// that cancels earlier springs; use it only while the element is invisible, at a hard cut, or hidden
// inside fast motion blur. Events are added in time order. In a looping film, springs still settling
// at the end of the loop carry over the seam into its start (only while no set() has happened yet),
// so the film is continuous there; the value a Prop ends on must equal the value it starts from.
const PROPS = [];
class Prop {
  constructor(v0, name) { this.v0 = v0; this.last = v0; this.ev = []; this.tLast = -Infinity; this.name = name || '?'; this.tail = null; this.firstSet = Infinity; PROPS.push(this); }
  order(t) { if (t < this.tLast - 1e-9) throw new Error(`${this.name}: event at ${t} added after one at ${this.tLast}`); this.tLast = t; this.tail = null; }
  to(t, v, sp) { this.order(t); this.ev.push({ t, d: v - this.last, sp: spring(sp), set: false }); this.last = v; return this; }
  set(t, v) { this.order(t); this.ev.push({ t, v, set: true }); this.last = v; return this; }
  seam() {                                         // the springs that carry over the seam
    if (this.tail) return this.tail;
    let k = -1;
    this.firstSet = Infinity;
    for (let i = 0; i < this.ev.length; i++) if (this.ev[i].set) { k = i; if (this.firstSet === Infinity) this.firstSet = this.ev[i].t; }
    this.tail = LOOP === 'none' ? [] : this.ev.slice(k + 1).filter((e) => e.d !== 0 && e.t + settle(e.sp) > DUR);
    return this.tail;
  }
  at(t) {
    let v = this.v0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) { v = ev[i].v; i0 = i + 1; }
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * S(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * (S(t + DUR - e.t, e.sp) - 1);
    return v;
  }
  vel(t) {                                         // per second
    let v = 0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) i0 = i + 1;
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * dS(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * dS(t + DUR - e.t, e.sp);
    return v;
  }
  active(a, b) {                                   // does the value change anywhere in (a, b]?
    for (const e of this.ev) {
      if (e.set) { if (e.t > a && e.t <= b) return true; }
      else if (e.d !== 0 && e.t < b && e.t + settle(e.sp) > a) return true;
    }
    if (a < this.firstSet) for (const e of this.seam()) if (e.t - DUR < b && e.t - DUR + settle(e.sp) > a) return true;

  }

}

/* ---------------- periodic motion and seeded randomness ---------------- */
// n whole cycles per loop: exact at the seam by construction. Use these for anything that never stops
// (an idle bob, a spin, a drifting field) and set ENGINE.always, or declare its windows with activeIn.

// three integers to [0, 1), well mixed: a pure replacement for Math.random keyed by what it decides

  const r = mulberry32(seed), a = arr.slice();

  return a;

/* ---------------- time ---------------- */
const wrapT = (t) => ((t % DUR) + DUR) % DUR;
const frameOf = (t) => Math.ceil(t * FPS - 1e-9);  // all subframes of output frame n map to n
const typed = (q, ts, n) => Math.max(0, Math.min(n, Math.ceil((q - ts) * FPS - 1e-6)));   // one character per frame
const noteSec = (v) => (typeof v === 'number' && v >= 1 ? 4 * 60 / FILM.BPM / v : v);     // 16 -> a 16th note
const drawing = (q, fps) => Math.floor(q * fps + 1e-6);    // index of the held drawing (12 fps = on twos at 24, fives at 60)

/* ---------------- colour ---------------- */
function rgbOf(hex) { const h = String(hex).replace('#', ''); const n = parseInt(h.length === 3 ? h.replace(/./g, '$&$&') : h.slice(0, 6), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

/* ---------------- fonts and type ---------------- */
const face = (r) => { const f = FILM.fonts && FILM.fonts[r]; if (!f) throw new Error(`no font role "${r}"`); return f; };

    : lost.length ? `${lost.length} words start in the same frame as the next and are never lit: ${lost.slice(0, 4).map((w) => `"${w.text}"`).join(', ')}`
    : `${CW.length} words; ${MODE === 'subtitles' ? 'each cue appears on the frame its first word starts in' : 'each lit on the frame its start time falls in'}, at most ${(maxOff * 1000).toFixed(1)} ms after the start (under one frame)`);
  // what a unit holds
  if (MODE === 'pop') {
    const big = UNITS.filter((U) => U.words.length > 3);
    add('pop groups', big.length ? 'FAIL' : 'PASS', big.length ? `${big.length} groups hold more than 3 words` : `${UNITS.length} groups of ${Math.min(...UNITS.map((U) => U.words.length))} to ${Math.max(...UNITS.map((U) => U.words.length))} words`);
  } else if (MODE === 'karaoke') {
    // a line under 3 words is fine when it is a phrase of its own, or when joining it to a neighbour in its phrase would not fit
    const n = UNITS.map((U) => U.words.length), big = UNITS.filter((U) => U.words.length > 7);
    const short = UNITS.filter((U) => U.words.length < 3), avoid = short.filter((U) => shortCost(U.words) > 1 && [UNITS[U.i - 1], UNITS[U.i + 1]].some((N) => N && N.words[0].seg === U.words[0].seg
      && unitFits(N.i < U.i ? [...N.words, ...U.words] : [...U.words, ...N.words])));
    add('karaoke lines', big.length ? 'FAIL' : avoid.length ? 'WARN' : 'PASS', big.length ? `${big.length} lines hold more than 7 words`
      : avoid.length ? `${avoid.length} lines hold under 3 words and would fit with a neighbour: ${avoid.map((U) => `"${U.words.map((w) => w.text).join(' ')}"`).slice(0, 3).join(', ')}`
      : `${UNITS.length} lines of ${Math.min(...n)} to ${Math.max(...n)} words${short.length ? ` (${short.length} under 3: a phrase of its own, or too wide to join)` : ''}`);
  } else {
    const cs = UNITS.flatMap((U) => U.lines.map(chars)), worst = Math.max(...cs), two = UNITS.filter((U) => U.lines.length > 2);
    add('subtitle lines', worst > 42 || two.length ? 'FAIL' : worst > CFG.maxChars ? 'WARN' : 'PASS', `${UNITS.length} cues, ${cs.length} lines, the longest ${worst} characters (at most ${Math.min(42, CFG.maxChars)}), ${Math.max(...UNITS.map((U) => U.lines.length))} lines at most`);
  }
  const shrunk = UNITS.filter((U) => U.k < 1);
  if (shrunk.length) add('caption size', shrunk.some((U) => U.k < 0.8) ? 'WARN' : 'PASS', `${shrunk.length} units set smaller to fit ${Math.round(sz(CFG.maxW))} px: ${shrunk.slice(0, 3).map((U) => `"${U.words.map((w) => w.text).join(' ')}" at ${Math.round(U.k * 100)} %`).join(', ')}`);
  const small = S0 * Math.min(1, ...UNITS.map((u) => u.k)) / U_;
  if (small < 40) add('caption size', 'WARN', `${small.toFixed(0)} px at 1080: hard to read on a phone (40 px or more)`);
  // reading speed: characters (spaces included) over the time a unit can be read in
  const cps = UNITS.map((U) => ({ U, v: chars(U.words) / Math.max(1e-3, U.shownT) }));
  const fast = cps.filter((r) => r.v > 17), faster = cps.filter((r) => r.v > 25), top = cps.reduce((a, b) => (b.v > a.v ? b : a), cps[0]);
  add('reading speed', faster.length ? 'FAIL' : fast.length ? 'WARN' : 'PASS', `${faster.length || fast.length ? `${(faster.length ? faster : fast).length} units over ${faster.length ? 25 : 17} characters a second: ` : ''}the fastest "${top.U.words.map((w) => w.text).join(' ')}", ${top.v.toFixed(1)} characters a second over ${fmtS(top.U.shownT)} (warn above 17, fail above 25)`);
  // time on screen, gaps and overlaps between units
  const shortU = UNITS.filter((U) => U.shownT < CFG.minDur - 1e-6);
  const minU = UNITS.reduce((a, b) => (b.shownT < a.shownT ? b : a), UNITS[0]);
  add('time on screen', shortU.length ? 'WARN' : 'PASS', shortU.length ? `${shortU.length} units under ${CFG.minDur} s: ${shortU.slice(0, 3).map((U) => `"${U.words.map((w) => w.text).join(' ')}" ${fmtS(U.shownT)}`).join(', ')}`
    : `every unit on screen ${CFG.minDur} s or more (the shortest "${minU.words.map((w) => w.text).join(' ')}", ${fmtS(minU.shownT)})`);
  let flick = 0, overlap = 0, gaps = [];
  UNITS.forEach((U, i) => { const nx = UNITS[i + 1]; if (!nx) return; const g = nx.f0 - U.fEnd; if (g < 0) overlap++; else if (g > 0 && g < 4) flick++; else if (g >= 4) gaps.push(g / FPS); if (U.fEnd <= U.f0) overlap++; });
  add('gaps', overlap || flick ? 'FAIL' : 'PASS', overlap ? `${overlap} units overlap or never show` : flick ? `${flick} gaps under 4 frames: the captions flicker off and on` : `${gaps.length} pauses with no caption${gaps.length ? `, the longest ${fmtS(Math.max(...gaps))}` : ''}; no overlaps, no flicker`);
  // safe zones
  const [sx0, sy0, sx1, sy1] = SAFE.box;
  const outOf = (b) => b[0] < sx0 - 1 || b[1] < sy0 - 1 || b[2] > sx1 + 1 || b[3] > sy1 + 1;
  const items = UNITS.map((U) => ({ id: `"${U.words.map((w) => w.text).join(' ')}"`, b: U.box }));
  for (const [id, L] of [['brand', BRAND], ['small print', SMALL], ['speaker', SPEAKER], ['name', CARD && CARD.name], ['show', CARD && CARD.show]]) if (L) items.push({ id, b: [L.inkL, L.top, L.inkR, L.bottom] });
  if (CARD) { const [x, y, s] = CARD.cover; items.push({ id: 'cover', b: [x, y, x + s, y + s] }); const B = CARD.bars; items.push({ id: 'bars', b: [B.x - B.w / 2, B.y - B.h / 2, B.x + B.w / 2, B.y + B.h / 2] }); }
  if (PR) { const w = sz(PR.w), x = px(PR.x != null ? PR.x : 540, PR.pin) - w / 2, y = fmtY(PR.y, PR.pin || ''); items.push({ id: 'progress', b: [x, y, x + w, y + sz(PR.h || 8)] }); }
  const outs = items.filter((it) => outOf(it.b));
  add(`safe zone ${key}`, outs.length ? 'FAIL' : 'PASS', outs.length ? `${outs.slice(0, 4).map((it) => `${it.id} [${it.b.map((v) => Math.round(v)).join(', ')}]`).join('; ')} outside [${SAFE.box.join(', ')}] (${SAFE.why})`
    : `${items.length} elements ${SAFE.why}, inside [${SAFE.box.join(', ')}]`);
  // the frame's own pieces never collide with the captions
  const frameItems = items.filter((it) => !it.id.startsWith('"')), quiet = (n, st, d) => { if (st !== 'PASS') add(n, st, d); };
  checkSpacing(quiet, frameItems.filter((it) => it.id !== 'bars' && it.id !== 'progress'));   // the frame's own pieces, once
  for (const it of frameItems) {                   // every caption against each piece, one row a piece
    const hit = [], near = [];
    for (const U of UNITS) {
      const a = U.box, b = it.b, dx = Math.max(0, a[0] - b[2], b[0] - a[2]), dy = Math.max(0, a[1] - b[3], b[1] - a[3]);
      const gap = dx === 0 && dy === 0 ? -1 : Math.hypot(dx, dy), say = `"${U.words.map((w) => w.text).join(' ')}"`;
      if (gap < 0) hit.push(say); else if (gap < 16 * U_) near.push([say, gap]);
    }
    if (hit.length) add(`collision: captions / ${it.id}`, 'FAIL', `${hit.length} captions overlap it: ${hit.slice(0, 3).join(', ')}`);
    else if (near.length) add(`cramped: captions / ${it.id}`, 'WARN', `${near.length} captions under 16 px from it (the closest ${Math.min(...near.map((n) => n[1])).toFixed(1)} px): ${near.slice(0, 3).map((n) => n[0]).join(', ')}`);
  }
  // the voice
  if (!FILM.voice) add('voice', 'WARN', 'no voice embedded (FILM.voice): the waveform, the alignment and the duration checks are off');
  else if (VOICE.error) add('voice', 'FAIL', `Chromium cannot decode the embedded voice (${VOICE.error}). Its open-source build has no AAC decoder: convert an .m4a or .aac to MP3 (ffmpeg -i voice.m4a -c:a libmp3lame -b:a 128k assets/voice.mp3) and point voice and audio.track at it`);
  else {
    const lastEnd = Math.max(...CW.map((w) => w.end));
    const fit = VOICE.dur - OFFSET;
    const st = fit < lastEnd ? 'FAIL' : fit < DUR - 1 / FPS ? 'FAIL' : VOICE.tail > 0 ? 'WARN' : 'PASS';
    add('voice', st, `${VOICE.dur.toFixed(3)} s, ${VOICE.channels} channel${VOICE.channels > 1 ? 's' : ''}, decoded at ${VOICE.rate} Hz; the film plays ${OFFSET.toFixed(2)} to ${(OFFSET + DUR).toFixed(2)} s of it`
      + (fit < lastEnd ? `: the last word ends at ${lastEnd.toFixed(2)} s, after the file does` : fit < DUR - 1 / FPS ? `: ${(DUR - fit).toFixed(2)} s short of DUR, and the render loops a short track (the voice would start again)` : VOICE.tail > 0 ? `: the voice is still sounding ${VOICE.tail.toFixed(2)} s after the film ends (it is cut off)` : ''));
    add('decode', VOICE.same ? 'PASS' : 'FAIL', VOICE.same ? 'decoded twice, the same samples: the waveform is deterministic' : 'two decodes of the same file differ: the waveform would change between runs');
    if (VOICE.lag != null) {
      const ms = VOICE.lag / FPS * 1000;
      const off = Math.abs(ms) > 100 ? 'FAIL' : Math.abs(ms) > 35 ? 'WARN' : 'PASS';

      add('alignment', off, off === 'PASS' ? `the transcript's words line up with the voice's loud frames (best at ${ms >= 0 ? '+' : ''}${ms.toFixed(0)} ms)`
        : `the transcript runs about ${Math.abs(ms).toFixed(0)} ms ${ms < 0 ? 'late' : 'early'} against the voice: fix its timings, or audio.offset`);
      add('words on sound', VOICE.silent.length > Math.max(1, CW.length * 0.05) ? 'WARN' : 'PASS', VOICE.silent.length ? `${VOICE.silent.length} words fall on near silence: ${VOICE.silent.slice(0, 4).map((w) => `"${w.text}" at ${w.start.toFixed(2)} s`).join(', ')}` : `every word's span holds speech`);

  // emphasis and emoji

  if ((FILM.emphasis || []).length) add('emphasis', unmatched.length ? 'WARN' : 'PASS', unmatched.length ? `no word matches ${unmatched.map((e) => `"${e}"`).join(', ')}` : `${CW.filter((w) => w.emph).length} words in ${CFG.emph || 'the fill'}`);
  if (EMOJI.on) {
    const wrong = Object.entries(EMOJI.words || {}).filter(([, v]) => !ICONS[v]);
    add('emoji', wrong.length ? 'FAIL' : 'PASS', wrong.length ? `not in the whitelist (${Object.keys(ICONS).join(', ')}): ${wrong.map(([k, v]) => `${k}: ${v}`).join(', ')}` : `${CW.filter((w) => w.icon).length} icons from the whitelist`);
  }
  if (CARD && CARD.img) add('cover', CARD.upscale > 1.25 ? 'WARN' : 'PASS', `drawn at ${Math.round(CARD.cover[2])} px square, ${CARD.upscale > 1 ? `upscaled ${CARD.upscale.toFixed(2)}x` : 'downscaled'} from ${COVER.naturalWidth} x ${COVER.naturalHeight}`);
  if (IMGCON) add('contrast: captions on the image', IMGCON.r < 4.5 ? 'FAIL' : 'PASS', `${IMGCON.r.toFixed(2)}:1 for ${CFG.fill} over the darkest 5 % of the backdrop behind the captions (needs 4.5:1; draw a stroke or a box)`);
}
let IMGCON = null;
function cycles() { return []; }
function stills(push) {
  const pick = UNITS.length <= 14 ? UNITS : Array.from({ length: 14 }, (_, i) => UNITS[Math.round(i * (UNITS.length - 1) / 13)]);
  for (const U of pick) {
    const last = U.words[U.words.length - 1];
    push(Math.min(last.f + 12, U.fEnd - 1), `u${String(U.i).padStart(2, '0')}`, `"${U.words.map((w) => w.text).join(' ')}"`);
  }
  if (MODE === 'pop' && UNITS.length) push(UNITS[0].words[0].f + 3, 'pop-in', 'the first word popping in');
  if (MODE === 'karaoke' && UNITS.length && UNITS[0].words[1]) push(UNITS[0].words[1].f + 3, 'pill-move', 'the highlight moving to the second word');
}
function layout() {
  const r = (v) => Math.round(v * 10) / 10;
  return { style: STYLE, mode: MODE, size: r(S0), safe: SAFE.box, transcript: { source: SRC.kind, approximate: SRC.approx, words: RAW.length, shown: CW.length, fillers: DROPPED.map((w) => w.raw) },
    voice: { dur: VOICE.dur, lagFrames: VOICE.lag },
    units: UNITS.map((U) => ({ i: U.i, text: U.lines.map((l) => l.map((w) => w.text).join(' ')), t0: r(U.t0 * 1000) / 1000, frames: [U.f0, U.fEnd], shown: r(U.shownT * 100) / 100,
      cps: r(chars(U.words) / U.shownT), scale: r(U.k * 100) / 100, box: U.box.map(r), words: U.words.map((w) => ({ text: w.text, start: w.start, frame: w.f })) })) };
}

async function build() {
  // the transcript, in film time
  RAW = loadTranscript();
  RAW.forEach((w, i) => { w.idx = i; w.film0 = w.start - OFFSET; w.film1 = w.end - OFFSET; w.inClip = w.film0 >= 0 && w.film1 <= DUR; w.cut = !w.inClip && w.film1 > 0 && w.film0 < DUR; });
  OUTSIDE = RAW.filter((w) => !w.inClip);
  const fill = new Set((TR.fillers || []).map((f) => norm(f)));
  const emph = FILM.emphasis || [];
  for (const w of RAW) {
    if (!w.inClip) continue;
    if (fill.has(norm(w.raw))) { w.filler = true; DROPPED.push(w); continue; }
    const cw = { raw: w.raw, text: shown(w.raw), start: w.film0, end: w.film1, idx: w.idx, exact: w.exact };
    if (!cw.text.trim()) continue;
    cw.f = frameOf(cw.start);
    cw.emph = emph.some((e) => (typeof e === 'number' ? e === w.idx : norm(String(e)) === norm(w.raw)));
    cw.icon = iconFor(cw);
    CW.push(cw);
    useText(ROLE, cw.text);
  }
  // the pause after each word, counting a removed filler as speech (the speaker has not stopped)
  CW.forEach((w) => { const nx = RAW[w.idx + 1]; w.gapAfter = nx && nx.inClip ? nx.film0 - w.end : Infinity; });
  if (!CW.length) throw new Error('no transcript words fall inside the film');
  S0 = sz(CFG.size); CAP = capRatio(ROLE) * S0; SPACE = metrics(' ', ROLE, S0).adv;
  Object.assign(ICON, { size: sz(EMOJI.size || 120), x: EMOJI.x != null ? px(EMOJI.x, EMOJI.pin) : null, y: EMOJI.y != null ? fmtY(EMOJI.y, EMOJI.pin || '') : null });
  buildUnits();
  if (MODE === 'subtitles') {                      // one box height for every line
    const m = metrics('ÁHgjpqy', ROLE, S0);
    for (const U of UNITS) { U.asc = CAP * U.k; U.desc = m.desc * U.k; U.padX = BOXPAD * S0 * U.k; U.padY = 0.3 * S0 * U.k; U.radius = 0.2 * S0 * U.k; U.boxH = U.asc + U.desc + 2 * U.padY; }
  }
  UNITS.forEach(layUnit);
  buildProps();
  // the frame: backdrop, brand, speaker, card
  let img = null;
  if (BD.image) img = await loadImage(BD.image);
  if (STYLE === 'audiogram' && (AG.cover || {}).src) COVER = await loadImage(AG.cover.src);
  BACK = buildBackdrop(img);
  buildFrameText();
  buildCard();
  await loadVoice();
  alignVoice();
  // contrast: the captions against what they sit on
  const minC = 4.5;
  const behind = [BD.from || 'bg', BD.to || BD.from || 'bg', ...(BD.shapes || []).map((s) => s.fill)].filter((v, i, a) => a.indexOf(v) === i);
  const on = (fg, id, min) => { if (!fg) return; if (MODE === 'subtitles' && CFG.box && CFG.boxAlpha >= 1) needContrast(id, fg, CFG.box, min); else if (CFG.stroke) needContrast(id, fg, CFG.stroke, min); else if (!img) for (const b of behind) needContrast(`${id} on ${b}`, fg, b, min); };
  on(CFG.fill, 'captions', minC);
  if (MODE === 'pop') on(CFG.current, 'current word', minC);
  if (CW.some((w) => w.emph)) on(CFG.emph, 'emphasis', minC);
  if ((MODE === 'pop' && CFG.upcoming === 'dim') || MODE === 'karaoke') on(CFG.dim, 'upcoming words', 3);
  if (MODE === 'karaoke') needContrast('lit word', CFG.pillText, CFG.pill, minC);
  if (MODE === 'subtitles' && CFG.box && CFG.boxAlpha < 1) for (const b of behind) needContrast(`captions on the ${Math.round(CFG.boxAlpha * 100)} % box over ${b}`, CFG.fill, mix(col(b), col(CFG.box), CFG.boxAlpha), minC);
  if (img && !CFG.stroke && !(MODE === 'subtitles' && CFG.box)) {   // measured on the pixels behind the captions
    const d = BACK.getContext('2d').getImageData(0, 0, W, H).data, lums = [];
    for (const U of UNITS) for (let y = Math.max(0, U.box[1] | 0); y < Math.min(H, U.box[3]); y += 4) for (let x = Math.max(0, U.box[0] | 0); x < Math.min(W, U.box[2]); x += 4) { const i = (y * W + x) * 4; lums.push(hexOf(d[i], d[i + 1], d[i + 2])); }

  for (const L of [['brand', FILM.brand && FILM.brand.fill || 'paper', BRAND, 3], ['small print', FILM.brand && FILM.brand.smallFill || 'dim', SMALL, 4.5], ['speaker', FILM.speaker && FILM.speaker.fill || 'dim', SPEAKER, 4.5]])

    if (!img) accentAt(w.f / FPS, `emph-${norm(w.raw).replace(/[^a-z0-9]+/g, '-')}`);
    if (FILM.emphasisCue) cue(w.start, FILM.emphasisCue.kind || 'tap', { gain: FILM.emphasisCue.gain != null ? FILM.emphasisCue.gain : -10 });

}

boot({
  name: 'captions',
  springs: { POP: [0.5, 26], HI: [1, 40], SLIDE: [0.85, 34] },
  build, draw: (c, t, q, nq) => drawFrame(c, t, q, nq), disp, checks, cycles, stills, layout,
  visible: () => true,                             // the backdrop, the brand and the progress bar are on every frame
  // the backdrop's roles are background for the composition check; an image covers them, and is the picture itself
  backdrop: FILM.backdrop === undefined ? ['bg'] : BD.image ? [] : [BD.from || 'bg', BD.to || BD.from || 'bg', ...(BD.shapes || []).map((s) => s.fill)],
});
})();
