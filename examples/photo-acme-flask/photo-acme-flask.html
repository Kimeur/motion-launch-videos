    for (let i = 0; i < d.length; i += 4) {
      const c = [d[i], d[i + 1], d[i + 2]].map((v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
      const l = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      rs.push((Math.max(l, lf) + 0.05) / (Math.min(l, lf) + 0.05));
    }

}
// Where each image's crop sits: its focus point, and its subject box, against the part of the image
// that is on screen (the frame, clipped to the canvas), sampled every tenth of a second while the
// layer is on screen at rest (after its entrance lands, before it leaves; Ken Burns moves, carousel
// steps and drift included).
function cropReport(L) {
  const tests = [], [a, b] = restWindow(L);
  for (let t = a; t <= b; t += 0.1) tests.push(t);
  if (L.scene.wrap) for (let t = 0; t < L.scene.wrap.exit; t += 0.1) tests.push(t);
  let worstF = null, worstS = null;
  for (const t of tests) {
    for (const pc of pieces(L, t)) {
      if (!pc.img || pc.op < 0.95 || pc.rv < 0.999 || Math.abs(pc.sc) < 0.9 || (L.kind === 'gallery' && Math.abs(pc.o) > 0.25)) continue;
      const imgs = pc.img2 ? [pc.img, pc.img2] : [pc.img];
      for (const I of imgs) {
        const m = L.kind === 'cutout' ? { s: pc.w / I.iw, cx: I.iw / 2, cy: I.ih / 2 } : frameMap(L, pc, t, I);
        const s = m.s * pc.sc;
        // the frame on the canvas (rotation ignored), clipped to the canvas, back into image fractions
        const fx0 = Math.max(0, pc.x - pc.w * pc.sc / 2), fx1 = Math.min(W, pc.x + pc.w * pc.sc / 2), fy0 = Math.max(0, pc.y - pc.h * pc.sc / 2), fy1 = Math.min(H, pc.y + pc.h * pc.sc / 2);
        const zc = L.kind === 'cutout' ? kbAt(L, t, L.focus).z : 1;
        const toI = (X, Y) => [(m.cx + (X - pc.x) / (s * zc)) / I.iw, (m.cy + (Y - pc.y) / (s * zc)) / I.ih];
        const [u0, v0] = toI(fx0, fy0), [u1, v1] = toI(fx1, fy1);
        const f = L.kind === 'grid' && pc.focus ? pc.focus : I.focus;
        const mg = 0.02, inF = f[0] >= u0 + mg && f[0] <= u1 - mg && f[1] >= v0 + mg && f[1] <= v1 - mg;
        const edge = Math.min(f[0] - u0, u1 - f[0], f[1] - v0, v1 - f[1]);
        if (!worstF || edge < worstF.edge) worstF = { edge, t, I, inF, f };
        if (I.subject) {
          const [a0, b0, a1, b1] = I.subject, iw = Math.max(0, Math.min(a1, u1) - Math.max(a0, u0)), ih = Math.max(0, Math.min(b1, v1) - Math.max(b0, v0));
          const kept = (iw * ih) / ((a1 - a0) * (b1 - b0));

}
function checks(add) {
  // the images: embedded, declared, shown sharp
  for (const I of Object.values(IMG)) {
    const embedded = /^data:image\//.test(I.spec.src);
    if (!I.uses) { add(`asset: ${I.id}`, 'WARN', 'in FILM.images but never shown: remove it (it only adds weight)'); continue; }
    add(`asset: ${I.id}`, embedded && I.spec.brief ? 'PASS' : 'FAIL', !embedded ? 'not embedded: put the file in assets/ and give src its asset token (core.md, Assets)' : !I.spec.brief ? 'no brief: name the BRIEF.md Assets row that records where it came from (brief: \'A1\')' : `${I.iw} x ${I.ih} px, embedded, BRIEF.md row ${I.spec.brief}`);
    const k = I.maxShow, need = [Math.ceil(I.iw * k), Math.ceil(I.ih * k)];
    if (k > 1.15) add(`resolution: ${I.id}`, 'WARN', `shown at up to ${k.toFixed(2)}x its pixels (${FMT.key}): it will look soft. Use a ${need[0]} x ${need[1]} px original, or show it smaller`);
    else if (k < 0.5) add(`resolution: ${I.id}`, 'WARN', `at most ${k.toFixed(2)}x of its pixels are ever shown (${FMT.key}): resize the file to about ${need[0]} x ${need[1]} px; it only adds weight`);
    else add(`resolution: ${I.id}`, 'PASS', `shown at up to ${k.toFixed(2)}x its ${I.iw} x ${I.ih} px, drawn from a ${I.pre.width} x ${I.pre.height} cache`);
  }
  for (const Sc of SCENES) {
    const words = Sc.layers.reduce((s, L) => s + (L.words || 0), 0);
    add(`words: ${Sc.id}`, words > 4 ? 'FAIL' : 'PASS', `${words} words of display type (at most 4 a beat)`);
    const items = [];
    for (const L of Sc.layers) {
      if (L.kind === 'text' || L.kind === 'tag') {
        checkLiveArea(add, L.id, L.box, L.spec.bleed);
        items.push({ id: L.id, b: L.box });
      }
      if (L.kind === 'text') {
        if (L.spec.y % UNIT) add(`grid: ${L.id}`, 'WARN', `baseline ${L.spec.y} is not on the ${UNIT} px grid`);
        if (L.line.role === 'mono' && L.line.size < 24 * U) add(`small print: ${L.id}`, 'WARN', `${L.line.size.toFixed(0)} px is hard to read in a feed (24 px or more at 1080)`);
        const [a, b] = restWindow(L), times = b - a > 0.2 ? [a, (a + b) / 2, b] : [a];
        const r = backdropContrast(L, times);
        if (r) add(`contrast: ${L.id}`, r.r < L.min ? 'FAIL' : 'PASS', `${r.r.toFixed(2)}:1 against the pixels behind it (the worst 5 %, at ${r.at.toFixed(2)} s; needs ${L.min}:1)${r.r < L.min ? ': add a scrim, move it to a quieter part of the picture, or change the fill' : ''}`);
      }
      if (L.kind === 'tag') {
        add(`claim: ${L.id}`, L.spec.fact ? 'PASS' : 'FAIL', L.spec.fact ? `"${L.spec.text}" cites ${L.spec.fact} in BRIEF.md` : `"${L.spec.text}" cites no fact: add fact: 'F<n>' from the BRIEF.md Facts table, or cut the tag`);
        const [a, b] = restWindow(L), [tx, ty] = tagTarget(L, (a + b) / 2);
        checkLiveArea(add, `${L.id} dot`, [tx - L.dotR, ty - L.dotR, tx + L.dotR, ty + L.dotR], L.spec.bleed);
      }
      if (L.imgs.length) {
        const { worstF, worstS } = cropReport(L);
        if (worstF) {
          let st = worstF.inF ? 'PASS' : 'FAIL', detail = worstF.inF ? `the focus of ${[...new Set(L.imgs.map((I) => I.id))].join(', ')} stays in the crop` : `the focus of ${worstF.I.id} (${worstF.f.join(', ')}) leaves the crop at ${worstF.t.toFixed(2)} s: move the frame, the pan, or the focus`;
          if (worstS) {
            const pct = Math.round(worstS.kept * 100);
            if (worstS.kept < 0.9 && st === 'PASS') st = worstS.kept < 0.75 ? 'FAIL' : 'WARN';
            detail += `; ${pct} % of the subject of ${worstS.I.id} in frame at worst (${worstS.t.toFixed(2)} s)`;
          }
          add(`crop: ${L.id}`, st, detail);
        }
      }
      if (L.spec.loop && Sc.wrap && LOOP === 'hold') add(`hold: ${L.id}`, 'FAIL', 'a loop behaviour on the lockup keeps it moving through the still tail; use a cycle loop or move it to another scene');
      if (L.kbSpec && (L.kbSpec.z || [1, 1]).some((z) => z < 1) && L.fit === 'cover') add(`kb: ${L.id}`, 'WARN', 'a cover zoom below 1 would show the frame\'s edge: it is held at 1');
      if (L.kb && !L.kb.spring && L.kb.end > DUR) add(`kb: ${L.id}`, 'WARN', `the Ken Burns move ends at ${L.kb.end.toFixed(2)} s, after the loop`);
    }
    checkSpacing(add, items);
  }
}
function cycles() {
  const out = [];
  for (const Sc of SCENES) for (const L of Sc.layers) {
    const B = L.spec.loop;
    if (B) for (const k of ['bob', 'sway', 'pulse']) if (B[k]) out.push({ what: `${L.id} ${k}`, period: DUR / Math.abs(B[k][0]) });
    if (L.turn) out.push({ what: `${L.id} turn`, period: DUR / Math.abs(L.turn) });
    if (L.kbSpec && L.kbSpec.breathe) out.push({ what: `${L.id} breathe`, period: DUR / Math.abs(L.kbSpec.breathe[0]) });
  }
  return out;
}
function lastChange(see) {
  for (const L of Object.values(LAYERS)) if (L.typed) { const en = L.spec.enter; see(en.at + (L.line.glyphs.length + (en.cursor !== false ? 3 : 1)) / FPS, `${L.id} finishes typing`); }
}
function stills(push) {
  for (const Sc of SCENES) {
    const next = SCENES.find((s) => s.t0 > Sc.t0), end = Math.min(Sc.t1, next ? next.t0 : Sc.t1) - 3 / FPS;
    if (Sc.mask) push((Sc.tr.t0 + 0.45 * (Sc.tr.tEnd - Sc.tr.t0)) * FPS, `${Sc.id}-in`, `${Sc.in} into ${Sc.id}`);
    else if (Sc.in !== 'none' && Sc.t0 > 0) push(Sc.t0 * FPS + 1, `${Sc.id}-in`, `${Sc.in} into ${Sc.id}`);
    const rest = Math.min(end, Math.max(Sc.t0, ...Sc.layers.map((L) => restWindow(L)[0])) + 0.1);
    push(rest * FPS, `${Sc.id}-rest`, `${Sc.id} landed`);
    for (const L of Sc.layers) (L.spec.keys || []).forEach((k, j) => { if (k.at + 0.5 < end) push((k.at + 0.5) * FPS, `${L.id}-key${j + 1}`, `${L.id} after key ${j + 1}`); });
    if (Sc.drift || Sc.layers.some((L) => L.kb)) push(end * FPS, `${Sc.id}-end`, `${Sc.id} at the end of its move`);

function layout() {

    layers: Object.values(LAYERS).map((L) => ({ id: L.id, scene: L.scene.id, kind: L.kind, box: L.box.map(r),
      ...(L.kind === 'text' ? { text: L.spec.text, size: r(L.line.size), capH: r(L.line.capH), capTop: r(L.line.capTop), baseline: L.line.baseline, trackEm: r(L.line.trackEm) }
        : L.kind === 'tag' ? { text: L.spec.text, size: r(L.line.size), pill: L.pill.map(r) } : { frame: [r(L.w), r(L.h)] }) })),
    images: Object.values(IMG).map((I) => ({ id: I.id, px: [I.iw, I.ih], shownMax: r(I.maxShow * 100) / 100, cache: I.pre ? [I.pre.width, I.pre.height] : null, uses: I.uses })),

async function build() {
  await loadImages();
  buildScenes();
  for (const L of Object.values(LAYERS)) if (L.typed) {   // typed small print moves as one piece
    L.tc = { ox: 0, oy: 0, P: {}, phase: 0 };
    const Sc = L.scene;
    for (const key of Object.keys(COPY_KEYS)) L.tc.P[key] = new Prop(COPY_KEYS[key], `${L.id}.${key}`);
    if (Sc.wrap) { const w = Sc.wrap, v = stateVals(w.to || { op: 0 }).o; for (const [k, x] of Object.entries(v)) L.tc.P[k].to(w.exit + (w.stagger ? noteSec(w.stagger) * L.li : 0), x, springFor(k, w.spring || 'EXIT')); for (const k of Object.keys(v)) L.tc.P[k].set(Sc.wrapEnd, COPY_KEYS[k]); }

  // the largest size each image is shown at, over every frame of the film: the cache size, and the
  // resolution check
  for (let n = 0; n <= NFR; n++) {
    const t = Math.min(n / FPS, DUR - 1e-6);
    for (const Sc of activeScenes(t)) for (const L of Sc.layers) {
      if (!L.imgs.length) continue;
      for (const pc of pieces(L, t)) {
        if (!pc.img || pc.op < 0.002 || pc.rv < 1e-4) continue;
        for (const I of pc.img2 ? [pc.img, pc.img2] : [pc.img]) {
          const s = L.kind === 'cutout' ? pc.w / I.iw * kbAt(L, t, L.focus).z : frameMap(L, pc, t, I).s;
          I.maxShow = Math.max(I.maxShow, Math.abs(s * pc.sc));
        }
      }
    }
  }
  for (const I of Object.values(IMG)) if (I.uses) prescale(I);
  for (const L of Object.values(LAYERS)) if (L.kind === 'cutout' && L.shadow) silhouette(L.img, L.shadow.blur / (L.w / L.img.iw));
}

boot({
  name: 'photo',
  springs: { POP: [0.55, 20], SWIPE: [0.8, 14], TRACE: [1, 14], GLIDE: [1, 9], KEN: [1, 4.5] },
  build, draw: (c, t, q) => drawFrame(c, t, q, null), disp, checks, cycles, lastChange, stills, layout, visible,
  minSamples: 2,

})();
