<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * A data globe: a dotted Earth from real geography (Natural Earth), a camera
 * that flies along great circles, arcs between places, pins that rise as
 * beams with HUD cards on leader lines, a region title, a running total and
 * the lockup. The film is a story of beats (FILM.story) the engine turns into
 * camera moves, arcs, pins, cards and sound.
 *
 * Every number on screen comes from FILM.data, and every dataset names the
 * BRIEF.md Facts row it comes from; text shows a value with {ref}:
 * {parcels.sum}, {couriers.BR}, {parcels.count}. Every place names its
 * country, and the critique checks that the coordinates fall inside it.
 *
 * Times are seconds. Positions are base-format pixels (1920 x 1080); a pin
 * ('t', 'b', 'l', 'r' or a pair) keeps a distance to those edges in other
 * formats. Altitudes are km above the surface; angles are degrees.
 * ========================================================================== */
const BPM = 100;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Acme Relay network film',
  alt: 'A dotted green globe forms out of the dark, rings sweep round it and courier routes fly between South America, Africa and Europe. "Parcels cross oceans, hand to hand." The camera dives to Brazil: ROUTES LIVE, 1,840 couriers on shift. Pins rise over Sao Paulo, Rio de Janeiro, Belo Horizonte and Brasilia, each with a card counting the parcels handed over today and the share delivered the same day. The camera hops to Argentina (Buenos Aires, Cordoba), flies across the Atlantic to South Africa (Johannesburg, Cape Town) and on to India (Mumbai, Bengaluru). It pulls back: 10 hubs in 4 countries, 80,375 parcels today, 5,430 couriers. The globe shrinks to dust under a streak of light: Acme Relay. The world, same day. example.com. Demo data, fictional product.',
  W: 1920, H: 1080, FPS: 60, DUR: 31, BPM,
  loop: 'none',                              // a product film: it plays once and ends on the lockup
  palette: {

    text: '#ECF2EF', query: '#DDEAE5', number: '#E6F7F2', accent: '#62E8B0', label: '#A0B5AF', coords: '#9CB8AB', pct: '#A2B4B2',
    hudLabel: '#858585', hudValue: '#B8B8B8', kicker: '#66A88E', bar: '#6CAD93', track: '#1E1E1E',
    titleLo: '#9C9E9D', titleHi: '#E2E8E6', total: '#C6CBCB', statLabel: '#8D918F', bracket: '#2A3F38',

    buenosaires: { name: 'Buenos Aires', country: 'AR', lat: -34.6037, lon: -58.3816 },
    cordoba: { name: 'Córdoba', country: 'AR', lat: -31.4201, lon: -64.1888 },
    johannesburg: { name: 'Johannesburg', country: 'ZA', lat: -26.2041, lon: 28.0473 },
    capetown: { name: 'Cape Town', country: 'ZA', lat: -33.9249, lon: 18.4241 },
    mumbai: { name: 'Mumbai', country: 'IN', lat: 19.0760, lon: 72.8777 },
    bengaluru: { name: 'Bengaluru', country: 'IN', lat: 12.9716, lon: 77.5946 },
    lisbon: { name: 'Lisbon', country: 'PT', lat: 38.7223, lon: -9.1393 },
    lagos: { name: 'Lagos', country: 'NG', lat: 6.5244, lon: 3.3792 },
    accra: { name: 'Accra', country: 'GH', lat: 5.6037, lon: -0.1870 },
    bogota: { name: 'Bogotá', country: 'CO', lat: 4.7110, lon: -74.0721 },
    lima: { name: 'Lima', country: 'PE', lat: -12.0464, lon: -77.0428 },
    santiago: { name: 'Santiago', country: 'CL', lat: -33.4489, lon: -70.6693 },

  // Every card starts from this; a pin's own `card` merges over it. {pin} is the pin's place id, {place} its
  // name, {a2} its country code. A card shows a chip, a status (busy, then done when the progress bar fills),
  // a typed line, a count and a second count from the data, a bar chart (a series of the data), the progress
  // bar with its percentage (the card's own loading state, not a claim) and the coordinates.
  card: {
    chip: 'HUB SCAN', status: ['SYNCING', 'LIVE'], query: 'parcels today · {place}',
    count: { ref: 'parcels.{pin}', label: 'PARCELS' },
    second: { ref: 'sameday.{pin}', label: 'SAME DAY' },
    bars: 'trend.{pin}',
  },

  // The HUD. `counter` labels the running count of pins in the telemetry. Positions are the reference layout.
  hud: { counter: 'HUBS' },

  // The look of the world: dot density and size, field of view, beam height, orbit rings, sparkle, grain,
  // scanlines, vignette, bloom (engine.md, Globe). The defaults are the reference's measurements.
  globe: {},

  // The story, in time order. Beats: open, arcs, subtitle, region (a country, reached by a dive, a hop or a
  // flight, with its pins), total (the pull back and the running total) and outro (the globe recedes, the lockup).
  story: [
    { id: 'open', kind: 'open', form: 1.05,
      from: { lat: 6, lon: 14, alt: 39000 }, to: { lat: -12, lon: -30, alt: 19400 } },
    { id: 'routes', kind: 'arcs', at: 2.8, until: 7.3,
      routes: [['saopaulo', 'lisbon'], ['rio', 'lagos'], ['buenosaires', 'capetown'], ['bogota', 'saopaulo'], ['lima', 'brasilia'],
        ['lagos', 'johannesburg'], ['accra', 'rio'], ['santiago', 'saopaulo'], ['lisbon', 'lagos']] },
    { id: 'sub', kind: 'subtitle', at: 3.4, until: 6.42, lines: ['Parcels cross oceans,', 'hand to hand.'] },
    { id: 'br', kind: 'region', at: 5.2, country: 'BR', via: 'dive', kicker: 'ROUTES LIVE · {a2}',
      stat: { ref: 'couriers.{a2}', label: 'COURIERS ON SHIFT' },
      pins: [{ id: 'saopaulo', place: 'saopaulo', at: 7.83 }, { id: 'rio', place: 'rio', at: 8.83 },
        { id: 'belo', place: 'belo', at: 10.1 }, { id: 'brasilia', place: 'brasilia', at: 11.2 }] },
    { id: 'ar', kind: 'region', at: 12.7, country: 'AR', via: 'hop', kicker: 'ROUTES LIVE · {a2}',
      stat: { ref: 'couriers.{a2}', label: 'COURIERS ON SHIFT' },
      pins: [{ id: 'buenosaires', place: 'buenosaires', at: 14.55 }, { id: 'cordoba', place: 'cordoba', at: 15.25 }] },
    { id: 'za', kind: 'region', at: 16.6, country: 'ZA', via: 'fly', from: 'cordoba', kicker: 'ROUTES LIVE · {a2}',
      stat: { ref: 'couriers.{a2}', label: 'COURIERS ON SHIFT' },
      pins: [{ id: 'johannesburg', place: 'johannesburg' }, { id: 'capetown', place: 'capetown' }] },
    { id: 'in', kind: 'region', at: 20.3, country: 'IN', via: 'fly', from: 'capetown', kicker: 'ROUTES LIVE · {a2}',
      stat: { ref: 'couriers.{a2}', label: 'COURIERS ON SHIFT' }, view: { alt: 3800, tilt: 52 },
      pins: [{ id: 'mumbai', place: 'mumbai' }, { id: 'bengaluru', place: 'bengaluru' }] },
    { id: 'total', kind: 'total', at: 24.2, view: { lat: -14, lon: 4, alt: 19000 },
      kicker: '{parcels.count} HUBS · {couriers.count} COUNTRIES',
      count: { ref: 'parcels.sum', label: 'PARCELS TODAY' }, second: { ref: 'couriers.sum', label: 'COURIERS' } },
    { id: 'outro', kind: 'outro', at: 27.8 },
  ],

  // Sound: a bed in a key under the engine's cues (a boom on each structural beat, a swell into it, an arc on
  // each flight, a ping per pin, data under the typing and the counts, a lock when a card completes).
  audio: {
    loudness: -14,
    bed: { key: 'E minor', end: 'lift', movement: 0.55, pulse: { kick: -8, hats: -12 } },
  },
  sound: { boom: -3, swell: -2, arc: -2, ping: -5, data: -16, lock: -14 },

  // Other aspect ratios (render.mjs --format 9:16). Positions stay in base (1920 x 1080) pixels; HUD blocks keep
  // their distance to the edges they are pinned to. Story beats and pins merge by id.
  formats: {
    '9:16': {
      globe: { frame: [960, 480] },             // the camera's target 60 px above the middle of the tall frame
      hud: { title: { y: 536 }, total: { y: 560 }, subtitle: { y: 520 }, source: { y: 676 } },
      story: [{ id: 'open', to: { alt: 24000 } }, { id: 'total', view: { alt: 26000 } }],
    },
    '1:1': {
      hud: { source: { x: 1856, y: 140, pin: 'tr', align: 'R' } },
      story: [{ id: 'open', to: { alt: 21500 } }, { id: 'ar', pins: [{ id: 'buenosaires', at: 14.75 }] }, { id: 'total', view: { alt: 22000 } }],
    },
  },
};

/* ===== CORE BEGIN: shared/core.js, synced by tools/sync.mjs. Do not edit it here. ===== */
/* ==========================================================================
 * CORE: the deterministic runtime every motion-* engine shares.
 * Source: shared/core.js in the motion-launch-videos repo, copied into each
 * template by tools/sync.mjs. Do not edit it inside a film.
 *
 * seek(t) is a pure function of (t mod DUR): same t, same pixels, whatever was
 * drawn before. No timers, no Date, no Math.random, no state between calls.
 *   - Springs are closed-form step responses, one per target change, snapped
 *     to exactly 1 once settled. A Prop is a base value plus its springs.
 *     Springs still settling when the loop ends carry over the seam.
 *   - Periodic motion runs a whole number of cycles per loop (cyc, wave,
 *     loopNoise), so it is exact at the seam by construction.
 *   - Randomness is seeded (mulberry32, hash).
 *   - Continuous motion reads the exact t; discrete state (typing, drawings
 *     held on twos, sprite frames, line boil) reads the quantised q, so every
 *     subframe of one output frame agrees on it.
 *   - Motion blur averages 1 to 64 subframes on a trailing 270-degree
 *     shutter, one per 5 px of movement, never across a hard cut.
 *   - Sound (FILM.audio) is synthesised from cues in an OfflineAudioContext,
 *     outside seek(), from seeded noise; a bed (FILM.audio.bed) adds music in
 *     a key, a reverb runs in plain JS; FILM.transparent clears to alpha.
 * The engine below describes its vertical through hooks (build, draw, disp,
 * checks, stills, layout, visible, lastChange) and calls boot(ENGINE) last.
 * The core keeps its internals to itself and exports the helpers listed at
 * its end, so an engine can name its own functions freely.
 * ========================================================================== */
const CORE = (() => {
/* ---------------- formats: one film, several aspect ratios ---------------- */
// ?format=9x16 (the scripts pass --format 9:16) re-sizes the film before anything reads FILM. A key of
// FILM.formats patches any field for that format (objects merge, arrays of items with an id merge by id,
// anything else is replaced). Without W and H in the patch, the standard ratios keep the film's short side:
// 1:1, 4:5, 9:16, 16:9. Positions stay authored in the base format; an engine maps them with fmtX/fmtY/fmtPos,
// which keep an element's offset from the centre (the default) or from the edge its pin names.
const BW = FILM.W, BH = FILM.H;
const FORMAT = (() => { const m = /[?&]format=(\d+)[x:](\d+)/.exec(location.search); return m ? `${m[1]}:${m[2]}` : null; })();
function mergeInto(a, b) {
  for (const [k, v] of Object.entries(b)) {
    const o = a[k];
    if (Array.isArray(v) && Array.isArray(o) && v.every((x) => x && x.id != null)) {
      for (const it of v) { const t = o.find((x) => x && x.id === it.id); if (t) mergeInto(t, it); else o.push(it); }
    } else if (v && typeof v === 'object' && !Array.isArray(v) && o && typeof o === 'object' && !Array.isArray(o)) mergeInto(o, v);
    else a[k] = v;
  }
  return a;
}
if (FORMAT) {
  const patch = (FILM.formats || {})[FORMAT] || {};
  const [ra, rb] = FORMAT.split(':').map(Number), short = Math.min(BW, BH);
  if (!(ra > 0 && rb > 0)) throw new Error(`bad format ${FORMAT}`);
  const size = ra === rb ? [short, short] : ra < rb ? [short, Math.round(short * rb / ra / 2) * 2] : [Math.round(short * ra / rb / 2) * 2, short];
  mergeInto(FILM, { W: size[0], H: size[1], ...patch });
}
const { W, H, FPS, DUR } = FILM;
const NFR = Math.round(DUR * FPS);                 // output frames in the loop
const CX = W / 2, CY = H / 2;
const U = Math.min(W, H) / 1080;                   // scale for built-in pixel constants
const PAL = FILM.palette;
const USED = new Set();                            // palette roles the film draws with
const col = (k) => PAL[k] || k;                    // look a role up (while drawing)
const role = (k) => { USED.add(k); return PAL[k] || k; };   // resolve and register a role (at build time)
const GRID = FILM.grid || {};
const MARGIN = GRID.margin != null ? GRID.margin : Math.round(104 * U);
const UNIT = GRID.unit || 8;
const MEASURE = W - 2 * MARGIN;
const FS = Math.min(W, H) / Math.min(BW, BH);      // base px -> this format's px
const FMT = { key: FORMAT || `${BW}x${BH}`, W, H, BW, BH, s: FS, aspect: W === H ? 'square' : W < H ? 'vertical' : 'horizontal' };
// pin: 'l' or 'r' keeps the distance from that edge, 't' or 'b' likewise; otherwise the offset from the centre
const fmtX = (x, pin = '') => /l/.test(pin) ? x * FS : /r/.test(pin) ? W - (BW - x) * FS : W / 2 + (x - BW / 2) * FS;
const fmtY = (y, pin = '') => /t/.test(pin) ? y * FS : /b/.test(pin) ? H - (BH - y) * FS : H / 2 + (y - BH / 2) * FS;
const fmtPos = (x, y, pin = '') => [fmtX(x, pin), fmtY(y, pin)];
const fmtSz = (v) => v * FS;
const LOOP = FILM.loop || 'hold';                  // 'hold': ends on a still copy of frame 0; 'cycle': periodic, continuous over the seam; 'none'
const BLUR = FILM.blur !== false;                  // false: one sample per frame (cartoon, pixel art)
const TRANSPARENT = !!FILM.transparent;            // clear to transparent instead of filling bg (bg stays the assumed backdrop)
const SHUTTER = 0.75;                              // 270 degrees, trailing
const MIN_SAMPLES = 4, MAX_SAMPLES = 64, PX_PER_SAMPLE = 5;   // Uint16 sums hold up to 257 x 255
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', FILM.alt || FILM.title || '');
if (FILM.title) document.title = FILM.title;
document.documentElement.style.background = PAL.bg;
document.body.style.background = PAL.bg;
// CPU raster everywhere: Chrome moves a canvas from GPU to CPU after repeated getImageData
// reads, which changes antialiasing mid-render. Pin every 2D context from its first call.
// An alpha channel, though every frame fills it opaque: on an opaque canvas Chromium draws text with
// LCD subpixel antialiasing (red and blue fringes on every glyph), whatever the command line says.
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: true });
const mkCanvas = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const mk2d = (w, h) => { const c = mkCanvas(w, h); return [c, c.getContext('2d', { willReadFrequently: true })]; };
const mctx = mkCanvas().getContext('2d', { willReadFrequently: true });   // measuring only

/* ---------------- springs: closed-form step responses ---------------- */
// [zeta, omega]. Underdamped (zeta < 1) overshoots and lands; zeta = 1 glides in without overshoot.
// Engines add their own (boot merges ENGINE.springs, then FILM.springs).
const SP = {
  SLAM: [0.60, 30.0], LAND: [0.72, 28.0], PUNCH: [0.65, 31.0], FADE: [1, 32.4],
  FOCUS: [1, 19.5], EXIT: [1, 32.4], PAN: [1, 32.4], DRAW: [1, 32.4],
  LINE: [0.80, 15.6], MASK: [1, 19.5], TICK: [1, 32.4],
};
const spring = (sp) => { const s = typeof sp === 'string' ? SP[sp] : sp; if (!s) throw new Error(`unknown spring ${sp}`); return s; };
const settle = (sp) => 16 / (sp[0] * sp[1]);       // after this the response snaps to exactly 1
function S(tau, sp) {
  const z = sp[0], w = sp[1];
  if (tau <= 0) return 0;
  if (tau >= settle(sp)) return 1;                 // residual < 2e-6 of the move: snap, so loops are bit-exact
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
  }
  return 1 - (1 + w * tau) * Math.exp(-w * tau);
}
function dS(tau, sp) {                             // d S / d tau, per second
  const z = sp[0], w = sp[1];
  if (tau <= 0 || tau >= settle(sp)) return 0;
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (w * w / wd) * Math.exp(-z * w * tau) * Math.sin(wd * tau); }
  return w * w * tau * Math.exp(-w * tau);
}
// the visible landing: the first crossing of the target when underdamped, 95 % when critically damped

  FOCAL = F_OF();
  buildData();
  buildPlaces();
  buildLattice();
  buildStory();
  buildHud();
  placeCards();                                    // again, now that the HUD's boxes are measured
  buildSound();
  buildPlate();
  // the source line's windows: from the first number on screen to the last, merged
  const wins = [];
  for (const card of CARDS) wins.push([card.tIn, card.out + 0.13]);
  for (const r of REGIONS) if (r.stat) wins.push([r.titleIn, r.titleOut + 0.15]);
  if (TOTAL && TOTAL.count) wins.push([TOTAL.inAt, TOTAL.out + 0.25]);
  wins.sort((a, b) => a[0] - b[0]);
  for (const w of wins) { const l = SRC_WIN[SRC_WIN.length - 1]; if (l && w[0] <= l[1] + 0.6) l[1] = Math.max(l[1], w[1]); else SRC_WIN.push(w.slice()); }
  for (let i = 0; i < 64; i++) { const z = 1 - (2 * i + 1) / 64, rr = Math.sqrt(1 - z * z), lo = i * Math.PI * (3 - Math.sqrt(5)); PROBES.push([rr * Math.cos(lo), rr * Math.sin(lo), z]); }
  for (const k of ['bg', 'body', 'rim', 'rimLit', 'atmo', 'land', 'region', 'lit', 'hot', 'arc', 'white', 'beam', 'bloom', 'pin', 'leader', 'reticle', 'reticleGlow', 'busy', 'busyText', 'done', 'doneText',
    'card', 'cardEdge', 'tick', 'chip', 'chipEdge', 'text', 'query', 'number', 'accent', 'label', 'coords', 'pct', 'hudLabel', 'hudValue', 'kicker', 'bar', 'track', 'titleLo', 'titleHi', 'total',
    'statLabel', 'bracket', 'orbit', 'orbit2', 'mote', 'spark', 'streak', 'dust', 'wordmark', 'brandDim', 'tagline', 'pill', 'source']) role(k);
}

boot({
  name: 'globe',
  build,
  draw: (c, t, q) => drawFrame(c, t, q),
  accumulate, disp, checks, stills, layout, visible,
  always: true,                                    // the world turns on every frame; disp decides the subframes
  minSamples: 1,                                   // a slow drift needs one sample; a flight gets one per 5 px
  // the preview GIF: a 30 s film of moving dots is dense, so 8 fps, 32 colours and 57,600 px (320 x 180 at 16:9,
  // 180 x 320 at 9:16, 240 x 240 at 1:1) keep it under the 4 MB a README shows; --gif-fps and friends override
  gif: { fps: 8, colors: 32, width: Math.round(Math.sqrt(57600 * W / H) / 2) * 2 },
});
})();
</script>
