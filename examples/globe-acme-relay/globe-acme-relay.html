  FOCAL = F_OF();
  buildData();
  buildPlaces();
  buildLattice();
  buildStory();
  buildHud();
  placeCards();                                    // again, now that the HUD's boxes are measured
  buildSound();
  buildPlate();
  // the source line's windows: from the first number on screen to the last, merged
  const wins = [];
  for (const card of CARDS) wins.push([card.tIn, card.out + 0.13]);
  for (const r of REGIONS) if (r.stat) wins.push([r.titleIn, r.titleOut + 0.15]);
  if (TOTAL && TOTAL.count) wins.push([TOTAL.inAt, TOTAL.out + 0.25]);
  wins.sort((a, b) => a[0] - b[0]);
  for (const w of wins) { const l = SRC_WIN[SRC_WIN.length - 1]; if (l && w[0] <= l[1] + 0.6) l[1] = Math.max(l[1], w[1]); else SRC_WIN.push(w.slice()); }
  for (let i = 0; i < 64; i++) { const z = 1 - (2 * i + 1) / 64, rr = Math.sqrt(1 - z * z), lo = i * Math.PI * (3 - Math.sqrt(5)); PROBES.push([rr * Math.cos(lo), rr * Math.sin(lo), z]); }
  for (const k of ['bg', 'body', 'rim', 'rimLit', 'atmo', 'land', 'region', 'lit', 'hot', 'arc', 'white', 'beam', 'bloom', 'pin', 'leader', 'reticle', 'reticleGlow', 'busy', 'busyText', 'done', 'doneText',
    'card', 'cardEdge', 'tick', 'chip', 'chipEdge', 'text', 'query', 'number', 'accent', 'label', 'coords', 'pct', 'hudLabel', 'hudValue', 'kicker', 'bar', 'track', 'titleLo', 'titleHi', 'total',
    'statLabel', 'bracket', 'orbit', 'orbit2', 'mote', 'spark', 'streak', 'dust', 'wordmark', 'brandDim', 'tagline', 'pill', 'source']) role(k);
}

boot({
  name: 'globe',
  build,
  draw: (c, t, q) => drawFrame(c, t, q),
  accumulate, disp, checks, stills, layout, visible,
  always: true,                                    // the world turns on every frame; disp decides the subframes
  minSamples: 1,                                   // a slow drift needs one sample; a flight gets one per 5 px
  // the preview GIF: a 30 s film of moving dots is dense, so 8 fps, 32 colours and 57,600 px (320 x 180 at 16:9,
  // 180 x 320 at 9:16, 240 x 240 at 1:1) keep it under the 4 MB a README shows; --gif-fps and friends override
  gif: { fps: 8, colors: 32, width: Math.round(Math.sqrt(57600 * W / H) / 2) * 2 },
});
})();
</script>
