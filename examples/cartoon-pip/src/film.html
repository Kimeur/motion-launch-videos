<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * A cartoon is a stage and a cast. Each character is a rig (a bean body, a
 * face, rubber-hose arms, legs, an antenna, a sign) and a list of acts in
 * time order: hop, blink, look, face, wave, pose, emote, say, sign.
 * Times are seconds; beat(n) and bar(n) put them on the tempo grid.
 * Rig heights are px above the character's feet; positions are canvas px
 * of the 1080 x 1080 base, mapped into other formats by their pins, and
 * FILM.formats re-stages each format (reference/engine.md, Formats).
 * The character is drawn on twos (FILM.drawings per second, held) with a
 * three-drawing line boil; the stage behind it moves on ones.
 * A 'cycle' loop keeps moving through the seam: every act that moves a
 * value must bring it back, so the last frame flows into frame 0.
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Pip says hi',
  alt: 'A mint-green bean called Pip notices you, hops for joy, waves and says hi, then pulls a sign out of thin air: Acme Notes. Demo copy, fictional product.',
  W: 1080, H: 1080, FPS: 60, DUR: bar(5), BPM,
  loop: 'cycle',
  blur: false,                               // cartoons smear and streak instead of blurring
  drawings: 12,                              // drawings per second, each held for FPS / 12 = 5 frames
  boil: 1.6,                                 // hand-drawn line wobble in px (three drawings, then repeat)
  line: 9,                                   // outline width in px
  palette: {
    bg: '#FFC43D', rays: '#FFD36B', shadow: '#E8A11E', ink: '#2B1B3D', white: '#FFFFFF',
    mint: '#52D6A6', mintDk: '#2DB386', mintLt: '#B9F4DE', blush: '#FF93A6', coral: '#FF6B57', paper: '#FFF6E5',
  },
  fonts: {
    display: { family: 'Lilita One', weight: 400 },
    small: { family: 'Fredoka', weight: 600 },
  },
  grid: { margin: 104, unit: 8 },
  poster: beat(12),
  stage: {
    ground: 848,                             // the floor line the feet stand on
    sunburst: { x: 540, y: 500, rays: 16, color: 'rays', spin: 1 },   // spin: ray widths turned per loop (whole)
    shadow: 'shadow',                        // the floor shadow under each character
  },
  cast: [
    {
      id: 'PIP', x: 540,
      body: { w: 330, h: 350, shape: 2.5, taper: 0.1, fill: 'mint', shade: 'mintDk', light: 'mintLt' },
      legs: { len: 40, gap: 104, width: 18, foot: [50, 24] },
      eyes: { y: 280, gap: 118, rx: 40, ry: 50, pupil: 18 },
      brows: { y: 348, w: 46 },
      mouth: { y: 196, w: 100, tongue: 'coral' },
      cheeks: { y: 214, gap: 220, rx: 28, ry: 17, fill: 'blush' },
      arms: { y: 196, len: 150, width: 18, hand: 29 },
      antenna: { len: 92, ball: 21, fill: 'coral' },
      sign: { w: 520, h: 196, y: 470, text: 'ACME NOTES', cap: 76, fill: 'paper' },
      bubble: { x: -270, y: 378, w: 250, h: 150, cap: 72, fill: 'white' },
      idle: { breathe: [10, 0.018], sway: [5, 4] },   // [cycles per loop, amount]: squash breath, antenna sway in degrees
      start: { look: [-0.45, 0.1], mouth: 'smile', eyes: 'round' },
      acts: [
        { at: beat(0.5), act: 'look', x: 0, y: 0.15 },
        { at: beat(1), act: 'blink' },
        { at: beat(1.5), act: 'face', mouth: 'o', brow: 14, pop: 1.08 },
        { at: beat(1.5), act: 'emote', kind: '!', until: beat(3) },
        { id: 'JOY', at: beat(2.75), act: 'hop', h: 210, air: beat(1.5) },
        { at: beat(2.75), act: 'face', mouth: 'grin', brow: 0 },
        { at: beat(5), act: 'wave', arm: 'R', swings: 4, every: 8 },
        { at: beat(5.25), act: 'say', text: 'HI!', until: beat(7.25) },
        { at: beat(7.5), act: 'face', mouth: 'smile', eyes: 'happy' },
        { at: beat(8), act: 'sign', until: beat(15) },
        { at: beat(8.5), act: 'face', eyes: 'round', mouth: 'grin' },
        { at: beat(10), act: 'pose', dy: -24, spring: 'BOUNCY' }, { at: beat(10.5), act: 'pose', dy: 0, spring: 'BOUNCY' },
        { at: beat(11), act: 'pose', dy: -24, spring: 'BOUNCY' }, { at: beat(11.5), act: 'pose', dy: 0, spring: 'BOUNCY' },
        { at: beat(12), act: 'emote', kind: 'sparkle', until: beat(14.5) },
        { at: beat(13), act: 'blink' },
        { at: beat(15.5), act: 'hop', h: 120, air: beat(1) },
        { at: beat(17.5), act: 'face', mouth: 'smile' },
        { at: beat(17.5), act: 'look', x: -0.45, y: 0.1 },
        { at: beat(18.5), act: 'blink' },
      ],
    },
  ],
  titles: [
    { id: 'DEMO', text: 'DEMO COPY, FICTIONAL PRODUCT', font: 'small', size: 30, track: 40, anchor: 'C', x: 540, y: 960, pin: 'g', color: 'ink' },
  ],
  camera: [
    { at: beat(8.25), punch: 1.06 }, { at: beat(15), punch: 1 },
  ],
  // Other formats (render.mjs --format 9:16): the numbers above stay 1080 x 1080 px and are mapped (the ground
  // keeps its distance from the bottom, Pip's x its offset from the centre); these patches re-stage each frame.
  formats: {
    '9:16': {                                  // a bigger Pip on a raised stage, the bubble over its shoulder
      stage: { raise: 280 },
      cast: [{ id: 'PIP', scale: 1.4, bubble: { x: -170, y: 540 }, acts: [{ id: 'JOY', h: 280 }] }],
    },
    '16:9': {                                  // Pip left of centre under the rays; the bubble and the sign on the open side
      stage: { sunburst: { x: 330 } },
      cast: [{ id: 'PIP', x: 330, bubble: { x: 290 }, sign: { x: 330, y: 500, hold: 'R' } }],
    },
  },
};

/* ===== CORE BEGIN: shared/core.js, synced by tools/sync.mjs. Do not edit it here. ===== */
/* ==========================================================================
 * CORE: the deterministic runtime every motion-* engine shares.
 * Source: shared/core.js in the motion-launch-videos repo, copied into each
 * template by tools/sync.mjs. Do not edit it inside a film.
 *
 * seek(t) is a pure function of (t mod DUR): same t, same pixels, whatever was
 * drawn before. No timers, no Date, no Math.random, no state between calls.
 *   - Springs are closed-form step responses, one per target change, snapped
 *     to exactly 1 once settled. A Prop is a base value plus its springs.
 *     Springs still settling when the loop ends carry over the seam.
 *   - Periodic motion runs a whole number of cycles per loop (cyc, wave,
 *     loopNoise), so it is exact at the seam by construction.
 *   - Randomness is seeded (mulberry32, hash).
 *   - Continuous motion reads the exact t; discrete state (typing, drawings
 *     held on twos, sprite frames, line boil) reads the quantised q, so every
 *     subframe of one output frame agrees on it.
 *   - Motion blur averages 1 to 64 subframes on a trailing 270-degree
 *     shutter, one per 5 px of movement, never across a hard cut.
 * The engine below describes its vertical through hooks (build, draw, disp,
 * checks, stills, layout, visible, lastChange) and calls boot(ENGINE) last.
 * The core keeps its internals to itself and exports the helpers listed at
 * its end, so an engine can name its own functions freely.
 * ========================================================================== */
const CORE = (() => {
/* ---------------- formats: one film, several aspect ratios ---------------- */
// ?format=9x16 (the scripts pass --format 9:16) re-sizes the film before anything reads FILM. A key of
// FILM.formats patches any field for that format (objects merge, arrays of items with an id merge by id,
// anything else is replaced). Without W and H in the patch, the standard ratios keep the film's short side:
// 1:1, 4:5, 9:16, 16:9. Positions stay authored in the base format; an engine maps them with fmtX/fmtY/fmtPos,
// which keep an element's offset from the centre (the default) or from the edge its pin names.
const BW = FILM.W, BH = FILM.H;
const FORMAT = (() => { const m = /[?&]format=(\d+)[x:](\d+)/.exec(location.search); return m ? `${m[1]}:${m[2]}` : null; })();
function mergeInto(a, b) {
  for (const [k, v] of Object.entries(b)) {
    const o = a[k];
    if (Array.isArray(v) && Array.isArray(o) && v.every((x) => x && x.id != null)) {
      for (const it of v) { const t = o.find((x) => x && x.id === it.id); if (t) mergeInto(t, it); else o.push(it); }
    } else if (v && typeof v === 'object' && !Array.isArray(v) && o && typeof o === 'object' && !Array.isArray(o)) mergeInto(o, v);
    else a[k] = v;
  }
  return a;
}
if (FORMAT) {
  const patch = (FILM.formats || {})[FORMAT] || {};
  const [ra, rb] = FORMAT.split(':').map(Number), short = Math.min(BW, BH);
  if (!(ra > 0 && rb > 0)) throw new Error(`bad format ${FORMAT}`);
  const size = ra === rb ? [short, short] : ra < rb ? [short, Math.round(short * rb / ra / 2) * 2] : [Math.round(short * ra / rb / 2) * 2, short];
  mergeInto(FILM, { W: size[0], H: size[1], ...patch });
}
const { W, H, FPS, DUR } = FILM;
const NFR = Math.round(DUR * FPS);                 // output frames in the loop
const CX = W / 2, CY = H / 2;
const U = Math.min(W, H) / 1080;                   // scale for built-in pixel constants
const PAL = FILM.palette;
const USED = new Set();                            // palette roles the film draws with
const col = (k) => PAL[k] || k;                    // look a role up (while drawing)
const role = (k) => { USED.add(k); return PAL[k] || k; };   // resolve and register a role (at build time)
const GRID = FILM.grid || {};
const MARGIN = GRID.margin != null ? GRID.margin : Math.round(104 * U);
const UNIT = GRID.unit || 8;
const MEASURE = W - 2 * MARGIN;
const FS = Math.min(W, H) / Math.min(BW, BH);      // base px -> this format's px
const FMT = { key: FORMAT || `${BW}x${BH}`, W, H, BW, BH, s: FS, aspect: W === H ? 'square' : W < H ? 'vertical' : 'horizontal' };
// pin: 'l' or 'r' keeps the distance from that edge, 't' or 'b' likewise; otherwise the offset from the centre
const fmtX = (x, pin = '') => /l/.test(pin) ? x * FS : /r/.test(pin) ? W - (BW - x) * FS : W / 2 + (x - BW / 2) * FS;
const fmtY = (y, pin = '') => /t/.test(pin) ? y * FS : /b/.test(pin) ? H - (BH - y) * FS : H / 2 + (y - BH / 2) * FS;
const fmtPos = (x, y, pin = '') => [fmtX(x, pin), fmtY(y, pin)];
const fmtSz = (v) => v * FS;
const LOOP = FILM.loop || 'hold';                  // 'hold': ends on a still copy of frame 0; 'cycle': periodic, continuous over the seam; 'none'
const BLUR = FILM.blur !== false;                  // false: one sample per frame (cartoon, pixel art)
const SHUTTER = 0.75;                              // 270 degrees, trailing
const MIN_SAMPLES = 4, MAX_SAMPLES = 64, PX_PER_SAMPLE = 5;   // Uint16 sums hold up to 257 x 255
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', FILM.alt || FILM.title || '');
if (FILM.title) document.title = FILM.title;
document.documentElement.style.background = PAL.bg;
document.body.style.background = PAL.bg;
// CPU raster everywhere: Chrome moves a canvas from GPU to CPU after repeated getImageData
// reads, which changes antialiasing mid-render. Pin every 2D context from its first call.
// An alpha channel, though every frame fills it opaque: on an opaque canvas Chromium draws text with
// LCD subpixel antialiasing (red and blue fringes on every glyph), whatever the command line says.
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: true });
const mkCanvas = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const mk2d = (w, h) => { const c = mkCanvas(w, h); return [c, c.getContext('2d', { willReadFrequently: true })]; };
const mctx = mkCanvas().getContext('2d', { willReadFrequently: true });   // measuring only

/* ---------------- springs: closed-form step responses ---------------- */
// [zeta, omega]. Underdamped (zeta < 1) overshoots and lands; zeta = 1 glides in without overshoot.
// Engines add their own (boot merges ENGINE.springs, then FILM.springs).
const SP = {
  SLAM: [0.60, 30.0], LAND: [0.72, 28.0], PUNCH: [0.65, 31.0], FADE: [1, 32.4],
  FOCUS: [1, 19.5], EXIT: [1, 32.4], PAN: [1, 32.4], DRAW: [1, 32.4],
  LINE: [0.80, 15.6], MASK: [1, 19.5], TICK: [1, 32.4],
};
const spring = (sp) => { const s = typeof sp === 'string' ? SP[sp] : sp; if (!s) throw new Error(`unknown spring ${sp}`); return s; };
const settle = (sp) => 16 / (sp[0] * sp[1]);       // after this the response snaps to exactly 1
function S(tau, sp) {
  const z = sp[0], w = sp[1];
  if (tau <= 0) return 0;
  if (tau >= settle(sp)) return 1;                 // residual < 2e-6 of the move: snap, so loops are bit-exact
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
  }
  return 1 - (1 + w * tau) * Math.exp(-w * tau);
}
function dS(tau, sp) {                             // d S / d tau, per second
  const z = sp[0], w = sp[1];
  if (tau <= 0 || tau >= settle(sp)) return 0;
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (w * w / wd) * Math.exp(-z * w * tau) * Math.sin(wd * tau); }
  return w * w * tau * Math.exp(-w * tau);
}
// the visible landing: the first crossing of the target when underdamped, 95 % when critically damped
function landT(sp) {
  sp = spring(sp);
  const z = sp[0], w = sp[1];
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return (Math.PI - Math.atan(wd / (z * w))) / wd; }
  let a = 0, b = settle(sp);
  for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (S(m, sp) < 0.95) a = m; else b = m; }
  return b;
}

// A property = base value + one spring per target change (superposed). set() is an instant jump
// that cancels earlier springs; use it only while the element is invisible, at a hard cut, or hidden
// inside fast motion blur. Events are added in time order. In a looping film, springs still settling
// at the end of the loop carry over the seam into its start (only while no set() has happened yet),
// so the film is continuous there; the value a Prop ends on must equal the value it starts from.
const PROPS = [];
class Prop {
  constructor(v0, name) { this.v0 = v0; this.last = v0; this.ev = []; this.tLast = -Infinity; this.name = name || '?'; this.tail = null; this.firstSet = Infinity; PROPS.push(this); }
  order(t) { if (t < this.tLast - 1e-9) throw new Error(`${this.name}: event at ${t} added after one at ${this.tLast}`); this.tLast = t; this.tail = null; }
  to(t, v, sp) { this.order(t); this.ev.push({ t, d: v - this.last, sp: spring(sp), set: false }); this.last = v; return this; }
  set(t, v) { this.order(t); this.ev.push({ t, v, set: true }); this.last = v; return this; }
  seam() {                                         // the springs that carry over the seam
    if (this.tail) return this.tail;
    let k = -1;
    this.firstSet = Infinity;
    for (let i = 0; i < this.ev.length; i++) if (this.ev[i].set) { k = i; if (this.firstSet === Infinity) this.firstSet = this.ev[i].t; }
    this.tail = LOOP === 'none' ? [] : this.ev.slice(k + 1).filter((e) => e.d !== 0 && e.t + settle(e.sp) > DUR);
    return this.tail;
  }
  at(t) {
    let v = this.v0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) { v = ev[i].v; i0 = i + 1; }
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * S(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * (S(t + DUR - e.t, e.sp) - 1);
    return v;
  }
  vel(t) {                                         // per second
    let v = 0, i0 = 0;
    const ev = this.ev;
    for (let i = 0; i < ev.length; i++) if (ev[i].set && ev[i].t <= t) i0 = i + 1;
    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * dS(t - e.t, e.sp); }
    const tail = this.seam();
    if (tail.length && t < this.firstSet) for (const e of tail) v += e.d * dS(t + DUR - e.t, e.sp);
    return v;
  }
  active(a, b) {                                   // does the value change anywhere in (a, b]?
    for (const e of this.ev) {
      if (e.set) { if (e.t > a && e.t <= b) return true; }
      else if (e.d !== 0 && e.t < b && e.t + settle(e.sp) > a) return true;
    }
    if (a < this.firstSet) for (const e of this.seam()) if (e.t - DUR < b && e.t - DUR + settle(e.sp) > a) return true;
    return false;
  }

}

/* ---------------- periodic motion and seeded randomness ---------------- */
// n whole cycles per loop: exact at the seam by construction. Use these for anything that never stops
// (an idle bob, a spin, a drifting field) and set ENGINE.always, or declare its windows with activeIn.
const cyc = (t, n, phase = 0) => TAU * (n * t / DUR + phase);

    a |= 0; a = (a + 0x6D2B79F5) | 0;

// three integers to [0, 1), well mixed: a pure replacement for Math.random keyed by what it decides
function hash(a, b = 0, c = 0) {
  let h = Math.imul((a | 0) ^ 0x3C6EF372, 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13) ^ (b | 0), 0xC2B2AE35);
  h = Math.imul(h ^ (h >>> 16) ^ (c | 0), 0x27D4EB2F);

function shuffled(arr, seed) {                     // Fisher-Yates on a copy, seeded
  const r = mulberry32(seed), a = arr.slice();

  return a;
}

/* ---------------- time ---------------- */
const wrapT = (t) => ((t % DUR) + DUR) % DUR;
const frameOf = (t) => Math.ceil(t * FPS - 1e-9);  // all subframes of output frame n map to n
const typed = (q, ts, n) => Math.max(0, Math.min(n, Math.ceil((q - ts) * FPS - 1e-6)));   // one character per frame
const noteSec = (v) => (typeof v === 'number' && v >= 1 ? 4 * 60 / FILM.BPM / v : v);     // 16 -> a 16th note
const drawing = (q, fps) => Math.floor(q * fps + 1e-6);    // index of the held drawing (12 fps = on twos at 24, fives at 60)

/* ---------------- colour ---------------- */
function rgbOf(hex) { const h = String(hex).replace('#', ''); const n = parseInt(h.length === 3 ? h.replace(/./g, '$&$&') : h.slice(0, 6), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

  const R = rigAt(Ch, td), B = Ch.spec.body, top = Ch.legLen + B.h + (Ch.spec.antenna ? Ch.spec.antenna.len + Ch.spec.antenna.ball : 0);
  const pts = [[-B.w / 2 - 60, 0], [B.w / 2 + 60, 0], [-B.w / 2 - 60, -top], [B.w / 2 + 60, -top]].map(([a, b]) => R.T(a, b));
  return [Math.min(...pts.map((p) => p[0])), Math.min(...pts.map((p) => p[1])), Math.max(...pts.map((p) => p[0])), Math.max(...pts.map((p) => p[1]))];
}
function signBox(Ch, td) {                            // the board held up, at full size
  const Sg = Ch.spec.sign, R = rigAt(Ch, td), cx = Sg.x || 0, cy = -Sg.y;
  const pts = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([a, b]) => R.T(cx + a * Sg.w / 2, cy + b * Sg.h / 2));
  return [Math.min(...pts.map((p) => p[0])), Math.min(...pts.map((p) => p[1])), Math.max(...pts.map((p) => p[0])), Math.max(...pts.map((p) => p[1]))];
}
function visible(t) {
  const td = drawing(frameOf(t) / FPS, DRAW_FPS) / DRAW_FPS;
  if (TITLES.length) return true;
  for (const Ch of CAST) { const b = charBox(Ch, td); if (b[2] > 0 && b[0] < W && b[3] > 0 && b[1] < H) return true; }
  return false;
}
function checks(add) {
  const hold = FPS / DRAW_FPS;
  add('drawings', Math.abs(hold - Math.round(hold)) < 1e-9 ? 'PASS' : 'WARN', `${DRAW_FPS} drawings a second: each held ${+hold.toFixed(3)} frames${Math.abs(hold - Math.round(hold)) < 1e-9 ? '' : ' (uneven holds judder; use a divisor of the frame rate)'}`);
  for (const Ch of CAST) {
    checkLiveArea(add, `${Ch.id} at rest`, charBox(Ch, 0), false);
    if (Ch.signs.length) checkLiveArea(add, `${Ch.id} sign`, signBox(Ch, Ch.signs[0].t + 1.2), false);
    if (Ch.says.length) { const Bb = Ch.spec.bubble, K = Ch.k; checkLiveArea(add, `${Ch.id} bubble`, [Ch.bx - Bb.w / 2 * K, Ch.by - Bb.h / 2 * K, Ch.bx + Bb.w / 2 * K, Ch.by + Bb.h / 2 * K], false); }
    const f0 = Ch.face[0], fl = faceAt(Ch, DUR);
    add(`loop face: ${Ch.id}`, LOOP !== 'cycle' || (f0.mouth === fl.mouth && f0.eyes === fl.eyes) ? 'PASS' : 'FAIL', `starts ${f0.mouth}/${f0.eyes}, ends ${fl.mouth}/${fl.eyes}${LOOP === 'cycle' && (f0.mouth !== fl.mouth || f0.eyes !== fl.eyes) ? ': the face snaps at the loop point; end on the starting face' : ''}`);
    for (const h of Ch.hops) {
      if (h.t - 0.16 < 0 || h.land > DUR - 0.05) add(`hop: ${Ch.id} at ${h.t.toFixed(2)}`, 'WARN', 'a hop straddles the loop point; its arc is not carried over the seam');
      const apex = lift(Ch, h.t + h.air / 2), box = charBox(Ch, h.t + h.air / 2);
      if (box[1] < 0) add(`hop: ${Ch.id} at ${h.t.toFixed(2)}`, 'WARN', `the head leaves the frame at the top of the hop (${apex.toFixed(0)} px up)`);
    }
    for (const w of Ch.walks) if (w.t < 0 || w.end > DUR - 0.05) add(`walk: ${Ch.id} at ${w.t.toFixed(2)}`, 'WARN', 'a walk straddles the loop point; its stride is not carried over the seam');
    for (const s of Ch.says) { const words = s.text.split(/\s+/).filter(Boolean).length; add(`words: ${Ch.id} says`, words > 4 ? 'FAIL' : 'PASS', `${words} (${s.text})`); }
    if (Ch.spec.sign) { const words = Ch.spec.sign.text.split(/\s+/).filter(Boolean).length; add(`words: ${Ch.id} sign`, words > 4 ? 'FAIL' : 'PASS', `${words} (${Ch.spec.sign.text})`); }
    const E = Ch.spec.eyes;
    if (E.pupil * 2 > Math.min(E.rx, E.ry) * 1.4) add(`eyes: ${Ch.id}`, 'WARN', 'pupils nearly fill the eyes: the look direction will not read');
  }
  for (const T0 of TITLES) {
    checkLiveArea(add, T0.id, [T0.line.inkL, T0.line.top, T0.line.inkR, T0.line.bottom], T0.bleed);
    if (T0.line.baseline % UNIT) add(`grid: ${T0.id}`, 'WARN', `baseline ${T0.line.baseline} is not on the ${UNIT} px grid`);
  }
}
function cycles() {
  const out = [{ what: `line boil (3 drawings at ${DRAW_FPS} a second)`, period: 3 / DRAW_FPS }, { what: 'drawings', period: 1 / DRAW_FPS }];
  if (STAGE.sunburst && STAGE.sunburst.spin) out.push({ what: 'sunburst spin', period: DUR / STAGE.sunburst.spin });
  for (const Ch of CAST) { const I = Ch.spec.idle || {}; if (I.breathe) out.push({ what: `${Ch.id} breath`, period: DUR / I.breathe[0] }); if (I.sway) out.push({ what: `${Ch.id} antenna sway`, period: DUR / I.sway[0] }); }
  return out;
}
function stills(push) {
  for (const Ch of CAST) {
    for (const h of Ch.hops) { push((h.t - 0.08) * FPS, `${Ch.id}-anticipation`, 'squash before the hop'); push((h.t + h.air * 0.25) * FPS, `${Ch.id}-stretch`, 'stretched on the way up'); push((h.land + 0.05) * FPS, `${Ch.id}-impact`, 'squash on landing'); }
    for (const w of Ch.walks) push((w.t + w.every * 1.5) * FPS, `${Ch.id}-walk`, 'mid-stride');
    for (const s of Ch.says) push((s.t + 0.5) * FPS, `${Ch.id}-says`, `says ${s.text}`);
    for (const s of Ch.signs) push((s.t + 1.2) * FPS, `${Ch.id}-sign`, 'holding the sign');
    for (const e of Ch.emotes) push((e.t + 0.3) * FPS, `${Ch.id}-${e.kind}`, `emote ${e.kind}`);
  }
}
function layout() {
  return { cast: CAST.map((Ch) => ({ id: Ch.id, box: charBox(Ch, 0).map((v) => Math.round(v)), hops: Ch.hops.map((h) => ({ at: h.t, land: +h.land.toFixed(3), height: h.h })), sign: Ch.signLine ? { text: Ch.signLine.text, size: Math.round(Ch.signLine.size) } : null })),
    titles: TITLES.map((T0) => ({ id: T0.id, box: [T0.line.inkL, T0.line.top, T0.line.inkR, T0.line.bottom].map((v) => Math.round(v)), size: T0.line.size })) };
}

function build() {
  (FILM.cast || []).forEach((spec, i) => CAST.push(buildCharacter(spec, i)));
  for (const T0 of FILM.titles || []) {
    const pin = T0.pin || '', y = /g/.test(pin) ? onGround(T0.y) : fmtY(T0.y, pin);   // 'g': its height above the ground
    const line = layoutText({ id: T0.id, text: T0.text, font: T0.font || 'display', size: T0.size != null ? fmtSz(T0.size) : undefined, cap: T0.cap != null ? fmtSz(T0.cap) : undefined,
      fit: T0.fit, track: T0.track, anchor: T0.anchor || 'C', x: T0.x != null ? fmtX(T0.x, pin) : undefined, baseline: y });
    role(T0.color || 'ink');
    TITLES.push({ ...T0, line, color: T0.color || 'ink' });
    needContrast(T0.id, T0.color || 'ink', T0.on || 'bg', (T0.size || 99) < 40 ? 4.5 : 3);
  }
  if (STAGE.sunburst) {                                // its centre keeps its height above the ground, unless it has a pin
    const sb = STAGE.sunburst;
    role(sb.color || 'rays');
    SUN = [fmtX(sb.x, sb.pin), sb.pin != null ? fmtY(sb.y, sb.pin) : onGround(sb.y)];
  }
  role(STAGE.shadow || 'shadow');
  camZ = new Prop(1, 'camera.z');
  for (const k of (FILM.camera || []).slice().sort((a, b) => a.at - b.at)) if (k.punch != null) camZ.to(k.at, k.punch, k.spring || 'PUNCH');
}

boot({
  name: 'cartoon',
  backdrop: [...new Set([STAGE.sunburst && (STAGE.sunburst.color || 'rays'), STAGE.shadow || 'shadow'].filter(Boolean))],   // the stage fills the frame: not composition
  springs: { SNAP: [0.7, 38], POP: [0.42, 20], BOUNCY: [0.32, 16], SWING: [0.5, 14], GLIDE: [1, 12] },
  always: true,
  gif: { fps: DRAW_FPS <= 25 && FPS % DRAW_FPS === 0 ? DRAW_FPS : 20,   // one GIF frame per drawing,
    width: Math.round(480 * Math.sqrt(W / H) / 2) * 2 },                 // as many pixels as 480 x 480 in any format
  build, draw: (c, t, q) => drawFrame(c, t, q), checks, cycles, stills, layout, visible,
});
})();
</script>
</body>
