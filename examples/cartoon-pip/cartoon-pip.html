<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * A cartoon is a stage and a cast. Each character is a rig (a bean body, a
 * face, rubber-hose arms, legs, an antenna, a sign) and a list of acts in
 * time order: hop, blink, look, face, wave, pose, emote, say, sign.
 * Times are seconds; beat(n) and bar(n) put them on the tempo grid.
 * Rig heights are px above the character's feet; positions are canvas px.
 * The character is drawn on twos (FILM.drawings per second, held) with a
 * three-drawing line boil; the stage behind it moves on ones.
 * A 'cycle' loop keeps moving through the seam: every act that moves a
 * value must bring it back, so the last frame flows into frame 0.
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Pip says hi',
  alt: 'A mint-green bean called Pip notices you, hops for joy, waves and says hi, then pulls a sign out of thin air: Acme Notes. Demo copy, fictional product.',
  W: 1080, H: 1080, FPS: 60, DUR: bar(5), BPM,
  loop: 'cycle',
  blur: false,                               // cartoons smear and streak instead of blurring
  drawings: 12,                              // drawings per second, each held for FPS / 12 = 5 frames
  boil: 1.6,                                 // hand-drawn line wobble in px (three drawings, then repeat)
  line: 9,                                   // outline width in px

/* ==========================================================================
 * CORE: the deterministic runtime every motion-* engine shares.
 * Source: shared/core.js in the motion-launch-videos repo, copied into each
 * template by tools/sync.mjs. Do not edit it inside a film.
 *
 * seek(t) is a pure function of (t mod DUR): same t, same pixels, whatever was
 * drawn before. No timers, no Date, no Math.random, no state between calls.
 *   - Springs are closed-form step responses, one per target change, snapped
 *     to exactly 1 once settled. A Prop is a base value plus its springs.
 *     Springs still settling when the loop ends carry over the seam.
 *   - Periodic motion runs a whole number of cycles per loop (cyc, wave,
 *     loopNoise), so it is exact at the seam by construction.
 *   - Randomness is seeded (mulberry32, hash).
 *   - Continuous motion reads the exact t; discrete state (typing, drawings
 *     held on twos, sprite frames, line boil) reads the quantised q, so every
 *     subframe of one output frame agrees on it.
 *   - Motion blur averages 1 to 64 subframes on a trailing 270-degree
 *     shutter, one per 5 px of movement, never across a hard cut.
 * The engine below describes its vertical through hooks (build, draw, disp,
 * checks, stills, layout, visible, lastChange) and calls boot(ENGINE) last.
 * The core keeps its internals to itself and exports the helpers listed at
 * its end, so an engine can name its own functions freely.
 * ========================================================================== */
const CORE = (() => {

const PAL = FILM.palette;
const USED = new Set();                            // palette roles the film draws with
const col = (k) => PAL[k] || k;                    // look a role up (while drawing)

const GRID = FILM.grid || {};

const LOOP = FILM.loop || 'hold';                  // 'hold': ends on a still copy of frame 0; 'cycle': periodic, continuous over the seam; 'none'
const BLUR = FILM.blur !== false;                  // false: one sample per frame (cartoon, pixel art)
const SHUTTER = 0.75;                              // 270 degrees, trailing
const MIN_SAMPLES = 4, MAX_SAMPLES = 64, PX_PER_SAMPLE = 5;   // Uint16 sums hold up to 257 x 255
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');

canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', FILM.alt || FILM.title || '');
if (FILM.title) document.title = FILM.title;

/* ---------------- springs: closed-form step responses ---------------- */
// [zeta, omega]. Underdamped (zeta < 1) overshoots and lands; zeta = 1 glides in without overshoot.
// Engines add their own (boot merges ENGINE.springs, then FILM.springs).
const SP = {

    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * S(t - e.t, e.sp); }

    for (let i = i0; i < ev.length; i++) { const e = ev[i]; if (!e.set) v += e.d * dS(t - e.t, e.sp); }

}

/* ---------------- periodic motion and seeded randomness ---------------- */
// n whole cycles per loop: exact at the seam by construction. Use these for anything that never stops

/* ---------------- time ---------------- */
const wrapT = (t) => ((t % DUR) + DUR) % DUR;

  const rect = (w, h) => { const out = [], n = 10, r = 26; for (const [x0, y0, x1, y1] of [[-w / 2 + r, -h / 2, w / 2 - r, -h / 2], [w / 2, -h / 2 + r, w / 2, h / 2 - r], [w / 2 - r, h / 2, -w / 2 + r, h / 2], [-w / 2, h / 2 - r, -w / 2, -h / 2 + r]]) for (let i = 0; i < n; i++) out.push([x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n]); return out; };
  const place = ([a, b]) => { const rot = wob * DEG; return T(cx + k * (a * Math.cos(rot) - b * Math.sin(rot)), cy + k * (a * Math.sin(rot) + b * Math.cos(rot))); };
  const board = smoothPath(boilPts(rect(Sg.w, Sg.h).map(place), seed + 100, dn, BOIL), true);
  inked(c, board, col(Sg.fill || 'paper'), LINE);
  const L = Ch.signLine, base = L.capH / 2;
  const sgn = Ch.signs.find((s) => td >= s.t - 1e-9 && td < s.until + 0.6) || Ch.signs[0];
  c.save();
  const o = T(cx, cy), m = [R.sx * k * Math.cos(R.lean), R.sx * k * Math.sin(R.lean), -R.sy * k * Math.sin(R.lean), R.sy * k * Math.cos(R.lean)];
  c.transform(m[0], m[1], m[2], m[3], o[0], o[1]); c.rotate(wob * DEG);
  setFont(c, L.font);
  let slot = 0;
  for (const g of L.glyphs) {                      // each letter pops onto the board on a 16th, stretching up then settling
    if (g.space) continue;
    const t0 = sgn.t + 0.2 + noteSec(16) * slot++, tau = td - t0;
    if (tau < 0) continue;
    const k = S(tau, spring('POP')), sy = k * (1 + 0.35 * Math.max(0, 1 - k)), sx = k / Math.sqrt(Math.max(0.2, sy / Math.max(k, 1e-3)));
    if (k < 0.02) continue;
    const jx = (hash(seed + 110, g.i, dn % 3) - 0.5) * BOIL, jy = (hash(seed + 111, g.i, dn % 3) - 0.5) * BOIL;
    c.save(); c.translate((g.inkL + g.inkR) / 2 + jx, base + jy); c.scale(sx, sy);
    c.fillStyle = col('ink'); c.fillText(g.ch, g.x - (g.inkL + g.inkR) / 2, 0);
    c.restore();
  }
  c.restore();
}
function drawBubble(c, Ch, R, td, dn, seed) {        // a speech bubble growing from its tail
  const Bb = Ch.spec.bubble, k = Math.max(0, R.bub), T = R.T;
  const tail = T(-Ch.spec.body.w * 0.2, -(Ch.spec.mouth.y + 40));
  const bx = Bb.x, by = Bb.y, ox = (bx - tail[0]), oy = (by - tail[1]);
  const pts = ellipsePts(0, 0, Bb.w / 2, Bb.h / 2, 36);
  const ti = pts.reduce((bi, p, i) => (Math.hypot(p[0] + ox, p[1] + oy) < Math.hypot(pts[bi][0] + ox, pts[bi][1] + oy) ? i : bi), 0);
  const withTail = pts.slice(0, ti).concat([[-ox * 0.9, -oy * 0.9]], pts.slice(ti + 1));
  const place = ([a, b]) => [tail[0] + (ox + a) * k, tail[1] + (oy + b) * k];
  inked(c, smoothPath(boilPts(withTail.map(place), seed + 120, dn, BOIL), true), col(Bb.fill || 'white'), LINE);
  const s = Ch.says.find((q) => td >= q.t - 1e-9 && td < q.until + 0.6) || Ch.says[0], L = Ch.sayLines[Ch.says.indexOf(s)];
  c.save(); c.translate(tail[0] + ox * k, tail[1] + oy * k); c.scale(k, k);
  setFont(c, L.font); c.fillStyle = col('ink');
  for (const g of L.glyphs) if (!g.space) c.fillText(g.ch, g.x + (hash(seed + 130, g.i, dn % 3) - 0.5) * BOIL, L.capH / 2 + (hash(seed + 131, g.i, dn % 3) - 0.5) * BOIL);
  c.restore();
}
function drawEmote(c, Ch, R, e, td, dn, seed) {
  const pop = S(td - e.t, spring('POP')) - S(td - e.until, spring('EXIT'));
  if (pop <= 0.01) return;
  const top = R.T(0, -(Ch.legLen + Ch.spec.body.h + (Ch.spec.antenna ? Ch.spec.antenna.len : 0) + 40));
  if (e.kind === '!' || e.kind === '?') {
    const L = Ch.emoteLine[e.kind], x = top[0] + 150 * U, y = top[1] + 60 * U, wob = 10 * ring(td, e.t, [0.3, 16]) * DEG;
    c.save(); c.translate(x, y); c.rotate(0.18 + wob); c.scale(pop, pop);
    setFont(c, L.font); c.lineJoin = 'round'; c.lineWidth = LINE * 1.4; c.strokeStyle = col('ink'); c.fillStyle = Ch.tongue;
    for (const g of L.glyphs) { c.strokeText(g.ch, g.x, L.capH / 2); c.fillText(g.ch, g.x, L.capH / 2); }
    c.restore();
  } else if (e.kind === 'sparkle') {                // four-point stars popping round the head, twinkling on the beat
    const spots = [[-230, -40], [240, -90], [-170, -250], [190, -300]];
    spots.forEach(([dx, dy], i) => {
      const t0 = e.t + i * noteSec(8), k = (S(td - t0, spring('POP')) - S(td - e.until - i * 0.06, spring('EXIT'))) * (1 + 0.18 * Math.sin(cyc(td, 20, i * 0.25)));
      if (k <= 0.01) return;
      const p = starPts(top[0] + dx * U, top[1] + 280 * U + dy * U, 34 * U * k, 0.34, 4, 0);
      inked(c, smoothPath(boilPts(p, seed + 140 + i, dn, BOIL * 0.3), true), col('white'), LINE * 0.8);
    });
  } else if (e.kind === 'heart') {
    const x = top[0] + 150 * U, y = top[1] + 60 * U, pts = [];
    for (let i = 0; i < 32; i++) { const a = TAU * i / 32; pts.push([x + pop * 44 * U * 16 * Math.pow(Math.sin(a), 3) / 16, y - pop * 44 * U * (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 16]); }
    inked(c, smoothPath(boilPts(pts, seed + 150, dn, BOIL * 0.5), true), col('coral'), LINE);
  }
}
function drawDust(c, fx, td, dn) {                    // puffs rolling out from the feet, shrinking away
  const tau = td - fx.t;
  if (tau < 0 || tau > 0.7) return;
  const R = rigAt(fx.ch, fx.t), k = tau / 0.7;
  for (let i = 0; i < 6; i++) {
    const s = i % 2 ? 1 : -1, j = Math.floor(i / 2);
    const r = (26 + 10 * j) * U * fx.amp * (1 - k) * Math.min(1, tau * 14);
    if (r < 1) continue;
    const x = R.x + s * (fx.ch.spec.body.w * 0.3 + (60 + 70 * j) * k * U), y = GROUND - (8 + 26 * j * k + 16 * k) * U;
    inked(c, smoothPath(boilPts(ellipsePts(x, y, r, r * 0.86, 16), 0x2000 + i, dn, BOIL * 0.4), true), col('white'), LINE * 0.8);
  }
}

/* ---------------- the stage and the frame ---------------- */
function drawSunburst(c, t) {                         // rays turning a whole number of ray widths per loop
  const sb = STAGE.sunburst;
  if (!sb) return;
  const n = sb.rays || 16, rot = TAU / n * (sb.spin || 0) * t / DUR, R = Math.hypot(W, H);
  c.fillStyle = col(sb.color || 'rays');
  c.beginPath();
  for (let k = 0; k < n; k++) { const a0 = rot + TAU * k / n, a1 = a0 + TAU / n / 2; c.moveTo(sb.x, sb.y); c.lineTo(sb.x + R * Math.cos(a0), sb.y + R * Math.sin(a0)); c.lineTo(sb.x + R * Math.cos(a1), sb.y + R * Math.sin(a1)); c.closePath(); }
  c.fill();
}
function cameraAt(td) {
  let dx = 0, dy = 0;
  for (const s of SHAKES) {                           // a shake on twos: a new offset each drawing, dying away
    let tau = td - s.t; if (tau < 0 && LOOP === 'cycle') tau += DUR;
    if (tau < 0 || tau > 0.45) continue;
    const k = Math.exp(-tau / 0.12), n = drawing(td, DRAW_FPS);
    dx += s.amp * k * (hash(0x5AC, n, 1) - 0.5) * 2; dy += s.amp * k * (hash(0x5AC, n, 2) - 0.5) * 2;
  }
  return { z: camZ.at(td), dx, dy };
}
function drawFrame(c, t, q) {
  const dn = drawing(q, DRAW_FPS), td = dn / DRAW_FPS;
  const cam = cameraAt(td);
  c.save();
  c.translate(CX + cam.dx, CY + cam.dy); c.scale(cam.z, cam.z); c.translate(-CX, -CY);
  drawSunburst(c, t);
  for (const Ch of CAST) drawShadow(c, Ch, rigAt(Ch, td));
  for (const fx of EFFECTS) if (fx.kind === 'dust') drawDust(c, fx, td, dn);
  for (const Ch of CAST) drawCharacter(c, Ch, td, dn);
  c.restore();
  for (const T0 of TITLES) {                          // titles sit still over the stage
    c.fillStyle = col(T0.color); setFont(c, T0.line.font);
    for (const g of T0.line.glyphs) if (!g.space) c.fillText(g.ch, g.x, T0.line.baseline);
  }
}

/* ---------------- analysis ---------------- */
function charBox(Ch, td) {                            // the character's box on the canvas
  const R = rigAt(Ch, td), B = Ch.spec.body, top = Ch.legLen + B.h + (Ch.spec.antenna ? Ch.spec.antenna.len + Ch.spec.antenna.ball : 0);
  const pts = [[-B.w / 2 - 60, 0], [B.w / 2 + 60, 0], [-B.w / 2 - 60, -top], [B.w / 2 + 60, -top]].map(([a, b]) => R.T(a, b));
  return [Math.min(...pts.map((p) => p[0])), Math.min(...pts.map((p) => p[1])), Math.max(...pts.map((p) => p[0])), Math.max(...pts.map((p) => p[1]))];
}
function visible(t) {
  const td = drawing(frameOf(t) / FPS, DRAW_FPS) / DRAW_FPS;
  if (TITLES.length) return true;
  for (const Ch of CAST) { const b = charBox(Ch, td); if (b[2] > 0 && b[0] < W && b[3] > 0 && b[1] < H) return true; }
  return false;
}
function checks(add) {
  const hold = FPS / DRAW_FPS;
  add('drawings', Math.abs(hold - Math.round(hold)) < 1e-9 ? 'PASS' : 'WARN', `${DRAW_FPS} drawings a second: each held ${+hold.toFixed(3)} frames${Math.abs(hold - Math.round(hold)) < 1e-9 ? '' : ' (uneven holds judder; use a divisor of the frame rate)'}`);
  for (const Ch of CAST) {
    checkLiveArea(add, `${Ch.id} at rest`, charBox(Ch, 0), false);
    const f0 = Ch.face[0], fl = faceAt(Ch, DUR);
    add(`loop face: ${Ch.id}`, LOOP !== 'cycle' || (f0.mouth === fl.mouth && f0.eyes === fl.eyes) ? 'PASS' : 'FAIL', `starts ${f0.mouth}/${f0.eyes}, ends ${fl.mouth}/${fl.eyes}${LOOP === 'cycle' && (f0.mouth !== fl.mouth || f0.eyes !== fl.eyes) ? ': the face snaps at the loop point; end on the starting face' : ''}`);
    for (const h of Ch.hops) {
      if (h.t - 0.16 < 0 || h.land > DUR - 0.05) add(`hop: ${Ch.id} at ${h.t.toFixed(2)}`, 'WARN', 'a hop straddles the loop point; its arc is not carried over the seam');
      const apex = lift(Ch, h.t + h.air / 2), box = charBox(Ch, h.t + h.air / 2);
      if (box[1] < 0) add(`hop: ${Ch.id} at ${h.t.toFixed(2)}`, 'WARN', `the head leaves the frame at the top of the hop (${apex.toFixed(0)} px up)`);
    }
    for (const s of Ch.says) { const words = s.text.split(/\s+/).filter(Boolean).length; add(`words: ${Ch.id} says`, words > 4 ? 'FAIL' : 'PASS', `${words} (${s.text})`); }
    if (Ch.spec.sign) { const words = Ch.spec.sign.text.split(/\s+/).filter(Boolean).length; add(`words: ${Ch.id} sign`, words > 4 ? 'FAIL' : 'PASS', `${words} (${Ch.spec.sign.text})`); }
    const E = Ch.spec.eyes;
    if (E.pupil * 2 > Math.min(E.rx, E.ry) * 1.4) add(`eyes: ${Ch.id}`, 'WARN', 'pupils nearly fill the eyes: the look direction will not read');
  }
  for (const T0 of TITLES) {
    checkLiveArea(add, T0.id, [T0.line.inkL, T0.line.top, T0.line.inkR, T0.line.bottom], T0.bleed);
    if (T0.line.baseline % UNIT) add(`grid: ${T0.id}`, 'WARN', `baseline ${T0.line.baseline} is not on the ${UNIT} px grid`);
  }
}
function cycles() {
  const out = [{ what: `line boil (3 drawings at ${DRAW_FPS} a second)`, period: 3 / DRAW_FPS }, { what: 'drawings', period: 1 / DRAW_FPS }];
  if (STAGE.sunburst && STAGE.sunburst.spin) out.push({ what: 'sunburst spin', period: DUR / STAGE.sunburst.spin });
  for (const Ch of CAST) { const I = Ch.spec.idle || {}; if (I.breathe) out.push({ what: `${Ch.id} breath`, period: DUR / I.breathe[0] }); if (I.sway) out.push({ what: `${Ch.id} antenna sway`, period: DUR / I.sway[0] }); }
  return out;
}
function stills(push) {
  for (const Ch of CAST) {
    for (const h of Ch.hops) { push((h.t - 0.08) * FPS, `${Ch.id}-anticipation`, 'squash before the hop'); push((h.t + h.air * 0.25) * FPS, `${Ch.id}-stretch`, 'stretched on the way up'); push((h.land + 0.05) * FPS, `${Ch.id}-impact`, 'squash on landing'); }
    for (const s of Ch.says) push((s.t + 0.5) * FPS, `${Ch.id}-says`, `says ${s.text}`);
    for (const s of Ch.signs) push((s.t + 1.2) * FPS, `${Ch.id}-sign`, 'holding the sign');
    for (const e of Ch.emotes) push((e.t + 0.3) * FPS, `${Ch.id}-${e.kind}`, `emote ${e.kind}`);
  }
}
function layout() {
  return { cast: CAST.map((Ch) => ({ id: Ch.id, box: charBox(Ch, 0).map((v) => Math.round(v)), hops: Ch.hops.map((h) => ({ at: h.t, land: +h.land.toFixed(3), height: h.h })), sign: Ch.signLine ? { text: Ch.signLine.text, size: Math.round(Ch.signLine.size) } : null })),
    titles: TITLES.map((T0) => ({ id: T0.id, box: [T0.line.inkL, T0.line.top, T0.line.inkR, T0.line.bottom].map((v) => Math.round(v)), size: T0.line.size })) };
}

function build() {
  (FILM.cast || []).forEach((spec, i) => CAST.push(buildCharacter(spec, i)));
  for (const T0 of FILM.titles || []) {
    const line = layoutText({ id: T0.id, text: T0.text, font: T0.font || 'display', size: T0.size, cap: T0.cap, fit: T0.fit, track: T0.track, anchor: T0.anchor || 'C', x: T0.x, baseline: T0.y });
    role(T0.color || 'ink');
    TITLES.push({ ...T0, line, color: T0.color || 'ink' });
    needContrast(T0.id, T0.color || 'ink', T0.on || 'bg', (T0.size || 99) < 40 ? 4.5 : 3);
  }
  if (STAGE.sunburst) role(STAGE.sunburst.color || 'rays');
  role(STAGE.shadow || 'shadow');
  camZ = new Prop(1, 'camera.z');
  for (const k of (FILM.camera || []).slice().sort((a, b) => a.at - b.at)) if (k.punch != null) camZ.to(k.at, k.punch, k.spring || 'PUNCH');
}

boot({
  name: 'cartoon',
  springs: { SNAP: [0.7, 38], POP: [0.42, 20], BOUNCY: [0.32, 16], SWING: [0.5, 14], GLIDE: [1, 12] },
  always: true,
  gif: { fps: DRAW_FPS <= 25 && FPS % DRAW_FPS === 0 ? DRAW_FPS : 20 },   // one GIF frame per drawing
  build, draw: (c, t, q) => drawFrame(c, t, q), checks, cycles, stills, layout, visible,
});
})();
</script>
