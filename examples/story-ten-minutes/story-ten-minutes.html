/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.

 * A story short told in the second person ("You just robbed a bank..."):

 * Every scene says one to three lines. Mark words for the captions with

 * A line can be { text, speak } when the voice should read it differently

 * scripts/voice.mjs reads this block, speaks every line (Kokoro, on this

 * messages) are seconds from the scene's start.
 * Positions are px of the 1080 x 1920 frame.

  roles: ['night', 'dusk', 'steel', 'fog', 'haze', 'wood', 'woodDk', 'lamp', 'cash', 'cashDk', 'white', 'screen', 'neon', 'amber'],
  draw(c, Sc, lt, td, dn, t) {
    vgrad(c, 0, 0, W, H, [[0, 'woodDk'], [1, 'ink']]);
    for (let y = 0; y < H; y += 120 * U) line(c, 0, y + Math.sin(y) * 10 * U, W, y + 20 * U, 4 * U, 'wood', 0.5);   // the grain of the table
    glow(c, 280 * U, 300 * U, 1100 * U, 'lamp', 0.3);
    const mx = CX, my = 1000 * U;                     // the counting machine
    box(c, mx - 300 * U, my - 160 * U, 600 * U, 360 * U, 'steel', 40 * U);
    box(c, mx - 240 * U, my - 250 * U, 480 * U, 120 * U, 'fog', 24 * U);
    box(c, mx - 200 * U, my + 40 * U, 400 * U, 90 * U, 'ink', 14 * U);
    const n = Math.floor(td * 20);
    say(c, String(992 + (n % 7)).padStart(4, '0'), mx, my + 106 * U, 'hud', 60 * U, 'screen');
    for (let k = 0; k < 6; k++) {                     // bills riffling through the top on twos
      const ph = ((td * 3.5 + k / 6) % 1), y = my - 250 * U - ph * 70 * U, tilt = (ph - 0.5) * 50;
      c.save(); c.translate(mx, y); c.rotate(tilt * DEG); box(c, -130 * U, -12 * U, 260 * U, 24 * U, ph > 0.5 ? 'cash' : 'cashDk', 4 * U, SL * 0.6); c.restore();
    }
    const done = Math.min(14, Math.floor(lt * 3));    // finished stacks piling up either side
    for (let k = 0; k < 14; k++) {
      const s = k % 2 ? 1 : -1, j = Math.floor(k / 2), x = mx + s * (400 + (j % 2) * 30) * U, y = (1450 - j * 50) * U;
      if (k < done) cashStack(c, x, y, 220 * U, 70 * U, (hash(2, k, 1) - 0.5) * 12);
    }
    for (let k = 0; k < 8; k++) cashStack(c, (120 + hash(4, k, 1) * 840) * U, (1650 + hash(4, k, 2) * 200) * U, 200 * U, 64 * U, (hash(4, k, 3) - 0.5) * 70);
  },
};
SETS.tv = {
  roles: ['night', 'dusk', 'steel', 'fog', 'haze', 'neon', 'neonDk', 'white', 'screen', 'hud', 'dim', 'amber'],
  build(Sc) { const T0 = Sc.tv || {}; useText('title', T0.banner || ''); useText('caption', T0.head || ''); useText('hud', T0.ticker || ''); cue(Sc.t0 + 0.2, 'hit', { gain: -8 }); },
  draw(c, Sc, lt, td, dn, t) {
    const T0 = Sc.tv || {};
    c.fillStyle = col('ink'); c.fillRect(0, 0, W, H);
    const fl = 0.85 + 0.15 * hash(0x77, Math.floor(t * FPS), 1);   // the set's light, flickering
    glow(c, CX, 860 * U, 1100 * U, 'screen', 0.22 * fl);
    const tx = 80 * U, ty = 420 * U, tw = W - 160 * U, th = 760 * U;
    box(c, tx - 40 * U, ty - 40 * U, tw + 80 * U, th + 80 * U, 'night', 50 * U, SL);
    const scr = rr(tx, ty, tw, th, 30 * U);
    c.save(); c.clip(scr);
    vgrad(c, tx, ty, tw, th, [[0, 'steel'], [1, 'dusk']]);
    for (let i = 0; i < 6; i++) { c.fillStyle = rgba('haze', 0.15); c.fillRect(tx + i * 170 * U, ty, 80 * U, th); }   // the studio wall
    box(c, tx + 560 * U, ty + 90 * U, 300 * U, 360 * U, 'fog', 16 * U);   // the suspect: a silhouette and a question mark
    c.fillStyle = col('night'); c.beginPath(); c.ellipse(tx + 710 * U, ty + 250 * U, 90 * U, 110 * U, 0, 0, TAU); c.fill(); c.beginPath(); c.ellipse(tx + 710 * U, ty + 470 * U, 150 * U, 110 * U, 0, 0, TAU); c.fill();
    say(c, '?', tx + 710 * U, ty + 300 * U, 'title', 120 * U, 'hud');
    const bk = easeOut((lt - 0.2) / 0.35);
    box(c, tx - tw * (1 - bk), ty + th - 260 * U, tw * 0.62, 84 * U, 'neon', 0, 0);
    if (bk > 0.9) say(c, T0.banner || '', tx + 30 * U, ty + th - 200 * U, 'title', 46 * U, 'white', 'left');
    box(c, tx, ty + th - 176 * U, tw, 96 * U, 'white', 0, 0);
    say(c, T0.head || '', tx + 30 * U, ty + th - 112 * U, 'caption', 50 * U, 'ink', 'left');
    box(c, tx, ty + th - 80 * U, tw, 80 * U, 'night', 0, 0);
    setFont(c, fontStr('hud', 34 * U)); const tick = T0.ticker || '', tkw = c.measureText(tick).width || 1, off = (lt * 180 * U) % tkw;
    for (let k = -1; k < 3; k++) say(c, tick, tx + tw - off + k * tkw - tw, ty + th - 26 * U, 'hud', 34 * U, 'hud', 'left');
    c.fillStyle = rgba('ink', 0.18); for (let y = ty; y < ty + th; y += 6 * U) c.fillRect(tx, y, tw, 2 * U);
    c.restore();
    box(c, CX - 160 * U, ty + th + 40 * U, 320 * U, 60 * U, 'night', 10 * U);
    poly(c, [[0, 1600 * U], [W, 1560 * U], [W, H], [0, H]], 'night', SL);   // the couch's back, foreground
    c.fillStyle = rgba('screen', 0.12 * fl); c.fillRect(0, 1560 * U, W, 30 * U);
  },
};
SETS.question = {
  roles: ['night', 'dusk', 'steel', 'neon', 'neonDk', 'amber', 'white', 'hud', 'dim', 'glass'],
  build(Sc) {
    const Q = Sc.question || {};
    useText('title', (Q.text || '') + (Q.options || []).join('') + 'OR'); useText('caption', Q.cta || '');
    cue(Sc.t0, 'boom', { gain: -4 }); cue(Sc.t0 - 0.8, 'swell', { dur: 0.8, gain: -8 });
    (Q.options || []).forEach((_, i) => cue(Sc.t0 + 0.6 + i * 0.25, 'pop', { gain: -6 }));
  },
  draw(c, Sc, lt, td, dn, t) {
    const Q = Sc.question || {};
    vgrad(c, 0, 0, W, H, [[0, 'ink'], [0.5, 'night'], [1, 'ink']]);
    glow(c, CX, 820 * U, 900 * U, 'neon', 0.18 + 0.05 * Math.sin(t * 3));
    drawRain(c, t, 0.35, 0xA1);
    const k0 = S(lt - 0.05, spring('POP'));
    c.save(); c.translate(CX, 660 * U); c.scale(k0, k0);
    const lines = wrap(Q.text || '', 'title', 118 * U, 860 * U);
    lines.forEach((l, i) => sayInk(c, l, 0, (i - (lines.length - 1) / 2) * 130 * U, 'title', 118 * U, 'white', 'center', 0.12));
    c.restore();
    const opts = Q.options || [], colr = ['amber', 'neon'];
    opts.forEach((o, i) => {
      const k = S(lt - 0.6 - i * 0.25, spring('POP')); if (k < 0.02) return;
      const x = CX + (i ? 1 : -1) * 240 * U, y = 1000 * U, bob = Math.sin(t * 2.4 + i * Math.PI) * 6 * U;
      c.save(); c.translate(x, y + bob); c.scale(k, k);
      glow(c, 0, 0, 240 * U, colr[i % 2], 0.25);
      box(c, -165 * U, -90 * U, 330 * U, 180 * U, colr[i % 2], 40 * U, LINE);
      sayInk(c, o, 0, 30 * U, 'title', 84 * U, 'white', 'center', 0.12);
      c.restore();
    });
    if (opts.length === 2 && lt > 0.9) say(c, 'OR', CX, 1022 * U, 'title', 44 * U, 'dim');
    if (Q.cta && lt > 1.2) { const b = Math.abs(Math.sin(t * 3)) * 14 * U; say(c, Q.cta, CX, 1190 * U, 'caption', 40 * U, 'hud'); c.lineWidth = 8 * U; c.strokeStyle = col('hud'); c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(CX - 26 * U, 1226 * U + b); c.lineTo(CX, 1252 * U + b); c.lineTo(CX + 26 * U, 1226 * U + b); c.stroke(); }
  },
};

/* ---------------- HUD cards, over the set and the camera ---------------- */
const money = (v) => '$' + Math.round(v).toLocaleString('en-US');
const clockAt = (a, b, k) => { const m = (s) => { const [h, mm] = s.split(':').map(Number); return h * 60 + mm; }; const v = Math.round(lerp(m(a), m(b), k)); return `${String(Math.floor(v / 60)).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}`; };
function hudCard(c, x, y, w, h, k) {
  c.save(); c.translate(x, y); c.scale(k, k);
  c.fillStyle = rgba('ink', 0.78); c.fill(rr(-w / 2, -h / 2, w, h, 22 * U));
  c.lineWidth = 3 * U; c.strokeStyle = rgba('dim', 0.8); c.stroke(rr(-w / 2, -h / 2, w, h, 22 * U));
}
function drawHud(c, Sc, lt, t) {
  for (const h of Sc.hud || []) {
    const at = h.at || 0, k = S(lt - at, spring('POP')), y = fmtY(h.y != null ? h.y : 300);
    if (k < 0.02) continue;
    const p = easeOut((lt - at) / (h.dur || 2));
    if (h.kind === 'money' || h.kind === 'meter') {
      hudCard(c, CX, y, 700 * U, h.kind === 'meter' ? 200 * U : 170 * U, k);
      say(c, h.label || (h.kind === 'money' ? 'IN THE BAGS' : 'COUNTING'), 0, -36 * U, 'hud', 28 * U, 'dim');
      say(c, money(lerp(h.from || 0, h.to, p)), 0, 40 * U, 'hud', 76 * U, p >= 1 ? 'cash' : 'hud');
      if (h.kind === 'meter') { c.fillStyle = rgba('steel', 1); c.fillRect(-300 * U, 64 * U, 600 * U, 14 * U); c.fillStyle = col('cash'); c.fillRect(-300 * U, 64 * U, 600 * U * p, 14 * U); }
      c.restore();
    } else if (h.kind === 'clock') {
      hudCard(c, CX, y, 420 * U, 170 * U, k);
      say(c, h.label || 'TIME', 0, -36 * U, 'hud', 28 * U, 'dim');
      say(c, clockAt(h.from, h.to, easeIO((lt - at) / (h.dur || 2))), 0, 44 * U, 'hud', 84 * U, 'amber');
      c.restore();
    } else if (h.kind === 'timer') {
      const left = Math.max(0, (h.from || 600) - (lt - at)), red = Math.floor(lt * 2) % 2;
      hudCard(c, CX, y, 440 * U, 170 * U, k);
      say(c, h.label || 'POLICE IN', 0, -36 * U, 'hud', 28 * U, 'dim');
      say(c, `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(Math.floor(left % 60)).padStart(2, '0')}`, 0, 44 * U, 'hud', 84 * U, red ? 'neon' : 'white');
      c.restore();
    } else if (h.kind === 'tag') {
      setFont(c, fontStr('hud', 34 * U)); const w = c.measureText(h.text || '').width + 60 * U;
      hudCard(c, CX, y, w, 80 * U, k); say(c, h.text || '', 0, 12 * U, 'hud', 34 * U, 'hud'); c.restore();
    }
  }
}

/* ---------------- captions: the voice's words, popping in as they are said ---------------- */
function buildCaptions() {
  const size0 = (CAPS.size || 78) * U, maxW = W - 2 * MARGIN, maxWords = CAPS.maxWords || 3;
  const all = [];
  for (const l of TIMING.lines) {
    let cur = [];
    const flush = () => { if (cur.length) all.push(cur); cur = []; };
    l.words.forEach((w, i) => {
      const next = l.words[i + 1];
      cur.push(w);
      if (cur.length >= maxWords || /[.,?!;:…]["'”’)]*$/.test(w.text) || (next && next.start - w.end > 0.3)) flush();
    });
    flush();
  }
  all.forEach((ws, i) => {
    const next = all[i + 1], show = Math.max(0, ws[0].start - 0.05), hide = Math.min(next ? next[0].start - 0.02 : DUR, ws[ws.length - 1].end + 0.7);
    let size = size0;
    const measure = () => { setFont(mctx, fontStr('caption', size)); const sp = mctx.measureText(' ').width; const xs = []; let x = 0; for (const w of ws) { const wd = mctx.measureText(w.text).width; xs.push([x, wd]); x += wd + sp; } return { xs, w: x - sp }; };
    let m = measure();
    while (m.w > maxW && size > 48 * U) { size -= 2 * U; m = measure(); }
    for (const w of ws) useText('caption', w.text);
    GROUPS.push({ ws, show, hide, size, xs: m.xs, x0: CX - m.w / 2, y: fmtY(CAPS.y || 1330) });
  });
  needContrast('captions', CAPS.fill || 'white', CAPS.stroke || 'ink', 4.5);
  for (const r of Object.values(CAPS.marks || {})) { role(r); needContrast(`captions ${r}`, r, CAPS.stroke || 'ink', 3); }
}
function drawCaptions(c, t) {
  const G = GROUPS.find((g) => t >= g.show && t < g.hide);
  if (!G) return;
  const fade = clamp((G.hide - t) / 0.12, 0, 1);
  setFont(c, fontStr('caption', G.size)); c.textAlign = 'left'; c.lineJoin = 'round';
  G.ws.forEach((w, i) => {
    const d = t - w.start + 0.03; if (d < 0) return;
    const k = S(d, spring('POP')), sc = 0.6 + 0.4 * k, x = G.x0 + G.xs[i][0], wd = G.xs[i][1];
    c.save(); c.globalAlpha = fade * clamp(k * 2, 0, 1); c.translate(x + wd / 2, G.y); c.scale(sc, sc); c.translate(-wd / 2, 0);
    c.lineWidth = G.size * 0.2; c.strokeStyle = col(CAPS.stroke || 'ink'); c.strokeText(w.text, 0, 0);
    c.fillStyle = col(w.mark ? (CAPS.marks || {})[w.mark] || 'neon' : CAPS.fill || 'white'); c.fillText(w.text, 0, 0);
    c.restore();
  });
}

/* ---------------- the camera and the frame ---------------- */
function sceneAt(t) { for (let i = SCENES.length - 1; i >= 0; i--) if (t >= SCENES[i].t0) return SCENES[i]; return SCENES[0]; }
function cameraOf(Sc, lt, td) {
  const C = Sc.cam || {}, a = C.from || [540, 960, 1], b = C.to || [a[0], a[1], a[2] * 1.06], k = easeIO(lt / Math.max(0.1, Sc.t1 - Sc.t0));
  let z = lerp(a[2], b[2], k), x = fmtX(lerp(a[0], b[0], k)), y = fmtY(lerp(a[1], b[1], k));
  const hw = W / (2 * z), hh = H / (2 * z);
  x = clamp(x, hw, W - hw); y = clamp(y, hh, H - hh);
  let dx = 0, dy = 0;
  for (const s of Sc.shake || []) {
    const tau = lt - s; if (tau < 0 || tau > 0.5) continue;
    const e = Math.exp(-tau / 0.12), n = Math.floor(td * DRAW_FPS);
    dx += 16 * U * e * (hash(0x5AC, n, 1) - 0.5) * 2; dy += 16 * U * e * (hash(0x5AC, n, 2) - 0.5) * 2;
  }
  return { x, y, z, dx, dy };
}
function drawFrame(c, t, q) {
  const dn = drawing(q, DRAW_FPS), td = dn / DRAW_FPS, Sc = sceneAt(t), lt = t - Sc.t0, ltd = td - Sc.t0;
  const cam = cameraOf(Sc, lt, td);
  c.save();
  c.translate(CX + cam.dx, CY + cam.dy); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y);
  SETS[Sc.set].draw(c, Sc, lt, td, dn, t, ltd);
  if (Sc.hero) drawCharacter(c, Sc.hero, td, dn);
  c.restore();
  if (Sc.rain) drawRain(c, t, Sc.rain);
  vignette(c);
  drawHud(c, Sc, lt, t);
  drawCaptions(c, t);
  const fadeIn = clamp(t / 0.25, 0, 1);              // the first frame opens on the picture, not black: a short lift only
  if (fadeIn < 1) { c.fillStyle = rgba('ink', 0.5 * (1 - fadeIn)); c.fillRect(0, 0, W, H); }
}

/* ---------------- analysis ---------------- */
function checks(add) {
  const tall = Math.abs(H / W - 16 / 9) < 0.01;
  add('format', tall ? 'PASS' : 'WARN', tall ? `${W} x ${H} (9:16)` : `${W} x ${H}: the sets are drawn for 9:16; check every still`);
  const dd = Math.abs(TIMING.dur - DUR);
  add('voice timing', dd < 0.05 ? 'PASS' : 'FAIL', dd < 0.05 ? `DUR ${DUR} s matches assets/timing.json` : `DUR ${DUR} s but the voice-over is ${TIMING.dur} s: run scripts/voice.mjs again`);
  const ids = FILM.scenes.map((s) => s.id).join(','), tids = TIMING.scenes.map((s) => s.id).join(',');
  add('voice scenes', ids === tids ? 'PASS' : 'FAIL', ids === tids ? `${SCENES.length} scenes` : 'the scenes changed since the voice-over was made: run scripts/voice.mjs again');
  for (const Sc of SCENES) {
    const d = Sc.t1 - Sc.t0;
    add(`scene: ${Sc.id}`, d < 1.2 ? 'WARN' : d > 9 ? 'WARN' : 'PASS', `${Sc.set}, ${Sc.t0.toFixed(2)} to ${Sc.t1.toFixed(2)} s (${d.toFixed(1)} s)${d > 9 ? ': over 9 s on one picture; split it' : d < 1.2 ? ': too short to read' : ''}`);
  }
  const last = SCENES[SCENES.length - 1];
  add('the ask', last.set === 'question' ? 'PASS' : 'WARN', last.set === 'question' ? 'the film ends on the question card' : 'the film should end on a question the viewer answers in the comments');
  const nW = GROUPS.reduce((n, g) => n + g.ws.length, 0), wps = nW / Math.max(1, TIMING.lines[TIMING.lines.length - 1].end - TIMING.lines[0].start);
  add('captions', nW ? 'PASS' : 'FAIL', `${GROUPS.length} groups, ${nW} words, ${wps.toFixed(1)} words a second`);
  const g0 = GROUPS[0]; if (g0) checkLiveArea(add, 'captions', [MARGIN, g0.y - g0.size, W - MARGIN, g0.y + g0.size * 0.3], false);
  const hook = TIMING.lines[0];
  add('hook', hook && hook.end <= 3 ? 'PASS' : 'WARN', hook ? `the first line ends at ${hook.end.toFixed(2)} s${hook.end <= 3 ? '' : ': the hook should land inside 3 s'}` : 'no lines');
  for (const l of TIMING.lines) if (l.known < l.of * 0.6) add(`timing: ${l.scene}`, 'WARN', `only ${l.known} of ${l.of} words were heard in "${l.text}"; check the captions against the voice`);
}
function stills(push) {
  for (const Sc of SCENES) {
    push((Sc.t0 + 0.6) * FPS, `${Sc.id}-in`, `${Sc.set}, just after the cut`);
    push(((Sc.t0 + Sc.t1) / 2) * FPS, `${Sc.id}-mid`, `${Sc.set}, mid-scene`);
  }
}
function layout() {
  return { scenes: SCENES.map((Sc) => ({ id: Sc.id, set: Sc.set, from: +Sc.t0.toFixed(3), to: +Sc.t1.toFixed(3), hero: !!Sc.hero, hud: (Sc.hud || []).map((h) => h.kind) })),
    captions: GROUPS.map((g) => ({ text: g.ws.map((w) => w.text).join(' '), from: +g.show.toFixed(2), to: +g.hide.toFixed(2), size: Math.round(g.size) })) };
}

function build() {
  TIMING = JSON.parse(dataText(FILM.timing));
  role('ink'); role('white'); role('bg');
  const ids = new Map(TIMING.scenes.map((s) => [s.id, s]));
  FILM.scenes.forEach((spec, i) => {
    if (!SETS[spec.set]) throw new Error(`scene ${spec.id}: unknown set "${spec.set}" (${Object.keys(SETS).join(', ')})`);
    const tm = ids.get(spec.id) || { start: i ? DUR : 0, end: DUR };
    const Sc = { ...spec, t0: tm.start, t1: Math.min(DUR, tm.end) };
    for (const r of SETS[spec.set].roles || []) role(r);
    if (SETS[spec.set].build) SETS[spec.set].build(Sc);
    if (spec.actor) Sc.hero = buildCharacter({ ...FILM.hero, ...spec.actor, id: `${spec.id}-HERO` }, i, Sc.t0);
    for (const h of spec.hud || []) {
      if (h.kind === 'money' || h.kind === 'meter') { cue(Sc.t0 + (h.at || 0), 'data', { dur: h.dur || 2, gain: -12 }); cue(Sc.t0 + (h.at || 0) + (h.dur || 2), 'lock', { gain: -8 }); }
      if (h.kind === 'clock') cue(Sc.t0 + (h.at || 0), 'data', { dur: h.dur || 2, gain: -14 });
      if (h.kind === 'timer') for (let s = 1; s < Sc.t1 - Sc.t0 - (h.at || 0); s++) cue(Sc.t0 + (h.at || 0) + s, 'tick', { gain: -10 });
      useText('hud', `${h.label || ''}${h.text || ''}$0123456789,:INTHEBAGSCOUNTINGPOLICETIME `);
    }
    for (const s of spec.shake || []) cue(Sc.t0 + s, 'hit', { gain: -6 });
    if (i) { cutAt(Sc.t0); cue(Sc.t0, 'whoosh', { gain: -12 }); }
    sectionAt(Sc.t0, spec.id);
    SCENES.push(Sc);
  });
  buildCaptions();
}

boot({
  name: 'story',
  springs: { SNAP: [0.7, 38], POP: [0.5, 22], BOUNCY: [0.32, 16], SWING: [0.5, 14], GLIDE: [1, 12] },
  always: true,
  backdrop: ['night', 'dusk', 'steel', 'ink', 'woodDk', 'bg'],
  gif: { fps: 10, width: 270 },
  build: () => { useText('title', '!?OR'); build(); }, draw: (c, t, q) => drawFrame(c, t, q), checks, stills, layout, visible: () => true,
});
})();
</script>
