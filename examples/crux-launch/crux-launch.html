  let disp = Math.abs(camX.at(tb) - camX.at(ta)) * Math.max(za, zb) + Math.abs(zb - za) * Math.hypot(CX, CY);
  const z = Math.max(za, zb);
  for (const Sc of SCENES) {
    if (!Sc.win.some(([a, b]) => (tb >= a && tb < b) || (ta >= a && ta < b))) continue;
    for (const Ln of Sc.lines) for (const g of Ln.glyphs) if (!g.space) disp = Math.max(disp, Math.abs(g.y.at(tb) - g.y.at(ta)) * z);
    for (const R of Sc.rules) disp = Math.max(disp, Math.abs(R.dy.at(tb) - R.dy.at(ta)) * z, Math.abs(R.sx.at(tb) - R.sx.at(ta)) * (R.x1 - R.x0) * z);
    for (const C of Sc.crumbs) disp = Math.max(disp, Math.abs(C.dy.at(tb) - C.dy.at(ta)) * z);
    if (Sc.mask && tb >= Sc.t0 && ta < Sc.t0 + Sc.mask.dur) {
      const s0 = Math.exp(Math.log(Sc.mask.sEnd) * S(ta - Sc.t0, Sc.mask.spr)), s1 = Math.exp(Math.log(Sc.mask.sEnd) * S(tb - Sc.t0, Sc.mask.spr));
      disp = Math.max(disp, Sc.mask.far * Math.abs(s1 / s0 - 1));       // an edge at the far corner moves the most
    }
    if (Sc.breath) disp = Math.max(disp, Math.abs(breath(Sc.breath, tb) - breath(Sc.breath, ta)) * Math.hypot(CX, CY));
  }
  return { samples: Math.max(MIN_SAMPLES, Math.min(MAX_SAMPLES, Math.ceil(disp / PX_PER_SAMPLE))), disp };
}
let SUM = null;
function renderFrame(n) {
  if (!isReady) return 0;
  const { samples } = motionAt(n);
  const times = shutterTimes(n, samples);
  if (samples === 1) { draw(ctx, times[0]); return 1; }
  if (!SUM) SUM = new Uint16Array(W * H * 4); else SUM.fill(0);
  for (const t of times) {
    draw(ctx, t);
    const px = ctx.getImageData(0, 0, W, H).data;
    for (let i = 0; i < px.length; i++) SUM[i] += px[i];
  }
  const out = ctx.createImageData(W, H), o = out.data, half = samples >> 1;
  for (let i = 0; i < o.length; i++) o[i] = ((SUM[i] + half) / samples) | 0;
  ctx.putImageData(out, 0, 0);
  return samples;
}

/* ---------------- analysis only (never called by seek) ---------------- */
function layoutTable() {
  const r = (v) => Math.round(v * 10) / 10;
  return {
    film: { W, H, FPS, DUR, frames: Math.round(DUR * FPS), bpm: FILM.BPM, margin: MARGIN, measure: MEASURE },
    lines: Object.values(LINES).map((l) => ({ id: l.id, scene: l.scene.id, text: l.text, font: l.font, size: r(l.size), trackEm: r(l.trackEm), inkL: r(l.inkL), inkR: r(l.inkR), capTop: r(l.capTop), baseline: l.baseline, top: r(l.top), bottom: r(l.bottom) })),
    crumbs: SCENES.flatMap((s) => s.crumbs.map((c) => ({ id: c.id, scene: s.id, text: c.text, x: r(c.x), w: r(c.w), baseline: c.baseline }))),
    masks: SCENES.filter((s) => s.mask).map((s) => ({ scene: s.id, line: s.mask.line.id, anchor: [r(s.mask.ax), r(s.mask.ay)], inkRadius: r(s.mask.r), scale: r(s.mask.sEnd), covers: r(s.mask.need), dur: Math.round(s.mask.dur * 1000) / 1000 })),
    mono: { size: MONO.size, advance: r(MONO.adv), capHeight: r(MONO.cap), pitch: r(MONO.pitch) },
    cuts: CUTS, mis: misFrames(), warnings: WARN,
  };
}
function misFrames() { return MIS_T.map((m) => ({ what: m.what, t: Math.round(m.t * 1000) / 1000, frame: Math.round(m.t * FPS) })); }

// raster ink gaps: the smallest Euclidean distance between neighbouring glyphs' ink edges (alpha >= 128), minus 1
let gapCtx = null;
function pairGaps(Ln) {
  const gc = gapCtx || (gapCtx = mkCanvas().getContext('2d', { willReadFrequently: true }));
  const edges = (g) => {
    gc.setTransform(1, 0, 0, 1, 0, 0); gc.clearRect(0, 0, W, H);
    setFont(gc, Ln.font); gc.fillStyle = '#000'; gc.globalAlpha = 1; gc.filter = 'none';
    gc.fillText(g.ch, g.x, Ln.baseline);
    const x0 = Math.max(0, Math.floor(g.inkL) - 2), x1 = Math.min(W, Math.ceil(g.inkR) + 2);
    const y0 = Math.max(0, Math.floor(Ln.baseline - g.asc) - 2), y1 = Math.min(H, Math.ceil(Ln.baseline + g.desc) + 2);
    const w = x1 - x0, h = y1 - y0;
    if (w <= 0 || h <= 0) return [];
    const a = gc.getImageData(x0, y0, w, h).data;
    const ink = (x, y) => x >= 0 && y >= 0 && x < w && y < h && a[(y * w + x) * 4 + 3] >= 128;
    const out = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
      if (ink(x, y) && !(ink(x - 1, y) && ink(x + 1, y) && ink(x, y - 1) && ink(x, y + 1))) out.push([x + x0, y + y0]);
    return out;
  };
  const pairs = [];
  for (let i = 0; i < Ln.glyphs.length - 1; i++) {
    const g1 = Ln.glyphs[i], g2 = Ln.glyphs[i + 1];
    if (g1.space || g2.space) continue;
    const reach = 0.35 * Ln.size;
    const e1 = edges(g1).filter((p) => p[0] >= g1.inkR - reach), e2 = edges(g2).filter((p) => p[0] <= g2.inkL + reach);
    let m = Infinity;
    for (const p of e1) for (const r of e2) { const dx = p[0] - r[0], dy = p[1] - r[1]; const dd = dx * dx + dy * dy; if (dd < m) m = dd; }
    const gap = Math.sqrt(m) - 1;
    pairs.push({ pair: g1.ch + g2.ch, px: Math.round(gap * 10) / 10, em: Math.round(gap / Ln.size * 1000) / 1000 });
  }
  return pairs;
}
function inkGaps() { return Object.values(LINES).map((Ln) => ({ id: Ln.id, role: Ln.role, size: Math.round(Ln.size * 10) / 10, trackEm: Math.round(Ln.trackEm * 10) / 10, pairs: pairGaps(Ln) })); }

// Off-palette scan: pixels with chroma >= 40 whose hue is more than 13 degrees from every
// chromatic palette colour, i.e. two inks mixed into a new one. `area` keeps only pixels whose
// 4 neighbours are off-palette too (patches 3+ px across), dropping the 1-px antialiasing fringe.
function offPalette(frames, mode) {
  const hues = Object.values(PAL).map((h) => hueChroma(...rgbOf(h))).filter(([, c]) => c >= 40).map(([h]) => h);
  const out = [];
  for (const n of frames) {
    if (mode === 'seek') seek(n / FPS); else renderFrame(n);
    const px = ctx.getImageData(0, 0, W, H).data, off = new Uint8Array(W * H);
    let count = 0; const cols = {};
    for (let p = 0, i = 0; p < W * H; p++, i += 4) {
      const [h, C] = hueChroma(px[i], px[i + 1], px[i + 2]);
      if (C < 40) continue;
      if (!hues.some((hp) => hueDist(h, hp) <= 13)) { off[p] = 1; count++; const k = `${px[i]},${px[i + 1]},${px[i + 2]}`; cols[k] = (cols[k] || 0) + 1; }
    }
    let area = 0;
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const p = y * W + x; if (off[p] && off[p - 1] && off[p + 1] && off[p - W] && off[p + W]) area++; }
    const top = Object.entries(cols).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `(${k})x${v}`).join(' ');
    out.push({ frame: n, count, area, top });
  }
  return out;
}

// every character each face must draw (the render script checks it against the font's own cmap;
// the browser cannot, because a missing glyph silently falls back to another font)
function textByFace() {
  const out = {};
  const add = (role, str) => { const f = face(role), k = `${f.family}|${f.weight}`; out[k] = (out[k] || '') + str; };
  for (const Ln of Object.values(LINES)) { add(Ln.role, Ln.text); if (Ln.spec.scramble) add(Ln.role, ALNUM); }
  for (const Sc of SCENES) for (const C of Sc.crumbs) add('mono', C.text);
  return out;
}

// the automated half of the pre-pass critique; the other half is looking at the stills
function critique() {
  const checks = [];
  const add = (name, status, detail) => checks.push({ name, status, detail });
  // copy: at most 4 words of display type per beat (crumbs are small print and not counted)
  for (const Sc of SCENES) {
    const words = Sc.lines.filter((l) => l.role !== 'mono').map((l) => l.text).join(' ').split(/\s+/).filter((w) => /[A-Za-z0-9€$£]/.test(w));
    add(`words: ${Sc.id}`, words.length > 4 ? 'FAIL' : 'PASS', `${words.length} (${words.join(' ')})`);
  }
  // live area and baseline grid
  const unit = FILM.grid.unit;
  for (const Ln of Object.values(LINES)) {
    const out = [];
    if (!Ln.spec.bleed) {
      if (Ln.inkL < MARGIN - 1) out.push(`ink left ${Ln.inkL.toFixed(1)} < ${MARGIN}`);
      if (Ln.inkR > W - MARGIN + 1) out.push(`ink right ${Ln.inkR.toFixed(1)} > ${W - MARGIN}`);
      if (Ln.top < MARGIN - 1) out.push(`top ${Ln.top.toFixed(1)} < ${MARGIN}`);
      if (Ln.bottom > H - MARGIN + 1) out.push(`bottom ${Ln.bottom.toFixed(1)} > ${H - MARGIN}`);
    }
    add(`live area: ${Ln.id}`, out.length ? 'FAIL' : 'PASS', out.join(', ') || `ink ${Ln.inkL.toFixed(0)}-${Ln.inkR.toFixed(0)} x ${Ln.top.toFixed(0)}-${Ln.bottom.toFixed(0)}`);
    if (unit && Ln.baseline % unit) add(`grid: ${Ln.id}`, 'WARN', `baseline ${Ln.baseline} is not on the ${unit} px grid`);
  }
  for (const Sc of SCENES) for (const C of Sc.crumbs) {
    const bad = C.x < MARGIN - 1 || C.x + C.w > W - MARGIN + 1 || C.baseline - MONO.cap < MARGIN - 1 || C.baseline > H - MARGIN + 1;
    add(`live area: ${C.id}`, bad ? 'FAIL' : 'PASS', `x ${C.x.toFixed(0)}-${(C.x + C.w).toFixed(0)}, baseline ${C.baseline}`);
    if (unit && C.baseline % unit) add(`grid: ${C.id}`, 'WARN', `baseline ${C.baseline} is not on the ${unit} px grid`);
  }
  // collisions at rest, inside one scene
  for (const Sc of SCENES) {
    const boxes = [
      ...Sc.lines.map((l) => ({ id: l.id, b: [l.inkL, l.top, l.inkR, l.bottom], cap: l.capH })),
      ...Sc.crumbs.map((c) => ({ id: c.id, b: [c.x, c.baseline - MONO.cap, c.x + c.w, c.baseline], cap: MONO.cap })),
      ...Sc.rules.map((r) => ({ id: r.id, b: [r.x0, r.y, r.x1, r.y + r.h], cap: r.h })),
    ];
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      const a = boxes[i].b, b = boxes[j].b;
      const dx = Math.max(0, a[0] - b[2], b[0] - a[2]), dy = Math.max(0, a[1] - b[3], b[1] - a[3]);
      const gap = dx === 0 && dy === 0 ? -1 : Math.hypot(dx, dy);
      const tight = 16 * U;
      if (gap < 0) add(`collision: ${boxes[i].id} / ${boxes[j].id}`, 'FAIL', 'ink boxes overlap at rest');
      else if (gap < tight) add(`cramped: ${boxes[i].id} / ${boxes[j].id}`, 'WARN', `${gap.toFixed(1)} px apart (< ${tight} px)`);
    }
  }
  // cramped pairs inside display lines
  for (const lg of inkGaps()) {
    if (lg.role === 'mono') continue;
    const low = lg.pairs.filter((p) => p.em < 0.037);
    add(`letter gaps: ${lg.id}`, low.length ? 'FAIL' : 'PASS', low.length ? low.map((p) => `${p.pair} ${p.px}px (${p.em} em)`).join(', ') + ' < 0.037 em' : `min ${Math.min(...lg.pairs.map((p) => p.em), Infinity)} em`);
  }
  // orphans: a lone short word stacked against much wider lines
  for (const Sc of SCENES) {
    const disp = Sc.lines.filter((l) => l.role === 'display');
    if (disp.length < 2) continue;
    const wMax = Math.max(...disp.map((l) => l.inkR - l.inkL));
    for (const l of disp) if (l.text.trim().split(/\s+/).length === 1 && l.text.replace(/[^A-Za-z0-9]/g, '').length <= 3 && (l.inkR - l.inkL) * 2.5 < wMax)
      add(`orphan: ${l.id}`, 'WARN', `"${l.text}" sits alone, under 40 % of the widest line`);
  }
  // contrast against the background
  const bg = col('bg');
  for (const Ln of Object.values(LINES)) { const r = contrast(col(Ln.color), bg); add(`contrast: ${Ln.id}`, r < 3 ? 'FAIL' : 'PASS', `${r.toFixed(2)}:1 (display needs 3:1)`); }
  for (const Sc of SCENES) for (const C of Sc.crumbs) { const r = contrast(col(C.color), bg); add(`contrast: ${C.id}`, r < 4.5 ? 'FAIL' : 'PASS', `${r.toFixed(2)}:1 (small text needs 4.5:1)`); }
  // palette: every colour used must be a palette role
  const used = [...Object.values(LINES).map((l) => l.color), ...SCENES.flatMap((s) => [...s.rules.map((r) => r.color), ...s.crumbs.map((c) => c.color)]), ...FILM.misPair, FILM.smearColor, FILM.scrambleColor];
  const stray = [...new Set(used.filter((k) => !(k in PAL)))];
  add('palette roles', stray.length ? 'FAIL' : 'PASS', stray.length ? `not in the palette: ${stray.join(', ')}` : used.length + ' uses, all palette roles');
  // the loop: everything must be at rest before the last frame's earliest subframe
  const last = Math.max(...PROPS.map((p) => p.settleEnd()), ...ACTIVE.map((w) => w[1]));
  const need = DUR - (1 + SHUTTER) / FPS;
  const hold = Math.floor((DUR - last) * FPS);
  add('loop tail', last <= need ? 'PASS' : 'FAIL', `last motion ends at ${last.toFixed(3)} s; static hold ${hold} frames (needs >= 2)`);
  for (const w of WARN) add('timeline', 'WARN', w);
  return checks;
}

// review stills: each scene at rest, each transition mid-move, each accent frame
function stillsPlan() {
  const N = Math.round(DUR * FPS), plan = [], seen = new Set();
  const push = (frame, name, what) => { frame = Math.max(0, Math.min(N - 1, frame)); if (seen.has(frame)) return; seen.add(frame); plan.push({ frame, name, what }); };
  for (const Sc of SCENES) {
    const lands = [...Sc.lines.map((l) => l.lastArr + settle(l.enterSpring || SP.LAND) * 0.5), ...Sc.crumbs.map((c) => c.at + c.n / FPS), ...Sc.rules.map((r) => r.lastArr + 0.3)];
    const rest = Math.min(Math.max(...lands, Sc.t0) + 0.1, Sc.t1 - 2 / FPS);
    if (Sc.in !== 'none' && Sc.t0 > 0) push(Math.round((Sc.t0 + (Sc.in === 'mask' ? 0.1 : 0.05)) * FPS), `${Sc.id}-in`, `${Sc.in} into ${Sc.id}`);
    push(Math.round(rest * FPS), `${Sc.id}-rest`, `${Sc.id} landed`);
  }
  for (const m of misFrames()) push(m.frame, `mis-${m.what}`, `misregistration on ${m.what}`);
  return plan.sort((a, b) => a.frame - b.frame);
}

window.DURATION = DUR; window.FPS = FPS; window.WIDTH = W; window.HEIGHT = H;
window.FILM_META = { title: FILM.title, poster: FILM.poster || 0, bg: FILM.palette.bg, palette: FILM.palette };
window.seek = seek;
window.renderFrame = renderFrame;
window.motionAt = motionAt;
window.layoutTable = layoutTable;
window.inkGaps = inkGaps;
window.offPalette = offPalette;
window.misFrames = misFrames;
window.critique = critique;
window.stillsPlan = stillsPlan;
window.textByFace = textByFace;

const sampleText = (role) => {
  const s = new Set('H0');
  for (const sc of FILM.scenes) {
    for (const l of sc.lines || []) if ((l.font || 'display') === role) for (const c of l.text) s.add(c);
    if (role === 'mono') for (const c of sc.crumbs || []) for (const ch of c.text) s.add(ch);
  }
  if (role === 'display' || role === 'label') for (const c of ALNUM) s.add(c);
  return [...s].join('');
};
window.ready = Promise.all(Object.keys(FILM.fonts).map((role) => document.fonts.load(fontStr(role, 100), sampleText(role))))
  .then((sets) => {
    if (sets.some((s) => !s.length)) throw new Error('a font face failed to load');
    if (FILM.fonts.mono) monoMetrics();
    buildScenes();
    buildTimeline();
    isReady = true;
    seek(0);
    return true;
  });

// Preview: requestAnimationFrame is the only time source and it only calls seek().
// Space pauses, arrow keys step one frame, ?t=3.5 opens paused at a time.
if (!/[?&]capture\b/.test(location.search)) {
  window.ready.then(() => {
    const m = /[?&]t=([\d.]+)/.exec(location.search);
    let paused = !!m, pos = m ? Number(m[1]) : 0, last = null;
    const tick = (ts) => {
      if (!paused && last !== null) pos = wrapT(pos + (ts - last) / 1000);
      last = ts; seek(pos); requestAnimationFrame(tick);
    };
    addEventListener('keydown', (e) => {
      if (e.key === ' ') { paused = !paused; e.preventDefault(); }
      if (e.key === 'ArrowRight') { paused = true; pos = wrapT(Math.round(pos * FPS + 1) / FPS); }
      if (e.key === 'ArrowLeft') { paused = true; pos = wrapT(Math.round(pos * FPS - 1) / FPS); }
    });
    requestAnimationFrame(tick);
  });
}
})();
