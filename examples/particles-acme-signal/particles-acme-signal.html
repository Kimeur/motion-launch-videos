<canvas id="c" width="1080" height="1080"></canvas>
<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * Times are seconds; beat(n) and bar(n) put them on the tempo grid.
 * Positions are canvas pixels. Colours are palette role names.
 * A swarm of `swarm.n` particles; each one's position is a pure function of t.
 *   formations  where particles can be. The field (every particle's home, a
 *               drifting starfield), a line of type, shapes (filled, outlined,
 *               dotted, an SVG path, a grid, a sphere, a cloud), or one derived
 *               from another (scaled, turned, moved, exploded). Targets are
 *               sampled once, at build, as blue noise inside the ink. A particle
 *               a formation does not use stays in the field as dust.
 *   moves       the chain of formations over time: { at, to, spring, spread,
 *               order, assign, swirl, accent }. Each particle springs from where
 *               it is to its target after its own delay, so a move that starts
 *               before the last one lands bends the path instead of restarting it.
 *   drift       loop-exact noise on every particle, wide in the field and
 *               sub-pixel in a formed word, so words hold crisp.
 * Motion blur is drawn, not sampled: each particle is one streak from where it
 * was a shutter earlier to where it is, dimmer the longer it is.
 * A 'cycle' loop (the default here) ends where it starts, formations[0], and
 * keeps drifting over the seam; a 'hold' loop ends on a still copy of frame 0.
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Acme Signal particles loop',
  alt: 'A drifting field of light gathers into the word ACME, bursts outward into streaks, reforms into a ring mark with an orange core, unrolls into example.com, and dissolves back into the drifting field. Demo copy, fictional product.',

function checks(add) {

    if (F.spin) { const R = Math.max(...F.targets.map((p) => Math.hypot(p.x - F.cx, p.y - F.cy))) + pad; sb = [F.cx - R, F.cy - R, F.cx + R, F.cy + R]; }
