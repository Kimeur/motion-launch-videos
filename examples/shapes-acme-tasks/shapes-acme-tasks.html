<script>
(() => {
'use strict';

/* ==========================================================================
 * FILM: the part you edit. Everything below CORE BEGIN stays as it is.
 *
 * Times are seconds; beat(n) and bar(n) put them on the tempo grid.
 * Positions are canvas pixels; a layer's x, y is its centre (a text layer's x
 * is its anchor, y its baseline). Colours are palette role names.
 * Every animated value is a spring from where it is to a new target:
 *   enter: { at, from: {state}, spring, stagger }  from `from` to the layer's rest
 *   keys:  [{ at, to: {state}, spring, stagger }]  to a new target, in time order
 *   exit:  { at, to: {state}, spring, stagger }
 * A state may hold dx, dy (px from rest), rot (degrees added), scale, sx, sy
 * (factors), op (opacity), trim ([start, end] of the stroke, 0 to 1), shift
 * (moves the trimmed segment round a closed shape), fill (fill opacity),
 * morph (index into morphs), blur (text only, px).
 * A 'hold' loop ends on a still copy of frame 0: the last scene (wrap) is on
 * screen at rest at t = 0, leaves at wrap.exit, and is rebuilt at the end.
 * ========================================================================== */
const BPM = 120;
const beat = (n) => n * 60 / BPM;            // quarter notes
const bar = (n) => beat(4 * n);              // 4/4 bars

const FILM = {
  title: 'Acme Tasks shapes loop',
  alt: 'A checkbox draws itself and ticks: Done. Three tasks slide in and tick off: One list. A ring fills round the week: Every day. Acme, example.com. Demo copy, fictional product.',
  W: 1080, H: 1080, FPS: 60, DUR: bar(5), BPM,
  loop: 'hold',
  palette: { bg: '#111018', paper: '#F6F4EE', red: '#FF4F2E', sun: '#FFC21A', teal: '#2EC4B6', ink: '#111018' },
  fonts: {
    display: { family: 'Unbounded', weight: 700 },

    for (const k of ['spin', 'sway', 'bob', 'pulse', 'orbit', 'march']) if (B[k] != null) { const n = Array.isArray(B[k]) ? B[k][0] : B[k]; if (n) out.push({ what: `${L.id} ${k}`, period: DUR / Math.abs(n) }); }
  }
  return out;
}
function lastChange(see) {
  for (const Sc of SCENES) for (const L of Sc.layers) if (L.typed) { const en = L.spec.enter; see(en.at + (L.line.glyphs.length + (en.cursor !== false ? 3 : 1)) / FPS, `${L.id} finishes typing`); }
}
function stills(push) {
  for (const Sc of SCENES) {
    const lands = Sc.layers.flatMap((L) => (L.typed ? [L.spec.enter.at + L.line.glyphs.length / FPS] : L.copies.map((cp) => (cp.land != null ? cp.land + 0.25 : Sc.t0))));
    const exits = Sc.layers.map((L) => (L.spec.exit || Sc.spec.exit ? (L.spec.exit || Sc.spec.exit).at : Infinity));
    const landed = Math.max(Sc.t0, ...lands) + 0.1, end = Math.min(Sc.t1, ...exits) - 2 / FPS;
    let rest = Math.min(landed, end);
    if (Sc.punch && rest > Sc.punch.at - 2 / FPS) rest = Sc.punch.at - 2 / FPS >= landed - 0.1 - 1e-6 ? Sc.punch.at - 2 / FPS : Math.min(end, Sc.punch.at + settle(SP.PUNCH));
    if (Sc.in !== 'none' && Sc.t0 > 0) push((Sc.tr.kind === 'bars' ? Sc.t0 - Sc.tr.cover : Sc.t0 + 0.1) * FPS, `${Sc.id}-in`, `${Sc.in} into ${Sc.id}`);
    push(rest * FPS, `${Sc.id}-rest`, `${Sc.id} landed`);
  }
  const wrap = SCENES.find((s) => s.wrap);
  if (wrap) push(Math.max(1, Math.round(wrap.wrap.exit * FPS + 6)), 'loop-out', `${wrap.id} leaving, the first scene arriving`);
}
function layout() {
  const r = (v) => Math.round(v * 10) / 10;
  return { layers: Object.values(LAYERS).map((L) => ({ id: L.id, scene: L.scene.id, shape: L.spec.shape, copies: L.typed ? 1 : L.copies.length, box: L.box.map(r),
    ...(L.kind === 'text' ? { text: L.spec.text, size: r(L.line.size), capH: r(L.line.capH), capTop: r(L.line.capTop), baseline: L.line.baseline, trackEm: r(L.line.trackEm) } : { radius: r(L.R), length: r(L.geoms[0].len) }) })) };
}

function build() {
  buildScenes();
  for (const L of Object.values(LAYERS)) if (L.typed) {   // typed small print moves as one piece
    L.tc = { ox: 0, oy: 0, orot: 0, osc: 1, P: {}, phase: 0 };
    const Sc = L.scene;
    for (const key of Object.keys(KEYS)) L.tc.P[key] = new Prop(KEYS[key], `${L.id}.${key}`);
    if (Sc.wrap) { const w = Sc.wrap, v = stateVals(w.to || { scale: 0 }); for (const [k, x] of Object.entries(v)) L.tc.P[k].to(w.exit + (w.stagger ? noteSec(w.stagger) * L.li : 0), x, w.spring || 'EXIT'); for (const k of Object.keys(v)) L.tc.P[k].set(Sc.wrapEnd, KEYS[k]); }
    const ex = L.spec.exit || Sc.spec.exit;
    if (ex) for (const [k, x] of Object.entries(stateVals(ex.to))) L.tc.P[k].to(ex.at, x, springFor(k, ex.spring || 'EXIT'));
  }
}

boot({
  name: 'shapes',
  springs: { POP: [0.45, 22], BOUNCE: [0.35, 18], SNAP: [0.8, 40], SWING: [0.55, 14], TRACE: [1, 14], FILL: [1, 8], GLIDE: [1, 12] },
  build, draw: (c, t, q) => drawFrame(c, t, q), disp, checks, cycles, lastChange, stills, layout, visible,
  // a scene's bg fills the frame: the composition check reads it as background (FILM.backdrop overrides)
  backdrop: FILM.backdrop || [...new Set(FILM.scenes.map((s) => s.bg).filter(Boolean))],
});
})();
</script>
